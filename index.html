<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tritas CBT Studio — SMAN 3 Tasikmalaya</title>

  <!-- Google Fonts: Plus Jakarta Sans, Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Inter"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SheetJS (Excel .xls / .xlsx Import & Export) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- MathJax 3 (LaTeX Mathematical & Boolean Algebra Rendering) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    /* =========================================================================
       1. SEMANTIC DESIGN TOKENS & BASE TYPOGRAPHY
       ========================================================================= */
    :root {
      --bg-canvas: #F1F5F9;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --border-hairline: #CBD5E1;
      --ink-primary: #0F172A;
      --ink-secondary: #334155;
      --ink-muted: #64748B;
      --accent-primary: #1E3A5F;
      --accent-hover: #152A45;
      --accent-soft: #EFF4F9;
    }

    html.dark {
      --bg-canvas: #0B0F17;
      --bg-surface: #131926;
      --bg-subtle: #192132;
      --border-hairline: #293548;
      --ink-primary: #F1F5F9;
      --ink-secondary: #CBD5E1;
      --ink-muted: #94A3B8;
      --accent-primary: #3B82F6;
      --accent-hover: #2563EB;
      --accent-soft: rgba(59, 130, 246, 0.14);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      font-size: 14.5px;
      line-height: 1.65;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main, section, aside, article, .studio-card {
      min-width: 0;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    /* =========================================================================
       2. SURFACE CARDS, TOPBAR & BUTTONS
       ========================================================================= */
    .studio-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    html.dark .studio-card {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .studio-topbar {
      background-color: var(--bg-surface);
      border-bottom: 2px solid #1E3A5F;
    }

    html.dark .studio-topbar {
      background-color: #131926;
      border-bottom: 2px solid #334155;
    }

    .btn-sapphire {
      background-color: #1E3A5F;
      color: #FFFFFF;
      border: 1px solid #152A45;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .btn-sapphire:hover {
      background-color: #152A45;
    }
    html.dark .btn-sapphire {
      background-color: #2563EB;
      border-color: #1D4ED8;
    }
    html.dark .btn-sapphire:hover {
      background-color: #1D4ED8;
    }

    /* =========================================================================
       3. TABLES, HORIZONTAL TABS & STIMULUS CONTAINERS
       ========================================================================= */
    .table-scroll-wrap {
      width: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    @media (min-width: 768px) {
      .table-scroll-wrap { max-height: 72vh; }
    }

    .cbt-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      text-align: left;
    }
    .cbt-table.cbt-table { font-size: 0.8125rem; line-height: 1.4; }

    .cbt-table th,
    .cbt-table td {
      padding: 0.6rem 0.8rem;
      vertical-align: middle;
    }

    .cbt-table thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: nowrap;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #334155;
      background: #EEF2F7;
      border-bottom: 2px solid #CBD5E1;
    }
    .cbt-table tbody td {
      border-bottom: 1px solid #E2E8F0;
    }
    .cbt-table tbody tr:last-child td { border-bottom: 0; }
    .cbt-table tbody tr:nth-child(even) { background-color: #F8FAFC; }
    .cbt-table tbody tr:hover { background-color: #EAF1F9; }
    .cbt-table tbody tr.row-off td { color: #64748B; }
    .cbt-table tbody tr.row-off .font-semibold,
    .cbt-table tbody tr.row-off .font-bold { color: #64748B; }
    .cbt-table td.num, .cbt-table th.num { text-align: center; font-variant-numeric: tabular-nums; }
    .cbt-table td.col-aksi, .cbt-table th.col-aksi { text-align: right; white-space: nowrap; width: 1%; }
    .cbt-table td.col-chk, .cbt-table th.col-chk { width: 2.25rem; text-align: center; }

    @media (max-width: 767px) {
      .cbt-table td.col-aksi { position: sticky; right: 0; background: #FFFFFF; box-shadow: -6px 0 6px -6px rgba(15,23,42,0.18); }
      .cbt-table tbody tr:nth-child(even) td.col-aksi { background: #F8FAFC; }
      .cbt-table th.col-aksi { position: sticky; right: 0; z-index: 3; }
    }

    .tbl-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.9rem; height: 1.9rem; border-radius: 0.5rem;
      border: 1px solid #CBD5E1; background: #FFFFFF; color: #1E3A5F;
      cursor: pointer; transition: background-color 0.12s ease, border-color 0.12s ease;
    }
    .tbl-btn:hover { background: #F1F5F9; }
    .tbl-btn.warn { border-color: #FCD34D; background: #FFFBEB; color: #92400E; }
    .tbl-btn.warn:hover { background: #FEF3C7; }
    .tbl-btn.ok { border-color: #6EE7B7; background: #ECFDF5; color: #065F46; }
    .tbl-btn.ok:hover { background: #D1FAE5; }
    .tbl-btn.danger { border-color: #FECACA; background: #FFF1F2; color: #BE123C; }
    .tbl-btn.danger:hover { background: #FFE4E6; }
    .tbl-btn svg { width: 0.95rem; height: 0.95rem; }

    html.dark .cbt-table thead th { background: #1B2538; color: #CBD5E1; border-bottom-color: #334155; }
    html.dark .cbt-table tbody td { border-bottom-color: #263247; }
    html.dark .cbt-table tbody tr:nth-child(even) { background-color: #161E2E; }
    html.dark .cbt-table tbody tr:hover { background-color: #1E2A40; }
    html.dark .tbl-btn { background: #131926; border-color: #334155; color: #93C5FD; }


    /* =========================================================================
       ADMIN WORKSPACE: SIDEBAR NAVIGATION & HERO
       ========================================================================= */
    .adm-hero {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--border-hairline);
      background:
        radial-gradient(1200px 220px at 100% -40%, rgba(59,130,246,0.16), transparent 60%),
        linear-gradient(135deg, var(--bg-surface) 0%, var(--accent-soft) 140%);
      box-shadow: 0 1px 3px rgba(15,23,42,0.05);
    }
    .adm-hero::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: linear-gradient(180deg, #1E3A5F, #3B82F6);
    }
    .adm-stat {
      display: flex; align-items: center; gap: .65rem;
      padding: .6rem .85rem;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      min-width: 0;
    }
    .adm-stat-dot { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .adm-stat-num { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.1rem; line-height: 1.1; color: var(--ink-primary); }
    .adm-stat-lbl { font-size: 11px; color: var(--ink-muted); line-height: 1.2; }

    .adm-side {
      position: sticky;
      top: 4.75rem;
      max-height: calc(100vh - 5.75rem);
      overflow-y: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 16px;
      padding: .75rem;
      box-shadow: 0 1px 3px rgba(15,23,42,0.05);
      scrollbar-width: thin;
    }
    .adm-group-label {
      font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: var(--ink-muted); padding: .85rem .75rem .35rem;
    }
    .adm-group-label:first-child { padding-top: .25rem; }
    .adm-nav-item {
      width: 100%;
      display: flex; align-items: center; gap: .65rem;
      padding: .55rem .75rem;
      border-radius: 10px;
      font-size: 13px; font-weight: 600;
      color: var(--ink-secondary);
      text-align: left;
      transition: background-color .15s ease, color .15s ease, transform .1s ease;
    }
    .adm-nav-item .adm-ico {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-subtle); color: var(--accent-primary);
      transition: background-color .15s ease, color .15s ease;
    }
    .adm-nav-item:hover { background: var(--bg-subtle); color: var(--ink-primary); }
    .adm-nav-item.is-active {
      background: var(--accent-primary); color: #fff;
      box-shadow: 0 4px 12px rgba(30,58,95,0.25);
    }
    .adm-nav-item.is-active .adm-ico { background: rgba(255,255,255,0.18); color: #fff; }
    .adm-nav-badge {
      margin-left: auto; min-width: 20px; padding: 0 6px; height: 20px; border-radius: 999px;
      background: #E11D48; color: #fff; font-size: 10px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace;
    }
    .adm-side-foot {
      margin-top: .75rem; padding-top: .75rem; border-top: 1px dashed var(--border-hairline);
    }
    .adm-chip-nav {
      display: flex; gap: .4rem; overflow-x: auto; padding: .35rem;
      background: var(--bg-surface); border: 1px solid var(--border-hairline); border-radius: 14px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .adm-chip-nav::-webkit-scrollbar { display: none; }
    .adm-chip-nav button {
      flex-shrink: 0; white-space: nowrap; display: inline-flex; align-items: center; gap: .4rem;
      padding: .5rem .8rem; border-radius: 10px; font-size: 12px; font-weight: 600; color: var(--ink-secondary);
    }
    .adm-chip-nav button.is-active { background: var(--accent-primary); color: #fff; }
    .adm-page-head { display: flex; align-items: center; gap: .85rem; }
    .adm-page-ico {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent-soft); color: var(--accent-primary);
      border: 1px solid var(--border-hairline);
    }
    .adm-side { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; }
    .adm-group-label.is-priority { color: #B45309; display: flex; align-items: center; gap: .35rem; }
    .adm-nav-item.is-priority:not(.is-active) { background: #FFFBEB; border: 1px solid #FCD34D; }
    .adm-nav-item.is-priority:not(.is-active) .adm-ico { background: #FEF3C7; color: #B45309; }
    .adm-nav-item.is-priority { margin-bottom: .25rem; }
    .adm-chip-nav button.is-priority:not(.is-active) { background: #FFFBEB; color: #92400E; box-shadow: inset 0 0 0 1px #FCD34D; }
    .adm-subnav {
      display: flex; gap: 1.25rem; overflow-x: auto; scrollbar-width: none;
      border-bottom: 1px solid var(--border-hairline); padding: 0 .25rem;
    }
    .adm-subnav::-webkit-scrollbar { display: none; }
    .adm-subnav button {
      flex-shrink: 0; white-space: nowrap; padding: .6rem .15rem; margin-bottom: -1px;
      font-size: 12px; font-weight: 600; color: var(--ink-secondary);
      border-bottom: 2px solid transparent;
    }
    .adm-subnav button:hover { color: var(--accent-primary); }
    .adm-subnav button.is-active { color: var(--accent-primary); border-bottom-color: var(--accent-primary); }
    @media print { .adm-side, .adm-hero, .adm-chip-nav, .adm-subnav, .adm-page-head { display: none !important; } }

    .tab-strip {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 0.375rem;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }
    .tab-strip > button {
      flex-shrink: 0;
      white-space: nowrap;
    }

    .exam-prompt-body,
    .studio-option > div {
      overflow-wrap: break-word;
      word-break: break-word;
      min-width: 0;
    }

    .exam-prompt-body pre,
    .exam-prompt-body table,
    .studio-card pre {
      max-width: 100%;
      overflow-x: auto;
    }

    .exam-prompt-body p {
      margin-bottom: 0.85rem;
      line-height: 1.75;
    }
    .exam-prompt-body p:last-child {
      margin-bottom: 0;
    }
    .exam-prompt-body code:not(pre code) {
      padding: 0.14rem 0.42rem;
      border-radius: 5px;
      border: 1px solid #CBD5E1;
      background-color: #F1F5F9;
      color: #0F172A;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
      font-weight: 600;
    }
    html.dark .exam-prompt-body code:not(pre code) {
      border-color: #334155;
      background-color: #1E293B;
      color: #E2E8F0;
    }

    /* Crisp Light Canvas for Embedded SVG Diagrams in Both Light & Dark Mode */
    .stimulus-diagram-box {
      background-color: #FFFFFF !important;
      color: #0F172A !important;
      border: 1px solid #CBD5E1 !important;
    }

    /* =========================================================================
       4. EXAM ANSWER OPTIONS & MATRIX NAVIGATION
       ========================================================================= */
    .studio-option {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      width: 100%;
      text-align: left;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1.5px solid #CBD5E1;
      background-color: #FFFFFF;
      transition: border-color 0.12s ease, background-color 0.12s ease;
    }
    html.dark .studio-option {
      background-color: #161E2E;
      border-color: #293548;
    }
    .studio-option:hover {
      border-color: #1E3A5F;
      background-color: #F8FAFC;
    }
    html.dark .studio-option:hover {
      border-color: #60A5FA;
      background-color: #1E293B;
    }
    .studio-option.selected {
      border-color: #1E3A5F;
      background-color: #EFF4F9;
    }
    html.dark .studio-option.selected {
      border-color: #3B82F6;
      background-color: rgba(59, 130, 246, 0.15);
    }
    .studio-option-key {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid #94A3B8;
      background-color: #F8FAFC;
      color: #1E3A5F;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    html.dark .studio-option-key {
      border-color: #475569;
      background-color: #1E293B;
      color: #E2E8F0;
    }
    .studio-option.selected .studio-option-key {
      background-color: #1E3A5F;
      border-color: #1E3A5F;
      color: #FFFFFF;
    }
    html.dark .studio-option.selected .studio-option-key {
      background-color: #3B82F6;
      border-color: #3B82F6;
    }

    .matrix-btn {
      aspect-ratio: 1 / 1;
      border-radius: 7px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.8rem;
      border: 1.5px solid #CBD5E1;
      background-color: #FFFFFF;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease;
    }
    html.dark .matrix-btn {
      border-color: #334155;
      background-color: #192132;
      color: #E2E8F0;
    }
    .matrix-btn:hover {
      border-color: #1E3A5F;
    }
    .matrix-btn.answered {
      background-color: #1E3A5F;
      border-color: #1E3A5F;
      color: #FFFFFF;
    }
    html.dark .matrix-btn.answered {
      background-color: #2563EB;
      border-color: #2563EB;
    }
    .matrix-btn.flagged {
      background-color: #B45309 !important;
      border-color: #92400E !important;
      color: #FFFFFF !important;
    }
    .matrix-btn.active {
      outline: 2px solid #0F172A;
      outline-offset: 2px;
      font-weight: 800;
    }
    html.dark .matrix-btn.active {
      outline-color: #F8FAFC;
    }

    /* =========================================================================
       5. DARK MODE SURFACE & FORM HARMONIZATION
       ========================================================================= */
    html.dark .text-slate-900 { color: #F1F5F9 !important; }
    html.dark .text-slate-800 { color: #E2E8F0 !important; }
    html.dark .text-slate-700 { color: #CBD5E1 !important; }
    html.dark .text-slate-600 { color: #94A3B8 !important; }
    html.dark .text-slate-500 { color: #94A3B8 !important; }
    html.dark .text-\[\#1E3A5F\] { color: #60A5FA !important; }
    html.dark .bg-white { background-color: #131926 !important; }
    html.dark .bg-slate-50,
    html.dark .bg-slate-50\/60,
    html.dark .bg-slate-50\/70,
    html.dark .bg-slate-50\/90 { background-color: #192132 !important; }
    html.dark .bg-slate-100 { background-color: #1E293B !important; }
    html.dark .bg-\[\#EFF4F9\],
    html.dark .bg-blue-50,
    html.dark .bg-blue-50\/40 { background-color: rgba(59, 130, 246, 0.12) !important; }
    html.dark .border-slate-200,
    html.dark .border-slate-300,
    html.dark .border-blue-200 { border-color: #293548 !important; }
    html.dark .divide-slate-200 > :not([hidden]) ~ :not([hidden]) { border-color: #293548 !important; }
    html.dark input:not([type="checkbox"]):not([type="radio"]),
    html.dark select,
    html.dark textarea {
      color: #F1F5F9 !important;
      background-color: #192132 !important;
      border-color: #334155 !important;
    }

    /* =========================================================================
       6. ANIMATIONS, EXAM LOCK & PRINT MEDIA
       ========================================================================= */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.16s ease forwards;
    }

    body.exam-mode .hide-exam {
      display: none !important;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 4px; }

    @media print {
      .no-print { display: none !important; }
      body { background: #FFFFFF !important; color: #000000 !important; font-size: 11pt; }
      .studio-card { box-shadow: none !important; border: 1px solid #94A3B8 !important; background: #FFFFFF !important; }
      .table-scroll-wrap { max-height: none !important; overflow: visible !important; }
      .cbt-table thead th { position: static; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- =========================================================================
       APP SHELL: STICKY HEADER
       ========================================================================= -->
  <header class="sticky top-0 z-40 studio-topbar no-print">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 min-h-14 py-2 flex items-center justify-between gap-2 sm:gap-4">
      <div class="flex items-center gap-2.5 sm:gap-3 min-w-0 flex-1">
        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-[#1E3A5F] text-white flex items-center justify-center font-mono-code font-bold text-xs tracking-wider shrink-0 shadow-xs">
          CBT
        </div>
        <div class="min-w-0">
          <div class="font-bold text-xs sm:text-sm md:text-base tracking-tight text-slate-900 truncate">
            Sistem Asesmen Berbasis Komputer
          </div>
          <div class="text-[11px] text-slate-500 truncate">
            SMA Negeri 3 Tasikmalaya &bull; NPSN 20224509
          </div>
        </div>
      </div>

      <div id="header-exam-telemetry" class="hidden md:flex items-center gap-2.5 shrink-0"></div>

    // Normalisasi Format Nama Kelas (contoh: xi-f1 / XI-F1 / XI F 1 -> XI.F-1)
    function normalizeClassName(raw) {
      const clean = String(raw || '').trim().toUpperCase().replace(/\s+/g, '');
      const m = clean.match(/^(X|XI|XII)[\.\-_]?([A-Z])[\.\-_]?(\d+)$/);
      if (m) return `${m[1]}.${m[2]}-${Number(m[3])}`;
      return String(raw || 'XI.F-1').trim();
    }

    function sortClassNames(classList) {
      return [...classList].sort((a, b) => a.localeCompare(b, 'id', { numeric: true, sensitivity: 'base' }));
    }

        deviceInfo: '-',
        violations: 0,
        workstation: 'PC-01',
        remedialScore: null,
        lastQuestionIndex: 0,
        savedRemainingSeconds: null,
        savedFlagged: {},
        answers: {},
        essayScores: {},
        essayFeedbacks: {}
      });

      const byName = (a, b) => a.name.localeCompare(b.name, 'id', { sensitivity: 'base' })
        || a.className.localeCompare(b.className, 'id', { numeric: true, sensitivity: 'base' });

      const allStudentObjects = [];
      // Kelas XI memakai penempatan lab bawaan; Kelas X & XII belum punya ruang/sesi (diatur Admin di menu Data Peserta)
      const classGroups = [
        { prefix: 'XI.F', useLab: true },
        { prefix: 'X.E', useLab: false },
        { prefix: 'XII.F', useLab: false }
      ];
      let idSeq = 0;
      classGroups.forEach(g => {
        const groupStudents = [];
        for (let clsNum = 1; clsNum <= 12; clsNum++) {
          const className = `${g.prefix}-${clsNum}`;
          const slot = g.useLab ? labScheduleMap[clsNum] : { room: 'Belum diatur', session: 'Belum diatur' };
          const classStudents = excelRows
            .filter(r => r[0] === className)
            .map(r => makeStudentObj(r[0], r[1], r[2], r[3], r[4], slot.room, slot.session));

          // Urutkan per rombel berdasarkan nama (A-Z) lalu beri nomor PC sesuai urutan
          classStudents.sort(byName);
          classStudents.forEach((st, i) => {
            st.workstation = `PC-${String(i + 1).padStart(2, '0')}`;
            groupStudents.push(st);
          });
        }
        // ID per tingkat berurutan nama (A-Z); ID siswa XI tetap sama seperti sebelumnya
        groupStudents.sort(byName);
        groupStudents.forEach(st => { st.id = `STD-${String(++idSeq).padStart(3, '0')}`; });
        allStudentObjects.push(...groupStudents);
      });

      // Urutkan seluruh peserta berdasarkan nama (A-Z)
      allStudentObjects.sort(byName);

      state.students = allStudentObjects;
    })();

    // Pengurutan data peserta berdasarkan nama (A-Z)
    function sortStudentsByName(list, direction = 'asc') {
      const factor = direction === 'desc' ? -1 : 1;
      return [...(list || [])].sort((a, b) => {
        const cmpName = String(a.name || '').localeCompare(String(b.name || ''), 'id', { sensitivity: 'base' });
        if (cmpName !== 0) return cmpName * factor;
        return String(a.className || '').localeCompare(String(b.className || ''), 'id', { numeric: true, sensitivity: 'base' });
      });
    }

    // =========================================================================
    // 2. CORE ENGINE: PERSISTENCE, SCORING, PSYCHOMETRICS & CROSS-ROLE SYNC
    // =========================================================================
    const STUDENT_DATASET_VERSION = '26_27_X_XI_XII_EXCEL_1433_NAME_SORTED';
    const PX_KEYS = ['students', 'schedules', 'rooms', 'staffAccounts', 'deletedTeacherIds', 'schoolInfo', 'examConfig', 'examPackages', 'questions', 'lastBackupAt'];
    const DEFAULT_STAFF_ACCOUNTS = JSON.parse(JSON.stringify(state.staffAccounts));
    const DEFAULT_EXAM_PACKAGES = JSON.parse(JSON.stringify(state.examPackages));
    const DEFAULT_SEED_QUESTIONS = JSON.parse(JSON.stringify(state.questions));
    (function hydrateSavedState() {
      try {
        const d = JSON.parse(localStorage.getItem('tritas_cbt_studio_v2') || 'null');
        if (d) {
          PX_KEYS.forEach(k => {
            if (k === 'students' && d.studentDatasetVersion !== STUDENT_DATASET_VERSION) {
              // Dataset peserta berganti (sumber: Excel): data peserta lama dibuang seluruhnya, tidak digabung
              return;
            }
            if (d[k] !== undefined) state[k] = d[k];
          });
          // Pastikan akun staf bawaan yang baru ditambahkan tetap tersedia
          DEFAULT_STAFF_ACCOUNTS.forEach(defAcc => {
            const exists = state.staffAccounts.some(acc => acc.id === defAcc.id || (acc.role === defAcc.role && acc.username === defAcc.username));
            if (!exists) state.staffAccounts.push(defAcc);
          });
          // Pastikan paket ujian bawaan terbaru (termasuk PKG-GUR-03) tetap tersedia
          DEFAULT_EXAM_PACKAGES.forEach(defPkg => {
            if (!state.examPackages.some(p => p.id === defPkg.id)) {
              state.examPackages.push(defPkg);
            }
          });
          // Pastikan butir soal bawaan terbaru (termasuk PU01-PU11) tetap tersedia
          DEFAULT_SEED_QUESTIONS.forEach(defQ => {
            if (!state.questions.some(q => q.id === defQ.id)) {
              state.questions.push(defQ);
            }
          });
        }
        // Penyeragaman KKTP bawaan 75 -> 61 (batas "sudah mencapai" menurut PPA 2025); nilai kustom lain tidak diubah. Sekali jalan.
        try {
          if (localStorage.getItem('tritas_cbt_kktp61') !== '1') {
            (state.examPackages || []).forEach(pk => { if (Number(pk.kktp) === 75) pk.kktp = 61; });
            if (state.examConfig && Number(state.examConfig.kktp) === 75) state.examConfig.kktp = 61;
            localStorage.setItem('tritas_cbt_kktp61', '1');
          }
        } catch (e) {}
        state.students = sortStudentsByName(state.students);
        pxApplyTeacherTombstones();
      } catch (e) {}
    })();

    Object.assign(state, {
      auditLog: [],
      banners: [],
      sessionTokens: {},
      userQ: ''
    });

    try {
      const savedAudit = JSON.parse(localStorage.getItem('tritas_cbt_audit_v2') || '[]');
      if (Array.isArray(savedAudit)) state.auditLog = savedAudit;
    } catch (e) {}


    // =========================================================================
    // HAPUS AKUN GURU + SELURUH DATA TURUNANNYA (paket, soal, jadwal, hasil siswa)
    // =========================================================================
    function pxTeacherImpact(id) {
      const pkgIds = state.examPackages.filter(p => p.ownerId === id).map(p => p.id);
      const qCount = state.questions.filter(q => q.ownerId === id || pkgIds.includes(q.packageId)).length;
      const schCount = state.schedules.filter(sc => sc.ownerId === id || pkgIds.includes(sc.packageId)).length;
      const activeDeleted = pkgIds.includes(state.examConfig.activePackageId);
      const resultCount = state.students.reduce((n, st) => {
        let c = Object.keys(st.results || {}).filter(k => pkgIds.includes(k)).length;
        if (activeDeleted && hasExamData(st)) c++;
        return n + c;
      }, 0);
      return { pkgIds, pkgCount: pkgIds.length, qCount, schCount, resultCount, activeDeleted };
    }

    function pxPurgeTeacherData(id, opts = {}) {
      const acc = state.staffAccounts.find(a => a.id === id);
      const impact = pxTeacherImpact(id);
      const gone = new Set(impact.pkgIds);

      state.questions = state.questions.filter(q => !(q.ownerId === id || gone.has(q.packageId)));
      state.schedules = state.schedules.filter(sc => !(sc.ownerId === id || gone.has(sc.packageId)));
      state.examPackages = state.examPackages.filter(p => !gone.has(p.id));
      state.examPackages.forEach(p => {
        if (Array.isArray(p.sharedWith)) p.sharedWith = p.sharedWith.filter(x => x !== id);
      });

      state.students.forEach(st => {
        if (st.results) gone.forEach(k => { delete st.results[k]; });
        if (impact.activeDeleted) {
          Object.assign(st, {
            status: 'Belum Login', loginTime: '-', finishTime: '-', duration: '-', finishedAt: null,
            violations: 0, remedialScore: null, lastQuestionIndex: 0, savedRemainingSeconds: null,
            savedFlagged: {}, answers: {}, essayScores: {}, essayFeedbacks: {}
          });
        }
      });

      if (acc) state.rooms.forEach(r => { if (r.proctor === acc.name) r.proctor = '-'; });
      state.staffAccounts = state.staffAccounts.filter(a => a.id !== id);
      if (!Array.isArray(state.deletedTeacherIds)) state.deletedTeacherIds = [];
      if (!state.deletedTeacherIds.includes(id)) state.deletedTeacherIds.push(id);

      if (gone.has(state.selectedTeacherPackageId)) state.selectedTeacherPackageId = null;
      if (gone.has(state.hasilPackageId)) state.hasilPackageId = null;
      if (gone.has(state.adminHasilPackageId)) state.adminHasilPackageId = null;
      if (state.adminSoalFilter && (state.adminSoalFilter.teacher === id || gone.has(state.adminSoalFilter.pkg))) {
        state.adminSoalFilter.teacher = state.adminSoalFilter.teacher === id ? 'ALL' : state.adminSoalFilter.teacher;
        if (gone.has(state.adminSoalFilter.pkg)) state.adminSoalFilter.pkg = 'ALL';
      }
      if (state.adminBankTeacherFilter === id) state.adminBankTeacherFilter = 'ALL';
      state.adminSoalSel = [];

      // Paket aktif ikut terhapus: pindahkan ke paket lain bila ada, jika tidak kosongkan konfigurasi ujian aktif
      if (impact.activeDeleted) {
        state.examConfig.activePackageId = '';
        Object.assign(state.studentSession, {
          step: 'portal', agreedRules: false, currentQuestionIndex: 0, lastQuestionIndex: 0,
          savedRemainingSeconds: null, serverDeadlineMs: null, answers: {}, flagged: {}, savedFlagged: {},
          violations: 0, antiCheatLogs: [], questionOrder: null, optionOrders: {}, paused: false
        });
        if (!opts.silent && typeof timerInterval !== 'undefined' && timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        const next = state.examPackages[0];
        if (next) {
          syncPackageAcrossSystem(next, { activateForStudents: true, silent: true });
        } else {
          Object.assign(state.examConfig, {
            ownerId: '', title: 'Belum ada paket ujian aktif', subject: '-', topic: '-', cp: '', atp: '',
            teacher: '-', teacherNip: '-', targetQuestionCount: 0
          });
        }
      } else if (state.examConfig.ownerId === id) {
        state.examConfig.ownerId = '';
      }

      if (!opts.silent) pxLog('Hapus Akun Guru + Seluruh Data', acc ? `${acc.name} (${acc.nip})` : id,
        `${impact.pkgCount} paket, ${impact.qCount} butir soal, ${impact.schCount} jadwal, ${impact.resultCount} hasil peserta ikut terhapus`, null);
      return impact;
    }

    function pxApplyTeacherTombstones() {
      (state.deletedTeacherIds || []).forEach(id => {
        const hasData = state.staffAccounts.some(a => a.id === id)
          || state.examPackages.some(p => p.ownerId === id)
          || state.questions.some(q => q.ownerId === id)
          || state.schedules.some(sc => sc.ownerId === id);
        if (hasData) pxPurgeTeacherData(id, { silent: true });
      });
    }

    let pxSaveT = 0;
    const pxSnap = () => JSON.stringify({
      studentDatasetVersion: STUDENT_DATASET_VERSION,
      ...Object.fromEntries(PX_KEYS.map(k => [k, state[k]]))
    }, (k, v) => k === 'rt' ? undefined : v);

    function pxSave() {
      const now = Date.now();
      if (now - pxSaveT < 900) return;
      pxSaveT = now;
      try { localStorage.setItem('tritas_cbt_studio_v2', pxSnap()); } catch (e) {}
    }

    function pxSaveImmediate() {
      pxSaveT = 0;
      pxSave();
    }

    const pxEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pxFmt = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
    const pxTime = ts => new Date(ts).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const pxMax = () => state.examConfig.maxViolations || 3;
    const pxLive = s => s.id === state.studentSession.studentId && state.studentSession.step === 'exam';
    const pxHas = v => v !== undefined && v !== '' && !(Array.isArray(v) && !v.length) && !(v && typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length);
    const pxMs = () => Math.max(1, state.examConfig.tokenRotationMinutes || 20) * 60000;
    const pxGen = () => {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let token = '';
      for (let i = 0; i < 6; i++) token += chars[Math.floor(Math.random() * chars.length)];
      return token;
    };

    function pxTok(room) {
      if (!state.sessionTokens[room]) {
        state.sessionTokens[room] = { token: state.examConfig.token, locked: false, next: Date.now() + pxMs() };
      }
      return state.sessionTokens[room];
    }

    function pxDismiss(bannerId) {
      state.studentSession.dismissedBanner = bannerId;
      renderApp();
    }

    function getActiveStudent() {
      return state.students.find(s => s.id === state.studentSession.studentId) || state.students[0];
    }

    // ===== UJIAN SUSULAN PER SISWA (paket sama, jadwal khusus peserta tertentu) =====
    const pxIsSus = sch => !!sch && sch.type === 'Ujian Susulan';
    // ===== TARGET KELAS PAKET SOAL (Semua kelas / Pilih kelas) =====
    function pxPkgClasses(pkg) {
      return pkg && pkg.classMode === 'SELECT' && Array.isArray(pkg.targetClasses) ? pkg.targetClasses : [];
    }
    function pxPkgAppliesToStudent(pkg, st) {
      const t = pxPkgClasses(pkg);
      return !t.length || !st || t.includes(st.className);
    }
    function pxPkgClassLabel(pkg) {
      const t = pxPkgClasses(pkg);
      return t.length ? t.join(', ') : 'Semua kelas';
    }
    function pxAllClassNames() {
      return sortClassNames([...new Set(state.students.map(x => x.className).filter(Boolean))]);
    }
    // Tingkat kelas: dipakai seragam di semua filter/pilihan kelas (menu admin & guru)
    const PX_LEVELS = [
      { id: 'X', label: 'Kelas X', fase: 'Fase E' },
      { id: 'XI', label: 'Kelas XI', fase: 'Fase F' },
      { id: 'XII', label: 'Kelas XII', fase: 'Fase F' }
    ];
    function pxLevelOf(cls) { return String(cls || '').split('.')[0]; }
    // <option> dikelompokkan per tingkat (optgroup); labelFn opsional untuk teks tambahan
    function pxClassOptions(classes, selected, labelFn) {
      const known = new Set(PX_LEVELS.map(L => L.id));
      const opt = c => `<option value="${pxEsc(c)}" ${selected === c ? 'selected' : ''}>${labelFn ? labelFn(c) : pxEsc(c)}</option>`;
      const groups = PX_LEVELS.map(L => {
        const items = classes.filter(c => pxLevelOf(c) === L.id);
        return items.length ? `<optgroup label="${L.label} (${L.fase}) — ${items.length} kelas">${items.map(opt).join('')}</optgroup>` : '';
      }).join('');
      const others = classes.filter(c => !known.has(pxLevelOf(c)));
      return groups + (others.length ? `<optgroup label="Lainnya">${others.map(opt).join('')}</optgroup>` : '');
    }
    // Baris pemisah tingkat untuk tabel rekap per kelas
    function pxLevelRow(list, i, cols) {
      const lv = pxLevelOf(list[i].cls);
      if (i > 0 && pxLevelOf(list[i - 1].cls) === lv) return '';
      const L = PX_LEVELS.find(x => x.id === lv);
      const n = list.filter(x => pxLevelOf(x.cls) === lv).length;
      return `<tr class="bg-slate-100"><td colspan="${cols}" class="font-bold text-[11px] uppercase tracking-wider text-slate-600">${L ? `${L.label} (${L.fase})` : pxEsc(lv)} &bull; ${n} kelas</td></tr>`;
    }
    // Kelas yang relevan untuk sebuah paket: kelas target (jika dipilih) atau semua kelas
    function pxPkgScopeClasses(pkg) {
      const all = pxAllClassNames();
      const t = pxPkgClasses(pkg);
      return t.length ? all.filter(c => t.includes(c)) : all;
    }
    function pxGradeFromClasses(list) {
      const lv = PX_LEVELS.filter(L => list.some(c => pxLevelOf(c) === L.id));
      if (!lv.length) return '';
      const fase = [...new Set(lv.map(L => L.fase))].join(' / ');
      return `Kelas ${lv.map(L => L.id).join(' & ')} (${fase})`;
    }
    function pxSetPkgClassMode(mode) {
      const pkg = getActiveTeacherPackage();
      if (!pkg) return;
      pkg.classMode = mode === 'SELECT' ? 'SELECT' : 'ALL';
      if (!Array.isArray(pkg.targetClasses)) pkg.targetClasses = [];
      updateTeacherPackageField('classMode', pkg.classMode);
    }
    function pxSetPkgTargets(list) {
      const pkg = getActiveTeacherPackage();
      if (!pkg) return;
      const sorted = sortClassNames([...new Set(list)]);
      // Label "Fase / Tingkat Kelas" mengikuti kelas yang dipilih agar tidak saling bertentangan
      if (sorted.length) pkg.grade = pxGradeFromClasses(sorted);
      updateTeacherPackageField('targetClasses', sorted);
    }
    function pxTogglePkgClass(cls, on) {
      const pkg = getActiveTeacherPackage();
      if (!pkg) return;
      const cur = new Set(Array.isArray(pkg.targetClasses) ? pkg.targetClasses : []);
      if (on) cur.add(cls); else cur.delete(cls);
      pxSetPkgTargets([...cur]);
    }
    function pxPkgClassBulk(on) {
      pxSetPkgTargets(on ? pxAllClassNames() : []);
    }
    function pxPkgClassLevel(level, on) {
      const pkg = getActiveTeacherPackage();
      if (!pkg) return;
      const cur = new Set(Array.isArray(pkg.targetClasses) ? pkg.targetClasses : []);
      pxAllClassNames().filter(c => pxLevelOf(c) === level).forEach(c => { if (on) cur.add(c); else cur.delete(c); });
      pxSetPkgTargets([...cur]);
    }
    function pxPkgClassBlocked(pkg) {
      return !!pkg && pkg.classMode === 'SELECT' && pxPkgClasses(pkg).length === 0;
    }
    function pxSchedApplies(sch, st) {
      if (!pxIsSus(sch)) {
        const pkg = state.examPackages.find(p => p.id === sch.packageId);
        return pxPkgAppliesToStudent(pkg, st);
      }
      return !!st && Array.isArray(sch.targetStudentIds) && sch.targetStudentIds.includes(st.id);
    }
    function pxSusSched(st) {
      const id = state.studentSession.schedId;
      const sch = id ? state.schedules.find(x => x.id === id) : null;
      return sch && pxIsSus(sch) && sch.status === 'Berlangsung' && pxSchedApplies(sch, st) ? sch : null;
    }

    function curToken() {
      const s = getActiveStudent();
      const sus = pxSusSched(s);
      if (sus && sus.token) return sus.token;
      return s && s.room && s.room !== 'Belum diatur' ? pxTok(s.room).token : state.examConfig.token;
    }

    function pxScope() {
      const u = state.authSession.user;
      if (!u || state.currentRole !== 'admin') return null;
      const a = state.staffAccounts.find(x => x.name === u.name && x.role === 'admin');
      return a && a.labs && a.labs.length ? a.labs : null;
    }

    const pxAllowed = r => { const sc = pxScope(); return !sc || sc.includes(r); };
    const pxLabsAll = () => [...new Set(state.students.map(s => s.room))].filter(r => r && r !== 'Belum diatur');
    const pxLabs = () => pxLabsAll().filter(r => pxAllowed(r));

    function pxLog(action, target, reason, actor) {
      const u = state.authSession.user;
      state.auditLog.unshift({ ts: Date.now(), actor: actor || (u ? u.name : 'Sistem'), action, target: target || '-', reason: reason || '-' });
      if (state.auditLog.length > 500) state.auditLog.length = 500;
      try { localStorage.setItem('tritas_cbt_audit_v2', JSON.stringify(state.auditLog)); } catch (e) {}
    }

    function pxRt(s) {
      if (!s.rt) {
        const i = state.students.indexOf(s);
        const act = s.status === 'Sedang Mengerjakan';
        const el = act ? 300 + (i * 97) % 2400 : 0;
        s.rt = { extraSec: 0, pausedAt: null, startMs: Date.now() - el * 1000 };
      }
      return s.rt;
    }

    function pxView(s) {
      const r = pxRt(s);
      const ss = state.studentSession;
      const L = pxLive(s);
      const tot = getActiveExamQuestions().length;
      return {
        tot,
        ans: L ? Object.values(ss.answers).filter(pxHas).length : Object.values(s.answers || {}).filter(pxHas).length,
        rem: s.status !== 'Sedang Mengerjakan' ? null : L ? ss.remainingSeconds : Math.max(0, state.examConfig.durationMinutes * 60 + r.extraSec - ((r.pausedAt || Date.now()) - r.startMs) / 1000)
      };
    }

    function getCurrentTeacherAccount() {
      const u = state.authSession.user;
      if (!u || state.currentRole !== 'guru') return state.staffAccounts.find(a => a.role === 'guru') || null;
      return state.staffAccounts.find(a => a.role === 'guru' && (a.id === u.id || a.name === u.name || a.username === u.username))
        || state.staffAccounts.find(a => a.role === 'guru')
        || null;
    }

    function getTeacherPackages(teacherAcc) {
      const acc = teacherAcc || getCurrentTeacherAccount();
      if (!acc) return state.examPackages;
      const list = state.examPackages.filter(p => p.ownerId === acc.id || (Array.isArray(p.sharedWith) && p.sharedWith.includes(acc.id)));
      if (list.length === 0) {
        const defaultPkg = {
          id: 'PKG-' + acc.id + '-' + Date.now().toString().slice(-4),
          ownerId: acc.id,
          ownerName: acc.name,
          examCategory: 'Asesmen Sumatif Akhir Semester (ASAS)',
          title: `Asesmen Sumatif Akhir Semester (ASAS) — ${acc.subject || 'Informatika'}`,
          subject: acc.subject || 'Informatika',
          topic: 'Evaluasi Capaian Pembelajaran',
          cp: 'Peserta didik mampu memahami dan menerapkan konsep inti Informatika sesuai fase pembelajaran.',
          atp: '1.1 Memahami konsep dasar; 1.2 Menerapkan pemecahan masalah komputasional.',
          targetQuestionCount: 10,
          grade: 'Fase E / F',
          durationMinutes: 90,
          kktp: 61,
          maxViolations: 3,
          randomizeQuestions: false,
          randomizeOptions: false,
          showScoreToStudent: true,
          publishState: 'DRAFT'
        };
        state.examPackages.push(defaultPkg);
        return [defaultPkg];
      }
      return list;
    }

    function getActiveTeacherPackage(teacherAcc) {
      const pkgs = getTeacherPackages(teacherAcc);
      let active = pkgs.find(p => p.id === state.selectedTeacherPackageId);
      if (!active) {
        active = pkgs[0];
        state.selectedTeacherPackageId = active.id;
      }
      return active;
    }

    function getEffectiveExamConfig() {
      if (state.currentRole === 'guru') {
        const pkg = getActiveTeacherPackage();
        if (pkg) return pkg;
      }
      return state.examConfig;
    }

    function getQuestionsForPackage(pkg) {
      if (!pkg) return [];
      const byPkg = state.questions.filter(q => q.packageId === pkg.id);
      if (byPkg.length > 0) return byPkg;
      return state.questions.filter(q => q.ownerId === pkg.ownerId && !q.packageId);
    }

    function getTeacherQuestions(teacherAcc) {
      const acc = teacherAcc || getCurrentTeacherAccount();
      if (!acc) return state.questions;
      const activePkg = getActiveTeacherPackage(acc);
      return state.questions.filter(q =>
        (q.packageId && q.packageId === activePkg.id) ||
        (q.ownerId === acc.id && !q.packageId)
      );
    }

    function getActiveExamQuestions() {
      const acc = getCurrentTeacherAccount();
      if (state.currentRole === 'guru' && acc) {
        const activePkg = getActiveTeacherPackage(acc);
        const pool = getQuestionsForPackage(activePkg).filter(q => q.included);
        if (pool.length > 0) return pool;
      }
      const activePkgId = state.examConfig.activePackageId || 'PKG-GUR-01';
      const pkgObj = state.examPackages.find(p => p.id === activePkgId);
      if (pkgObj) {
        const pool = getQuestionsForPackage(pkgObj).filter(q => q.included);
        if (pool.length > 0) return pool;
      }
      const fallback = state.questions.filter(q => q.included && q.ownerId === (state.examConfig.ownerId || 'GUR-01'));
      if (fallback.length > 0) return fallback;
      const anyIncluded = state.questions.filter(q => q.included);
      return anyIncluded.length > 0 ? anyIncluded : state.questions;
    }

    function getPackageReadiness(pkg) {
      if (!pkg) return { ready: false, activeCount: 0, targetCount: 0, totalWeight: 0, linkedSchedules: [], issues: ['Paket tidak ditemukan'] };
      const qs = getQuestionsForPackage(pkg).filter(q => q.included);
      const activeCount = qs.length;
      const targetCount = Number(pkg.targetQuestionCount || activeCount || 1);
      const totalWeight = qs.reduce((s, q) => s + Number(q.weight || 0), 0);
      const linkedSchedules = state.schedules.filter(s => s.packageId === pkg.id);
      const issues = [];
      if (activeCount === 0) issues.push('Belum ada butir soal aktif');
      if (activeCount < targetCount) issues.push(`Kurang ${targetCount - activeCount} butir soal dari target (${activeCount}/${targetCount})`);
      if (totalWeight !== 100) issues.push(`Total bobot ${totalWeight} poin (disarankan 100)`);
      return {
        ready: activeCount > 0 && activeCount >= targetCount,
        activeCount,
        targetCount,
        totalWeight,
        linkedSchedules,
        issues
      };
    }

    function syncAllSystemEntities(notify = false) {
      state.students = sortStudentsByName(state.students);
      const activePkg = state.examPackages.find(p => p.id === state.examConfig.activePackageId) || state.examPackages[0];
      if (activePkg) {
        syncPackageAcrossSystem(activePkg, { activateForStudents: true, silent: true });
      }
      const validClasses = [...new Set(state.students.map(s => s.className))];
      if (state.rekapClassFilter !== 'ALL' && !validClasses.includes(state.rekapClassFilter)) {
        state.rekapClassFilter = 'ALL';
      }
      if (state.adminUserClassFilter !== 'ALL' && !validClasses.includes(state.adminUserClassFilter)) {
        state.adminUserClassFilter = 'ALL';
      }
      if (state.adminMonitorFilter.className !== 'ALL' && !validClasses.includes(state.adminMonitorFilter.className)) {
        state.adminMonitorFilter.className = 'ALL';
      }
      state.lastSyncedAt = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      pxSaveImmediate();
      if (notify) {
        renderApp();
        showToast('Sinkronisasi Berhasil', `Data ${state.students.length} Siswa (Kelas X, XI, XII), Guru, dan Admin diselaraskan.`, 'success');
      }
    }

    function syncPackageAcrossSystem(pkg, options = {}) {
      if (!pkg) return;
      const { activateForStudents = false, silent = false } = options;

      if (activateForStudents && state.examConfig.activePackageId && state.examConfig.activePackageId !== pkg.id) {
        pxArchiveLiveResults(state.examConfig.activePackageId, pkg);
      }

      let updatedSchedulesCount = 0;
      state.schedules.forEach(sch => {
        if (sch.packageId === pkg.id) {
          sch.subject = pkg.subject;
          sch.topic = pkg.topic;
          sch.duration = Number(pkg.durationMinutes || sch.duration || 90);
          sch.grade = pkg.grade || sch.grade;
          sch.ownerId = pkg.ownerId;
          if (activateForStudents && !pxIsSus(sch)) sch.status = 'Berlangsung';
          updatedSchedulesCount++;
        } else if (activateForStudents && sch.status === 'Berlangsung') {
          sch.status = 'Terjadwal';
        }
      });

      const isCurrentlyActive = state.examConfig.activePackageId === pkg.id || activateForStudents;
      if (isCurrentlyActive) {
        const ownerAcc = state.staffAccounts.find(a => a.id === pkg.ownerId);
        Object.assign(state.examConfig, {
          activePackageId: pkg.id,
          ownerId: pkg.ownerId,
          examCategory: pkg.examCategory || 'Asesmen Sumatif',
          title: pkg.title,
          subject: pkg.subject,
          topic: pkg.topic,
          cp: pkg.cp,
          atp: pkg.atp,
          targetQuestionCount: Number(pkg.targetQuestionCount || 10),
          grade: pkg.grade,
          teacher: ownerAcc ? ownerAcc.name : state.examConfig.teacher,
          teacherNip: ownerAcc ? ownerAcc.nip : state.examConfig.teacherNip,
          durationMinutes: Number(pkg.durationMinutes || 90),
          kktp: Number(pkg.kktp || 61),
          maxViolations: Number(pkg.maxViolations || 3),
          randomizeQuestions: !!pkg.randomizeQuestions,
          randomizeOptions: !!pkg.randomizeOptions,
          showScoreToStudent: !!pkg.showScoreToStudent
        });
        pkg.publishState = 'PUBLISHED_ACTIVE';
      }

      state.lastSyncedAt = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      if (!silent) {
        pxLog(
          activateForStudents ? 'Aktivasi Paket & Sinkronisasi Sistem' : 'Sinkronisasi Paket Guru-Admin-Siswa',
          pkg.title,
          `Jadwal tersinkron: ${updatedSchedulesCount} sesi`,
          null
        );
      }
    }

    function getOrderedQuestionsForStudent() {
      const active = getActiveExamQuestions();
      const ss = state.studentSession;
      if (!state.examConfig.randomizeQuestions) return active;
      if (!Array.isArray(ss.questionOrder) || ss.questionOrder.length !== active.length) {
        const ids = active.map(q => q.id);
        for (let i = ids.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [ids[i], ids[j]] = [ids[j], ids[i]];
        }
        ss.questionOrder = ids;
      }
      const map = new Map(active.map(q => [q.id, q]));
      const ordered = ss.questionOrder.map(id => map.get(id)).filter(Boolean);
      return ordered.length === active.length ? ordered : active;
    }

    function getOrderedOptionsForQuestion(q) {
      const opts = q.options || [];
      if (!state.examConfig.randomizeOptions || opts.length === 0) return opts;
      const ss = state.studentSession;
      if (!ss.optionOrders) ss.optionOrders = {};
      if (!Array.isArray(ss.optionOrders[q.id]) || ss.optionOrders[q.id].length !== opts.length) {
        const keys = opts.map(o => o.key);
        for (let i = keys.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [keys[i], keys[j]] = [keys[j], keys[i]];
        }
        ss.optionOrders[q.id] = keys;
      }
      const map = new Map(opts.map(o => [o.key, o]));
      return ss.optionOrders[q.id].map(k => map.get(k)).filter(Boolean);
    }

    // =========================================================================
    // HASIL ASESMEN PER PAKET: skor, arsip hasil, & riwayat peserta
    // =========================================================================
    const pxDateLabel = ts => new Date(ts).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

    // Skor murni untuk satu paket ujian (tidak bergantung pada role/paket aktif)
    function pxScoreForPackage(pkg, data) {
      const qs = getQuestionsForPackage(pkg).filter(q => q.included);
      let objE = 0, objM = 0, esE = 0, esM = 0, ungraded = false;
      qs.forEach(q => {
        if (q.type === 'ESAI') {
          esM += q.weight;
          const m = data.essayScores ? data.essayScores[q.id] : undefined;
          if (m !== undefined && m !== null && m !== '') esE += Number(m); else ungraded = true;
        } else {
          objM += q.weight;
          objE += evaluateQuestionItemScore(q, data.answers ? data.answers[q.id] : undefined);
        }
      });
      const raw = Math.round(((objE + esE) / Math.max(1, objM + esM)) * 100);
      const kktp = Number((pkg && pkg.kktp) || 61);
      let fin = raw;
      if (data.remedialScore !== null && data.remedialScore !== undefined) {
        const rem = Number(data.remedialScore);
        if (state.remedialRule === 'highest') fin = Math.max(raw, rem);
        else if (state.remedialRule === 'average') fin = Math.round((raw + rem) / 2);
        else if (state.remedialRule === 'cap_kktp') fin = Math.min(kktp, Math.max(raw, rem));
      }
      return { rawScore100: raw, finalScore: fin, kktp, passed: fin >= kktp, hasUngradedEssay: ungraded };
    }

    // Hasil seorang peserta pada satu paket: paket aktif = data langsung, paket lain = arsip
    function pxPackageResult(st, pkg) {
      if (!pkg) return null;
      if (state.examConfig.activePackageId === pkg.id) {
        if (!hasExamData(st)) return null;
        return {
          live: true, status: st.status, duration: st.duration || '-',
          finishedAt: st.finishedAt || null,
          remedialScore: (st.remedialScore === undefined ? null : st.remedialScore),
          ...pxScoreForPackage(pkg, st)
        };
      }
      const r = st.results && st.results[pkg.id];
      if (!r) return null;
      return { live: false, ...r, ...(r.answers ? pxScoreForPackage(pkg, r) : {}) };
    }

    // Saat paket aktif berganti: simpan hasil paket lama ke arsip tiap peserta, lalu kosongkan sesi untuk paket baru
    function pxArchiveLiveResults(oldPkgId, newPkg) {
      const oldPkg = state.examPackages.find(p => p.id === oldPkgId);
      if (!oldPkg) return;
      state.students.forEach(st => {
        if (hasExamData(st)) {
          if (!st.results) st.results = {};
          st.results[oldPkg.id] = {
            pkgId: oldPkg.id, title: oldPkg.title, subject: oldPkg.subject,
            examCategory: oldPkg.examCategory, teacher: oldPkg.ownerName,
            status: st.status, duration: st.duration || '-', finishTime: st.finishTime || '-',
            finishedAt: st.finishedAt || Date.now(), violations: st.violations || 0,
            remedialScore: (st.remedialScore === undefined ? null : st.remedialScore),
            showScore: !!oldPkg.showScoreToStudent,
            answers: { ...(st.answers || {}) },
            essayScores: { ...(st.essayScores || {}) },
            essayFeedbacks: { ...(st.essayFeedbacks || {}) },
            ...pxScoreForPackage(oldPkg, st)
          };
        }
        Object.assign(st, {
          status: 'Belum Login', loginTime: '-', finishTime: '-', duration: '-', finishedAt: null,
          violations: 0, remedialScore: null, lastQuestionIndex: 0, savedRemainingSeconds: null,
          savedFlagged: {}, answers: {}, essayScores: {}, essayFeedbacks: {}
        });
      });
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      Object.assign(state.studentSession, {
        step: 'portal', agreedRules: false, currentQuestionIndex: 0, lastQuestionIndex: 0,
        remainingSeconds: Number((newPkg && newPkg.durationMinutes) || 90) * 60,
        savedRemainingSeconds: null, serverDeadlineMs: null, answers: {}, flagged: {}, savedFlagged: {},
        violations: 0, antiCheatLogs: [], questionOrder: null, optionOrders: {},
        audioPlayCountByQ: {}, audioPlayingQId: null, audioProgressPct: 0, paused: false
      });
      pxLog('Arsip Hasil Asesmen', oldPkg.title, 'Hasil peserta diarsipkan saat paket ujian aktif berganti', null);
    }

    // Tampilan peserta untuk paket arsip: pembacaan/penulisan field ujian diteruskan ke catatan arsip paket itu
    const PX_ARCH_FIELDS = ['status', 'answers', 'essayScores', 'essayFeedbacks', 'remedialScore', 'duration', 'finishTime', 'violations'];
    function pxArchivedView(st, pkgId) {
      const rec = st.results && st.results[pkgId];
      if (!rec) return null;
      return new Proxy(st, {
        get(t, k) { return PX_ARCH_FIELDS.includes(k) ? rec[k] : t[k]; },
        set(t, k, v) { if (PX_ARCH_FIELDS.includes(k)) rec[k] = v; else t[k] = v; return true; }
      });
    }

    // Daftar peserta (yang punya data ujian) untuk paket yang sedang dipilih guru: paket aktif = data langsung, selain itu = arsip
    function pxGuruStudents() {
      const pkg = getActiveTeacherPackage(getCurrentTeacherAccount());
      if (!pkg || state.examConfig.activePackageId === pkg.id) return state.students.filter(hasExamData);
      return state.students.map(st => pxArchivedView(st, pkg.id)).filter(v => v && hasExamData(v));
    }

    // ===== LEMBAR JAWABAN PER SISWA =====
    function pxOpenAnswerSheet(id) {
      const st = state.currentRole === 'guru' ? pxGuruStudentById(id) : state.students.find(s => s.id === id);
      if (!st) return;
      const qs = getActiveExamQuestions();
      const sc = computeStudentScores(st);
      const optTxt = (q, k) => { const o = (q.options || []).find(x => x.key === k); return o ? `<span class="font-mono-code">${pxEsc(k)}.</span> ${o.text}` : pxEsc(k); };
      const blank = '<em class="text-slate-400">tidak dijawab</em>';
      const view = (q, a) => {
        if (a === undefined || a === null || a === '' || (Array.isArray(a) && !a.length)) return [blank, ''];
        if (q.type === 'PG') return [optTxt(q, a), optTxt(q, q.correctKey)];
        if (q.type === 'PG_KOMPLEKS') return [a.map(k => optTxt(q, k)).join('<br>'), (q.correctKeys || []).map(k => optTxt(q, k)).join('<br>')];
        if (q.type === 'BENAR_SALAH') return [(q.statements || []).map(s => `${s.text}: <strong>${pxEsc(a[s.id] || '-')}</strong>${a[s.id] === s.answer ? '' : ` (kunci: ${pxEsc(s.answer)})`}`).join('<br>'), ''];
        if (q.type === 'MENJODOHKAN') return [(q.pairs || []).map(p => `${p.left} &rarr; <strong>${pxEsc(a[p.id] || '-')}</strong>${a[p.id] === p.right ? '' : ` (kunci: ${pxEsc(p.right)})`}`).join('<br>'), ''];
        if (q.type === 'ISIAN') return [pxEsc(a), pxEsc(q.correctText || '')];
        return [`<pre class="whitespace-pre-wrap font-mono-code text-[11px]">${pxEsc(a)}</pre>`, ''];
      };
      openModal(`
        <div class="p-6 space-y-4 text-xs max-h-[85vh] overflow-y-auto">
          <div class="flex items-start justify-between gap-3 border-b border-slate-200 pb-3">
            <div><h3 class="font-bold text-base text-slate-900">Lembar Jawaban: ${pxEsc(st.name)}</h3>
            <p class="text-slate-500 font-mono-code">${pxEsc(st.nis)} &bull; ${pxEsc(st.className)} &bull; Nilai awal ${sc.rawScore100} &bull; Akhir ${sc.finalScore}</p></div>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg border border-slate-300 text-slate-500"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          ${qs.map((q, i) => {
            const a = st.answers ? st.answers[q.id] : undefined;
            const isEssay = q.type === 'ESAI';
            const got = isEssay ? (st.essayScores && st.essayScores[q.id] !== undefined && st.essayScores[q.id] !== '' ? Number(st.essayScores[q.id]) : null) : evaluateQuestionItemScore(q, a);
            const [ans, key] = view(q, a);
            const ok = got !== null && got >= q.weight;
            return `<div class="p-3 rounded-xl border ${got === null ? 'border-amber-200 bg-amber-50' : ok ? 'border-emerald-200 bg-emerald-50' : 'border-rose-200 bg-rose-50'} space-y-1.5">
              <div class="flex justify-between font-semibold"><span>No. ${i + 1} &bull; ${pxEsc(q.typeLabel || q.type)}</span><span class="font-mono-code">${got === null ? 'belum dinilai' : got} / ${q.weight}</span></div>
              <div class="leading-relaxed text-slate-700">${q.formattedPrompt || ''}</div>
              <div><span class="text-slate-500">Jawaban:</span> ${ans}</div>
              ${key && !ok ? `<div><span class="text-slate-500">Kunci:</span> ${key}</div>` : ''}
              ${isEssay && st.essayFeedbacks && st.essayFeedbacks[q.id] ? `<div><span class="text-slate-500">Umpan balik:</span> ${pxEsc(st.essayFeedbacks[q.id])}</div>` : ''}
            </div>`;
          }).join('')}
        </div>`, 'max-w-3xl');
    }

    function pxGuruStudentById(id) {
      const pkg = getActiveTeacherPackage(getCurrentTeacherAccount());
      const st = state.students.find(s => s.id === id);
      if (!st || !pkg || state.examConfig.activePackageId === pkg.id) return st;
      return pxArchivedView(st, pkg.id) || st;
    }

    function hasExamData(st) {
      return st.status === 'Selesai' || st.status === 'Terblokir' || Object.keys(st.answers || {}).length > 0;
    }

    function stripHtmlTags(html) {
      const div = document.createElement('div');
      div.innerHTML = html || '';
      return div.textContent || div.innerText || '';
    }

    function normalizeShortAnswer(val) {
      return String(val ?? '').trim().replace(/\s+/g, ' ').replace(',', '.').toLowerCase();
    }

    function evaluateQuestionItemScore(question, ans) {
      if (ans === undefined || ans === null || ans === '') return 0;
      if (question.type === 'PG') return ans === question.correctKey ? question.weight : 0;
      if (question.type === 'PG_KOMPLEKS') {
        if (!Array.isArray(ans) || ans.length === 0) return 0;
        const correctSet = new Set(question.correctKeys || []);
        let right = 0, wrong = 0;
        ans.forEach(k => { if (correctSet.has(k)) right++; else wrong++; });
        const ratio = Math.max(0, (right - wrong * 0.5) / Math.max(1, correctSet.size));
        return Number((ratio * question.weight).toFixed(2));
      }
      if (question.type === 'BENAR_SALAH') {
        if (typeof ans !== 'object') return 0;
        const stList = question.statements || [];
        if (stList.length === 0) return 0;
        let matched = 0;
        stList.forEach(st => { if (ans[st.id] === st.answer) matched++; });
        return Number(((matched / stList.length) * question.weight).toFixed(2));
      }
      if (question.type === 'MENJODOHKAN') {
        if (typeof ans !== 'object') return 0;
        const pairs = question.pairs || [];
        if (pairs.length === 0) return 0;
        let matched = 0;
        pairs.forEach(pr => { if (ans[pr.id] === pr.right) matched++; });
        return Number(((matched / pairs.length) * question.weight).toFixed(2));
      }
      if (question.type === 'ISIAN') {
        const cleanUser = normalizeShortAnswer(ans);
        const variants = (question.acceptedVariants && question.acceptedVariants.length > 0)
          ? question.acceptedVariants.map(normalizeShortAnswer)
          : [normalizeShortAnswer(question.correctText)];
        return variants.includes(cleanUser) ? question.weight : 0;
      }
      return 0;
    }

    function computeStudentScores(student) {
      const activeQuestions = getActiveExamQuestions();
      let objectiveEarned = 0, objectiveMax = 0, essayEarned = 0, essayMax = 0;
      let hasUngradedEssay = false;

      activeQuestions.forEach(q => {
        if (q.type === 'ESAI') {
          essayMax += q.weight;
          const manualScore = student.essayScores ? student.essayScores[q.id] : undefined;
          if (manualScore !== undefined && manualScore !== null && manualScore !== '') {
            essayEarned += Number(manualScore);
          } else {
            hasUngradedEssay = true;
          }
        } else {
          objectiveMax += q.weight;
          objectiveEarned += evaluateQuestionItemScore(q, student.answers ? student.answers[q.id] : undefined);
        }
      });

      const totalEarned = objectiveEarned + essayEarned;
      const totalMax = Math.max(1, objectiveMax + essayMax);
      const rawScore100 = Math.round((totalEarned / totalMax) * 100);
      const kktp = getEffectiveExamConfig().kktp;
      let finalScore = rawScore100;
      if (student.remedialScore !== null && student.remedialScore !== undefined) {
        const rem = Number(student.remedialScore);
        if (state.remedialRule === 'highest') finalScore = Math.max(rawScore100, rem);
        else if (state.remedialRule === 'average') finalScore = Math.round((rawScore100 + rem) / 2);
        else if (state.remedialRule === 'cap_kktp') finalScore = Math.min(kktp, Math.max(rawScore100, rem));
      }

      return {
        objectiveEarned: Number(objectiveEarned.toFixed(1)),
        objectiveMax,
        essayEarned: Number(essayEarned.toFixed(1)),
        essayMax,
        hasUngradedEssay,
        rawScore100,
        finalScore,
        passed: finalScore >= kktp,
        ppaDescriptor: getPPA2025CompetencyDescriptor(student, finalScore)
      };
    }

    // Interval ketercapaian menurut Panduan Pembelajaran dan Asesmen (Edisi Revisi 2025)
    const PX_ENR_MIN = 81;
    function pxPpaInterval(score) {
      const n = Number(score) || 0;
      if (n <= 20) return { label: 'Belum Mencapai (0–20)', badgeCls: 'bg-rose-100 text-rose-800', key: 'i1' };
      if (n <= 40) return { label: 'Belum Mencapai (21–40)', badgeCls: 'bg-rose-100 text-rose-800', key: 'i2' };
      if (n <= 60) return { label: 'Hampir Mencapai (41–60)', badgeCls: 'bg-amber-100 text-amber-900', key: 'i3' };
      if (n <= 80) return { label: 'Sudah Mencapai (61–80)', badgeCls: 'bg-emerald-100 text-emerald-800', key: 'i4' };
      return { label: 'Sudah Mencapai — Pengayaan (81–100)', badgeCls: 'bg-blue-100 text-blue-800', key: 'i5' };
    }
    function getPPA2025CompetencyDescriptor(student, finalScore) {
      const { label: levelLabel, badgeCls } = pxPpaInterval(finalScore);

      const activeQuestions = getActiveExamQuestions();
      const masteredTopics = [], weakTopics = [];

      activeQuestions.forEach(q => {
        const earned = q.type === 'ESAI'
          ? (student.essayScores && student.essayScores[q.id] !== undefined ? Number(student.essayScores[q.id]) : 0)
          : evaluateQuestionItemScore(q, student.answers ? student.answers[q.id] : undefined);
        const topicName = (q.topic || ((q.tp || '').split('—')[1] || q.tp || 'Informatika')).trim();
        if (earned / Math.max(1, q.weight) >= 0.70) {
          if (!masteredTopics.includes(topicName)) masteredTopics.push(topicName);
        } else {
          if (!weakTopics.includes(topicName)) weakTopics.push(topicName);
        }
      });

      const goodPart = masteredTopics.length > 0
        ? `Menunjukkan penguasaan yang baik pada topik ${masteredTopics.slice(0, 2).join(' serta ')} (capaian: ${levelLabel.toLowerCase()}).`
        : 'Mulai mengenali konsep dasar Informatika.';
      const improvePart = weakTopics.length > 0
        ? `Perlu penguatan pada topik ${weakTopics.slice(0, 2).join(' dan ')}.`
        : 'Mampu merefleksikan solusi komputasional secara mandiri dan optimal.';

      return { levelLabel, badgeCls, raporNarrative: `${goodPart} ${improvePart}` };
    }

    function computePsychometricAnalysis() {
      const activeQuestions = getActiveExamQuestions();
      const participants = pxGuruStudents();
      const N = Math.max(1, participants.length);

      const participantTotals = participants.map(st => {
        const sc = computeStudentScores(st);
        const itemScores = {};
        activeQuestions.forEach(q => {
          itemScores[q.id] = q.type === 'ESAI'
            ? (st.essayScores && st.essayScores[q.id] !== undefined ? Number(st.essayScores[q.id]) : 0)
            : evaluateQuestionItemScore(q, st.answers ? st.answers[q.id] : undefined);
        });
        return { student: st, totalScore: sc.rawScore100, itemScores };
      });

      const sortedByTotal = [...participantTotals].sort((a, b) => b.totalScore - a.totalScore);
      const groupSize = Math.max(1, Math.round(N * 0.27));
      const upperGroup = sortedByTotal.slice(0, groupSize);
      const lowerGroup = sortedByTotal.slice(Math.max(0, N - groupSize));

      const meanTotal = participantTotals.reduce((acc, p) => acc + p.totalScore, 0) / N;
      const varianceTotal = participantTotals.reduce((acc, p) => acc + Math.pow(p.totalScore - meanTotal, 2), 0) / N;
      const sdTotal = Math.sqrt(varianceTotal) || 1;
      const rTable = 0.396;
      let sumItemVariances = 0;

      const itemStats = activeQuestions.map((q, idx) => {
        const scores = participantTotals.map(p => p.itemScores[q.id] || 0);
        const maxW = Math.max(1, q.weight);
        const meanItem = scores.reduce((a, b) => a + b, 0) / N;

        const P = Number((meanItem / maxW).toFixed(2));
        let pCategory = 'Sedang (Ideal)';
        if (P > 0.70) pCategory = 'Terlalu Mudah';
        else if (P < 0.30) pCategory = 'Terlalu Sukar';

        const upperMeanRatio = upperGroup.length
          ? upperGroup.reduce((acc, p) => acc + (p.itemScores[q.id] || 0) / maxW, 0) / upperGroup.length
          : 0;
        const lowerMeanRatio = lowerGroup.length
          ? lowerGroup.reduce((acc, p) => acc + (p.itemScores[q.id] || 0) / maxW, 0) / lowerGroup.length
          : 0;
        const D = Number((upperMeanRatio - lowerMeanRatio).toFixed(2));

        let dCategory = 'Sangat Baik', recommendation = 'Diterima (Masuk Bank Soal Unggulan)';
        if (D < 0.20) { dCategory = 'Jelek'; recommendation = 'Ditolak / Periksa Ambiguitas'; }
        else if (D < 0.30) { dCategory = 'Cukup'; recommendation = 'Perlu Revisi Pengecoh'; }
        else if (D < 0.40) { dCategory = 'Baik'; recommendation = 'Diterima (Layak Digunakan)'; }

        let cov = 0, varItem = 0;
        for (let i = 0; i < participantTotals.length; i++) {
          const dx = scores[i] - meanItem;
          const dy = participantTotals[i].totalScore - meanTotal;
          cov += dx * dy;
          varItem += dx * dx;
        }
        sumItemVariances += (varItem / N);
        const sdItem = Math.sqrt(varItem / N) || 1;
        const rPbis = Number(Math.max(-0.99, Math.min(0.99, (cov / N) / (sdItem * sdTotal))).toFixed(2));
        const isValid = rPbis >= rTable;

        let distractorStats = null;
        if (q.type === 'PG' && Array.isArray(q.options)) {
          distractorStats = q.options.map(opt => {
            const count = participants.filter(st => st && st.answers && st.answers[q.id] === opt.key).length;
            const pct = Math.round((count / N) * 100);
            return {
              key: opt.key,
              count,
              pct,
              isKey: opt.key === q.correctKey,
              isWeak: opt.key !== q.correctKey && pct < 5
            };
          });
        }

        return { question: q, displayNum: idx + 1, P, pCategory, D, dCategory, rPbis, isValid, recommendation, distractorStats };
      });

      const k = activeQuestions.length;
      const totalRawScores = participantTotals.map(p => activeQuestions.reduce((sum, q) => sum + (p.itemScores[q.id] || 0), 0));
      const meanRawTotal = totalRawScores.reduce((a, b) => a + b, 0) / N;
      const varRawTotal = totalRawScores.reduce((acc, v) => acc + Math.pow(v - meanRawTotal, 2), 0) / N || 1;
      let reliability = 0.84;
      if (k > 1 && varRawTotal > 0) {
        const alpha = (k / (k - 1)) * (1 - (sumItemVariances / varRawTotal));
        reliability = Number(Math.max(0.15, Math.min(0.98, alpha)).toFixed(2));
      }
      const reliabilityLabel = reliability >= 0.80 ? 'Sangat Tinggi (Andal)' : (reliability >= 0.70 ? 'Tinggi (Andal)' : 'Cukup (Moderat)');

      return {
        N, itemStats,
        avgP: Number((itemStats.reduce((a, b) => a + b.P, 0) / Math.max(1, itemStats.length)).toFixed(2)),
        avgD: Number((itemStats.reduce((a, b) => a + b.D, 0) / Math.max(1, itemStats.length)).toFixed(2)),
        validCount: itemStats.filter(i => i.isValid).length,
        reliability, reliabilityLabel
      };
    }

    function downloadExcelXLS(filename, sheetName, rowsAoa, colWidths = [], extraSheets = []) {
      if (typeof XLSX === 'undefined') {
        showToast('Pustaka Excel Belum Siap', 'Pastikan koneksi internet aktif untuk memuat pustaka SheetJS.', 'danger');
        return;
      }
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(rowsAoa);
      if (colWidths.length > 0) ws['!cols'] = colWidths.map(w => ({ wch: w }));
      XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0, 31));

      extraSheets.forEach(sh => {
        const xWs = XLSX.utils.aoa_to_sheet(sh.rows);
        if (sh.colWidths && sh.colWidths.length > 0) xWs['!cols'] = sh.colWidths.map(w => ({ wch: w }));
        XLSX.utils.book_append_sheet(wb, xWs, sh.name.slice(0, 31));
      });

      XLSX.writeFile(wb, filename, { bookType: 'xls' });
    }

    function pxPreviewStudentImport(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (typeof XLSX === 'undefined') { showToast('Pustaka Excel Belum Siap', 'Gagal membaca berkas Excel.', 'danger'); return; }
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
          const pick = (row, cands) => { const ks = Object.keys(row); for (const c of cands) { const k = ks.find(x => x.trim().toUpperCase() === c); if (k !== undefined && String(row[k]).trim() !== '') return String(row[k]).trim(); } return ''; };
          const knownClasses = new Set(state.students.map(s => s.className));
          const seen = new Map(), errors = [], warns = [], newClasses = new Set();
          let add = 0, upd = 0, total = 0;
          wb.SheetNames.forEach(sn => {
            const m = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '' });
            let h = 0;
            for (let r = 0; r < Math.min(12, m.length); r++) {
              const c = m[r].map(x => String(x || '').trim().toUpperCase());
              if (c.some(x => ['NIS', 'NIPD', 'NO INDUK', 'NO_INDUK', 'NISN'].includes(x)) && c.some(x => ['NAMA', 'NAMA_PESERTA', 'NAMA PESERTA', 'NAMA PESERTA DIDIK', 'NAMA LENGKAP'].includes(x))) { h = r; break; }
            }
            XLSX.utils.sheet_to_json(wb.Sheets[sn], { range: h, defval: '' }).forEach((row, i) => {
              const where = `${sn}, baris ${h + i + 2}`;
              const nis = pick(row, ['NIS', 'NIPD', 'NO_INDUK', 'NO INDUK', 'USERNAME']);
              const name = pick(row, ['NAMA_PESERTA', 'NAMA PESERTA DIDIK', 'NAMA PESERTA', 'NAMA LENGKAP', 'NAMA']);
              if (!nis && !name) return;
              total++;
              if (!nis || !name) { errors.push(`${where}: ${!nis ? 'NIS/NIPD kosong' : 'nama kosong'} (baris dilewati)`); return; }
              if (seen.has(nis)) { errors.push(`${where}: NIS ${nis} ganda dengan ${seen.get(nis)} (data terakhir yang dipakai)`); } else seen.set(nis, where);
              if (!/^\d+$/.test(nis)) warns.push(`${where}: NIS ${nis} bukan angka murni`);
              const cls = normalizeClassName(pick(row, ['KELAS', 'ROMBEL', 'TINGKAT']) || sn);
              if (!knownClasses.has(cls)) newClasses.add(cls);
              const nisn = pick(row, ['NISN']);
              if (nisn && state.students.some(s => s.nisn === nisn && String(s.nis) !== nis)) warns.push(`${where}: NISN ${nisn} sudah dipakai siswa lain`);
              state.students.some(s => String(s.nis).trim() === nis) ? upd++ : add++;
            });
          });
          window.__pxPendingImport = file;
          openModal(`
            <div class="p-6 space-y-4 text-xs max-h-[85vh] overflow-y-auto">
              <h3 class="font-bold text-base text-slate-900">Pratinjau Impor: ${pxEsc(file.name)}</h3>
              <div class="grid grid-cols-3 gap-2 text-center">
                <div class="p-2 rounded-lg bg-emerald-50 border border-emerald-200"><div class="font-mono-code font-bold text-lg text-emerald-800">${add}</div>siswa baru</div>
                <div class="p-2 rounded-lg bg-blue-50 border border-blue-200"><div class="font-mono-code font-bold text-lg text-blue-800">${upd}</div>diperbarui</div>
                <div class="p-2 rounded-lg bg-rose-50 border border-rose-200"><div class="font-mono-code font-bold text-lg text-rose-800">${errors.length}</div>masalah</div>
              </div>
              <p class="text-slate-600">${total} baris data terbaca dari ${wb.SheetNames.length} sheet.${newClasses.size ? ` Kelas baru: <strong>${[...newClasses].map(pxEsc).join(', ')}</strong>.` : ''}</p>
              ${errors.length ? `<div><div class="font-semibold text-rose-800 mb-1">Masalah</div><ul class="space-y-0.5 text-rose-700">${errors.slice(0, 30).map(x => `<li>&bull; ${pxEsc(x)}</li>`).join('')}${errors.length > 30 ? `<li>... dan ${errors.length - 30} lainnya</li>` : ''}</ul></div>` : ''}
              ${warns.length ? `<div><div class="font-semibold text-amber-800 mb-1">Peringatan</div><ul class="space-y-0.5 text-amber-700">${warns.slice(0, 30).map(x => `<li>&bull; ${pxEsc(x)}</li>`).join('')}${warns.length > 30 ? `<li>... dan ${warns.length - 30} lainnya</li>` : ''}</ul></div>` : ''}
              <div class="flex justify-end gap-2 pt-3 border-t border-slate-200">
                <button type="button" onclick="window.__pxPendingImport=null; closeModal();" class="px-4 py-2 rounded-lg border border-slate-300 font-semibold">Batal</button>
                <button type="button" onclick="closeModal(); importStudentsXLS({ target: { files: [window.__pxPendingImport], value: '' } }); window.__pxPendingImport=null;" class="px-4 py-2 rounded-lg btn-sapphire font-semibold">Lanjutkan Impor (${add + upd} data)</button>
              </div>
            </div>`, 'max-w-xl');
        } catch (err) {
          showToast('Gagal Membaca Berkas', 'Periksa format kolom (KELAS, NISN, NIPD/NIS, NAMA, JK).', 'danger');
        }
      };
      reader.readAsArrayBuffer(file);
      e.target.value = '';
    }
