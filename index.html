    function pxApplyBulkPassword() {
      const cls = document.getElementById('bp-class').value, mode = document.getElementById('bp-mode').value;
      const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const rnd = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => abc[b % abc.length]).join('');
      let n = 0;
      state.students.forEach(s => {
        if (!pxAllowed(s.room) || (cls !== 'ALL' && s.className !== cls) || s.status === 'Sedang Mengerjakan') return;
        s.password = mode === 'nis' ? String(s.nis) : rnd();
        n++;
      });
      pxLog('Reset Password Massal', cls === 'ALL' ? 'Semua kelas' : cls, `${n} peserta, mode ${mode === 'nis' ? 'NIS' : 'acak'}`, null);
      pxSaveImmediate(); closeModal(); renderApp();
      showToast('Password Diatur Ulang', `${n} peserta diperbarui.`, 'success');
    }

    function importStudentsXLS(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      if (typeof XLSX === 'undefined') {
        showToast('Pustaka Excel Belum Siap', 'Gagal membaca berkas Excel.', 'danger');
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = new Uint8Array(ev.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          let addedCount = 0;
          let updatedCount = 0;
          let sheetsRead = 0;

          const pickField = (rowObj, candidates) => {
            const keys = Object.keys(rowObj);
            for (const cand of candidates) {
              const foundKey = keys.find(k => k.trim().toUpperCase() === cand.toUpperCase());
              if (foundKey !== undefined && String(rowObj[foundKey]).trim() !== '') {
                return String(rowObj[foundKey]).trim();
              }
            }
            return '';
          };

          wb.SheetNames.forEach(sheetName => {
            const ws = wb.Sheets[sheetName];
            if (!ws) return;
            const rawMatrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            if (!Array.isArray(rawMatrix) || rawMatrix.length === 0) return;

            // Deteksi otomatis baris header (mendukung file dengan kop surat di atas tabel)
            let headerRowIdx = 0;
            for (let r = 0; r < Math.min(12, rawMatrix.length); r++) {
              const cells = rawMatrix[r].map(c => String(c || '').trim().toUpperCase());
              const hasIdCol = cells.some(c => ['NIS', 'NIPD', 'NO INDUK', 'NO_INDUK', 'NISN'].includes(c));
              const hasNameCol = cells.some(c => ['NAMA', 'NAMA_PESERTA', 'NAMA PESERTA', 'NAMA PESERTA DIDIK', 'NAMA LENGKAP'].includes(c));
              if (hasIdCol && hasNameCol) {
                headerRowIdx = r;
                break;
              }
            }

            const jsonRows = XLSX.utils.sheet_to_json(ws, { range: headerRowIdx, defval: '' });
            if (jsonRows.length === 0) return;
            sheetsRead++;

            // Jika kolom KELAS kosong di baris, gunakan nama sheet jika berbentuk kelas (misal "XI_3" atau "XI.F-3")
            const fallbackClassFromSheet = /XI/i.test(sheetName)
              ? normalizeClassName(sheetName.replace(/^26_27\s*/i, '').replace(/_/g, '.F-').replace(/\.F-\.F-/g, '.F-'))
              : 'XI.F-1';

            jsonRows.forEach(row => {
              const nis = pickField(row, ['NIS', 'NIPD', 'NO_INDUK', 'NO INDUK', 'USERNAME']);
              const name = pickField(row, ['NAMA_PESERTA', 'NAMA PESERTA DIDIK', 'NAMA PESERTA', 'NAMA LENGKAP', 'NAMA']);
              if (!nis || !name) return;
              if (/^(NIS|NIPD|NO)$/i.test(nis) || /^(NAMA|NAMA PESERTA)$/i.test(name)) return;

              const nisn = pickField(row, ['NISN']) || '-';
              const rawClass = pickField(row, ['KELAS', 'ROMBEL', 'TINGKAT']);
              const className = normalizeClassName(rawClass || fallbackClassFromSheet);
              const genderRaw = pickField(row, ['JK', 'L/P', 'LP', 'JENIS KELAMIN', 'GENDER']).toUpperCase();
              const gender = genderRaw.startsWith('P') ? 'P' : 'L';
              const room = pickField(row, ['RUANG', 'LAB', 'LOKASI']) || 'Lab Komputer 1 (RPL)';
              const session = pickField(row, ['SESI', 'GELOMBANG']) || 'Sesi 1';

              const existing = state.students.find(s => String(s.nis).trim() === nis);
              if (existing) {
                existing.name = name;
                if (nisn !== '-') existing.nisn = nisn;
                existing.className = className;
                existing.level = className.split('.')[0] || 'XI';
                existing.gender = gender;
                if (rawClass || pickField(row, ['RUANG', 'LAB'])) existing.room = room;
                if (pickField(row, ['SESI'])) existing.session = session;
                updatedCount++;
              } else {
                const idx = state.students.length + 1;
                state.students.push({
                  id: `STD-${String(idx).padStart(3, '0')}`,
                  nis, nisn, name, gender, className,
                  level: className.split('.')[0] || 'XI',
                  password: nis, room, session, status: 'Belum Login',
                  loginTime: '-', finishTime: '-', duration: '-',
                  ipAddress: '-', deviceInfo: '-', violations: 0,
                  workstation: `PC-${String(((idx - 1) % 36) + 1).padStart(2, '0')}`,
                  remedialScore: null, lastQuestionIndex: 0,
                  savedRemainingSeconds: null, savedFlagged: {},
                  answers: {}, essayScores: {}, essayFeedbacks: {}
                });
                addedCount++;
              }
            });
          });

          pxLog('Impor Peserta Excel (.xls)', file.name, `${addedCount} baru, ${updatedCount} diperbarui (${sheetsRead} sheet)`, null);
          syncAllSystemEntities(false);
          renderApp();
          showToast('Impor Peserta (.xls) Berhasil', `${addedCount} siswa baru masuk, ${updatedCount} data siswa diperbarui dari ${sheetsRead} sheet.`, 'success');
        } catch (err) {
          showToast('Gagal Impor Peserta Excel', 'Periksa format kolom (KELAS, NISN, NIPD/NIS, NAMA, JK).', 'danger');
        }
        e.target.value = '';
      };
      reader.readAsArrayBuffer(file);
    }

      const rows = [['Bentuk_Soal', 'Elemen_CP', 'Topik', 'CP', 'ATP', 'Bobot', 'Pertanyaan', 'Opsi_A', 'Opsi_B', 'Opsi_C', 'Opsi_D', 'Opsi_E', 'Kunci_Jawaban']];

          const opts = q.options || [];
          const getOpt = k => stripHtmlTags((opts.find(o => o.key === k) || {}).text || '');
          optA = getOpt('A'); optB = getOpt('B'); optC = getOpt('C'); optD = getOpt('D'); optE = getOpt('E');
          ansKey = q.type === 'PG' ? (q.correctKey || 'A') : (q.correctKeys || []).join(',');
        } else if (q.type === 'BENAR_SALAH') {
          const stmts = q.statements || [];
          optA = stmts[0] ? stripHtmlTags(stmts[0].text) : '';
          optB = stmts[1] ? stripHtmlTags(stmts[1].text) : '';
          optC = stmts[2] ? stripHtmlTags(stmts[2].text) : '';
          optD = stmts[3] ? stripHtmlTags(stmts[3].text) : '';
          optE = stmts[4] ? stripHtmlTags(stmts[4].text) : '';
          ansKey = stmts.map(s => s.answer || 'Benar').join('; ');
        } else if (q.type === 'MENJODOHKAN') {
          const pairs = q.pairs || [];
          const fmtPair = p => p ? `${stripHtmlTags(p.left)} -> ${p.right}` : '';
          optA = fmtPair(pairs[0]); optB = fmtPair(pairs[1]); optC = fmtPair(pairs[2]); optD = fmtPair(pairs[3]); optE = fmtPair(pairs[4]);
          ansKey = pairs.map(p => p.right).join('; ');
        } else if (q.type === 'ISIAN') {
          ansKey = q.correctText || '';
        } else if (q.type === 'ESAI') {
          ansKey = q.idealAnswer || '';
        }
        rows.push([q.type, q.element, q.topic || '', q.cp || '', q.atp || '', q.weight, stripHtmlTags(q.formattedPrompt), optA, optB, optC, optD, optE, ansKey]);
      });

      showToast('Ekspor Bank Soal (.xls) Berhasil', `${myQ.length} butir soal berhasil diunduh.`, 'success');
    }

    function importBankSoalXLS(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      if (typeof XLSX === 'undefined') {
        showToast('Pustaka Excel Belum Siap', 'Gagal membaca berkas Excel.', 'danger');
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = new Uint8Array(ev.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          const firstSheet = wb.Sheets[wb.SheetNames[0]];
          const jsonRows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
          const teacherAcc = getCurrentTeacherAccount();
          const activePkg = getActiveTeacherPackage(teacherAcc);
          let importedCount = 0;

          const typeLabelMap = {
            PG: 'Pilihan Ganda',
            PG_KOMPLEKS: 'Pilihan Ganda Kompleks',
            BENAR_SALAH: 'Benar / Salah Majemuk',
            MENJODOHKAN: 'Menjodohkan',
            ISIAN: 'Isian Singkat',
            ESAI: 'Uraian / Esai'
          };

          const normalizeImportedType = (val) => {
            const up = String(val || 'PG').trim().toUpperCase();
            if (typeLabelMap[up]) return up;
            if (up.includes('KOMPLEKS')) return 'PG_KOMPLEKS';
            if (up.includes('BENAR') || up.includes('SALAH')) return 'BENAR_SALAH';
            if (up.includes('JODOH')) return 'MENJODOHKAN';
            if (up.includes('ISIAN') || up.includes('SINGKAT')) return 'ISIAN';
            if (up.includes('ESAI') || up.includes('URAIAN')) return 'ESAI';
            return 'PG';
          };

          jsonRows.forEach((row, idx) => {
            const promptText = String(row.Pertanyaan || row.pertanyaan || '').trim();
            if (!promptText) return;
            const type = normalizeImportedType(row.Bentuk_Soal || row.Bentuk || 'PG');
            const weight = Math.max(1, Number(row.Bobot || 10) || 10);
            const element = String(row.Elemen_CP || 'BK — Berpikir Komputasional').trim();
            const topic = String(row.Topik || 'Materi Impor Excel').trim();
            const cpVal = String(row.CP || activePkg.cp || '').trim();
            const atpVal = String(row.ATP || activePkg.atp || '').trim();
            const keyRaw = String(row.Kunci_Jawaban || '').trim();

            const rawOpts = ['A', 'B', 'C', 'D', 'E']
              .map(k => ({ key: k, raw: String(row[`Opsi_${k}`] || '').trim() }))
              .filter(o => o.raw !== '');

            const newId = 'XLS_' + Date.now().toString().slice(-4) + '_' + (idx + 1);
            const newQ = {
              id: newId,
              number: state.questions.length + 1,
              packageId: activePkg ? activePkg.id : 'PKG-GUR-01',
              ownerId: teacherAcc ? teacherAcc.id : 'GUR-01',
              ownerName: teacherAcc ? teacherAcc.name : state.examConfig.teacher,
              subject: activePkg ? activePkg.subject : state.examConfig.subject,
              grade: activePkg ? activePkg.grade : state.examConfig.grade,
              element, topic, cp: cpVal, atp: atpVal, tp: atpVal,
              cognitive: 'L2', type, typeLabel: typeLabelMap[type],
              weight, included: true,
              formattedPrompt: `<p>${pxEsc(promptText)}</p>`
            };

            if (type === 'PG' || type === 'PG_KOMPLEKS') {
              const opts = rawOpts.map(o => ({ key: o.key, text: pxEsc(o.raw) }));
              newQ.options = opts.length >= 2 ? opts : [
                { key: 'A', text: 'Opsi A' }, { key: 'B', text: 'Opsi B' }, { key: 'C', text: 'Opsi C' }, { key: 'D', text: 'Opsi D' }
              ];
              if (type === 'PG') {
                newQ.correctKey = (keyRaw.toUpperCase().split(',')[0] || 'A').trim();
              } else {
                const parsedKeys = keyRaw.toUpperCase().split(/[,;]/).map(s => s.trim()).filter(Boolean);
                newQ.correctKeys = parsedKeys.length > 0 ? parsedKeys : ['A', 'B'];
              }
            } else if (type === 'BENAR_SALAH') {
              const keyList = keyRaw.split(/[;,]/).map(s => {
                const v = s.trim().toLowerCase();
                return (v === 'salah' || v === 's' || v === 'false') ? 'Salah' : 'Benar';
              });
              const stmtItems = rawOpts.length > 0 ? rawOpts : [{ raw: 'Pernyataan 1' }, { raw: 'Pernyataan 2' }];
              newQ.statements = stmtItems.map((o, sIdx) => ({
                id: 'S' + (sIdx + 1), text: pxEsc(o.raw), answer: keyList[sIdx] || 'Benar'
              }));
            } else if (type === 'MENJODOHKAN') {
              const keyList = keyRaw.split(/[;]/).map(s => s.trim()).filter(Boolean);
              const pairItems = rawOpts.length > 0 ? rawOpts : [{ raw: 'Premis 1 -> Pasangan 1' }, { raw: 'Premis 2 -> Pasangan 2' }];
              newQ.pairs = pairItems.map((o, pIdx) => {
                const parts = o.raw.split(/->|=>|\|/);
                return {
                  id: 'P' + (pIdx + 1),
                  left: pxEsc((parts[0] || `Premis ${pIdx + 1}`).trim()),
                  right: (parts[1] || keyList[pIdx] || `Pasangan ${pIdx + 1}`).trim()
                };
              });
              newQ.distractorChoices = [...new Set([...newQ.pairs.map(p => p.right), 'Opsi Pengecoh'])];
            } else if (type === 'ISIAN') {
              const variants = keyRaw.split(/[;]/).map(s => s.trim()).filter(Boolean);
              newQ.correctText = variants[0] || keyRaw || '-';
              newQ.acceptedVariants = variants.length > 0 ? variants : [newQ.correctText];
            } else if (type === 'ESAI') {
              newQ.idealAnswer = keyRaw || 'Pedoman penilaian uraian.';
            }

            state.questions.push(newQ);
            importedCount++;
          });

          if (activePkg) syncPackageAcrossSystem(activePkg, { activateForStudents: false, silent: true });
          pxSaveImmediate();
          renderApp();
          showToast('Impor Bank Soal (.xls) Selesai', `${importedCount} butir soal berhasil ditambahkan.`, 'success');
        } catch (err) {
          showToast('Gagal Impor Soal Excel', 'Periksa format kolom sesuai template_bank_soal_cbt.xls.', 'danger');
        }
        e.target.value = '';
      };
      reader.readAsArrayBuffer(file);
    }

    function exportBankSoalJSON() {
      const teacherAcc = getCurrentTeacherAccount();
      const activePkg = getActiveTeacherPackage(teacherAcc);
      const myQ = getTeacherQuestions(teacherAcc);
      const letters = ['A', 'B', 'C', 'D', 'E'];

      const payload = myQ.map(q => {
        const opts = Array.isArray(q.options) ? q.options.map(o => stripHtmlTags(o.text)) : [];
        const cIdx = Math.max(0, letters.indexOf((q.correctKey || 'A').toUpperCase()));
        return {
          id: q.id,
          type: (q.type || 'PG').toLowerCase(),
          kd: q.atp || q.element || '',
          atpKode: (q.atp || '').split('•')[0].trim() || 'ATP-XI.HE.1',
          topik: q.topic || activePkg.topic || '',
          levelKognitif: q.levelKognitif || (q.cognitive === 'L3' ? 'HOTS & Analisis' : (q.cognitive === 'L1' ? 'Dasar' : 'Menengah')),
          tp: q.cp || q.tp || '',
          indikator: q.atp || '',
          prompt: stripHtmlTags(q.formattedPrompt).trim(),
          options: opts,
          correctIndex: cIdx,
          points: Number(q.weight || 2)
        };
      });

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `bank_soal_${activePkg.id}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Ekspor Bank Soal (.json) Berhasil', `${payload.length} butir soal diunduh dalam format JSON.`, 'success');
    }

    function importBankSoalJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          let rawText = String(ev.target.result || '').trim();
          let items = null;

          try {
            const parsed = JSON.parse(rawText);
            items = Array.isArray(parsed) ? parsed : (parsed.questions || parsed.soal || []);
          } catch (parseErr) {
            // Pemulihan otomatis jika berkas JSON array terpotong di tengah objek terakhir
            const lastCompleteObjIdx = rawText.lastIndexOf('},');
            if (rawText.startsWith('[') && lastCompleteObjIdx > 0) {
              items = JSON.parse(rawText.slice(0, lastCompleteObjIdx + 1) + ']');
            } else {
              throw parseErr;
            }
          }

          if (!Array.isArray(items) || items.length === 0) {
            throw new Error('Array soal kosong');
          }

          const teacherAcc = getCurrentTeacherAccount();
          const activePkg = getActiveTeacherPackage(teacherAcc);
          const letters = ['A', 'B', 'C', 'D', 'E'];
          let addedCount = 0;
          let updatedCount = 0;

          items.forEach((item, idx) => {
            if (!item || !item.prompt) return;
            const qId = String(item.id || `JSON_${Date.now().toString().slice(-4)}_${idx + 1}`).trim();
            const rawOpts = Array.isArray(item.options) ? item.options : [];
            const mappedOpts = rawOpts.slice(0, 5).map((optText, oIdx) => ({
              key: letters[oIdx] || String.fromCharCode(65 + oIdx),
              text: pxEsc(String(optText))
            }));

            const cIdx = Number.isInteger(item.correctIndex) && item.correctIndex >= 0 && item.correctIndex < mappedOpts.length
              ? item.correctIndex
              : 0;
            const correctKey = letters[cIdx] || 'A';
            const lvl = String(item.levelKognitif || 'Menengah').trim();
            const cog = /hots|analisis/i.test(lvl) ? 'L3' : (/dasar/i.test(lvl) ? 'L1' : 'L2');

            const existing = state.questions.find(q => q.id === qId && q.packageId === activePkg.id);
            const targetObj = existing || {
              id: qId,
              number: state.questions.length + 1,
              packageId: activePkg.id,
              ownerId: teacherAcc ? teacherAcc.id : 'GUR-01',
              ownerName: teacherAcc ? teacherAcc.name : state.examConfig.teacher,
              subject: activePkg.subject,
              grade: activePkg.grade
            };

            Object.assign(targetObj, {
              element: String(item.kd || 'LD — Literasi Digital (Hukum & Etika Digital)').trim(),
              topic: String(item.topik || activePkg.topic || 'Materi Informatika').trim(),
              cp: String(item.tp || activePkg.cp || '').trim(),
              atp: String(item.indikator || item.kd || activePkg.atp || '').trim(),
              tp: String(item.atpKode || item.tp || '').trim(),
              levelKognitif: lvl,
              cognitive: cog,
              type: 'PG',
              typeLabel: 'Pilihan Ganda',
              weight: Math.max(1, Number(item.points || 2) || 2),
              included: true,
              formattedPrompt: `<p>${pxEsc(String(item.prompt).trim())}</p>`,
              options: mappedOpts.length >= 2 ? mappedOpts : [
                { key: 'A', text: 'Opsi A' }, { key: 'B', text: 'Opsi B' }
              ],
              correctKey
            });

            if (existing) {
              updatedCount++;
            } else {
              state.questions.push(targetObj);
              addedCount++;
            }
          });

          const totalInPkg = getQuestionsForPackage(activePkg).length;
          if (totalInPkg > activePkg.targetQuestionCount) {
            activePkg.targetQuestionCount = totalInPkg;
          }

          syncPackageAcrossSystem(activePkg, { activateForStudents: false, silent: true });
          pxLog('Impor Bank Soal JSON (.json)', file.name, `${addedCount} baru, ${updatedCount} diperbarui`, null);
          pxSaveImmediate();
          renderApp();
          showToast('Impor Bank Soal (.json) Berhasil', `${addedCount} butir soal ditambahkan, ${updatedCount} butir diperbarui.`, 'success');
        } catch (err) {
          showToast('Gagal Impor Soal JSON', 'Pastikan berkas JSON memuat array objek soal yang valid.', 'danger');
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    }

    // =========================================================================
    // 5. VIEW RENDERER: PESERTA DIDIK (PORTAL, KONFIRMASI, UJIAN, SELESAI)
    // =========================================================================
    function renderSiswaView() {
      const step = state.studentSession.step;
      if (step === 'portal') return renderSiswaPortal();
      if (step === 'confirm') return renderSiswaConfirmData();
      if (step === 'exam') return renderSiswaExamRoom();
      if (step === 'finished') return renderSiswaFinished();
      return renderSiswaPortal();
    }

    function renderSiswaPortal() {
      const st = getActiveStudent();
      const tab = state.studentSession.portalTab;
      const isBlocked = st.status === 'Terblokir';

      const liveCompletedHistory = [];
      if (st.status === 'Selesai') {
        const sc = computeStudentScores(st);
        liveCompletedHistory.push({
          id: 'HIS-LIVE-' + (state.examConfig.activePackageId || 'ACTIVE'),
          date: st.finishedAt ? pxDateLabel(st.finishedAt) : (state.schoolInfo.printDate || '-'),
          subject: state.examConfig.title || state.examConfig.subject,
          teacher: state.examConfig.teacher,
          type: state.examConfig.examCategory || 'Asesmen CBT',
          durationUsed: st.duration || '-',
          score: sc.finalScore,
          rawScore: sc.rawScore100,
          remedialScore: st.remedialScore,
          kktp: state.examConfig.kktp,
          scorePublished: !!state.examConfig.showScoreToStudent && !sc.hasUngradedEssay,
          hasUngradedEssay: sc.hasUngradedEssay,
          isSyncedCurrent: true
        });
      }
      const archivedHistory = Object.values(st.results || {})
        .filter(r => r.status === 'Selesai')
        .sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0))
        .map(r0 => {
          const pk = state.examPackages.find(p => p.id === r0.pkgId);
          const r = (pk && r0.answers) ? { ...r0, ...pxScoreForPackage(pk, r0), showScore: !!pk.showScoreToStudent } : r0;
          return {
          id: 'HIS-' + r.pkgId,
          date: r.finishedAt ? pxDateLabel(r.finishedAt) : '-',
          subject: r.title || r.subject,
          teacher: r.teacher,
          type: r.examCategory,
          durationUsed: r.duration || '-',
          score: r.finalScore,
          rawScore: r.rawScore100,
          remedialScore: r.remedialScore,
          kktp: r.kktp,
          scorePublished: !!r.showScore && !r.hasUngradedEssay,
          hasUngradedEssay: r.hasUngradedEssay
        }; });
      const combinedHistory = [...liveCompletedHistory, ...archivedHistory];

      return `
        <div class="max-w-4xl mx-auto space-y-5 animate-fade-in">

                            ${pxEsc(sch.status)}
                          </span>
                          <span class="text-xs text-slate-500">${pxEsc(isActive && !pxIsSus(sch) ? (state.examConfig.examCategory || sch.type) : sch.type)} &bull; ${pxEsc(sch.session)}</span>
                        </div>
                        <h3 class="text-base font-bold text-slate-900 leading-snug">${pxEsc(displayTitle)}</h3>
                        <div class="text-xs text-slate-700">
                          <span class="font-semibold text-[#1E3A5F]">Topik / Materi:</span> ${pxEsc(topicText || '-')}
                        </div>
                        ${isActive && cpText ? `
                          <details class="pt-1 text-xs text-slate-600">
                            <summary class="font-semibold text-[#1E3A5F] cursor-pointer select-none">Lihat Fokus Capaian Pembelajaran (CP)</summary>
                            <p class="mt-1.5 p-2.5 rounded-lg bg-slate-50 border border-slate-200 leading-relaxed">${pxEsc(cpText)}</p>

                        <div class="flex flex-wrap items-center gap-3 text-xs text-slate-500 font-mono-code pt-0.5">
                          <span>${pxEsc(sch.startDate)}</span>
                          <span>&bull;</span>

                      <div class="shrink-0">

                          <button type="button" onclick="state.studentSession.schedId='${sch.id}'; state.studentSession.step='confirm'; renderApp();"

                            Terjadwal
                          </button>
                        `}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : `
            <div class="studio-card overflow-hidden">
              <div class="px-5 py-4 bg-slate-50 border-b border-slate-300 flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h2 class="font-bold text-sm sm:text-base text-slate-900">Riwayat Hasil Asesmen</h2>
                  <p class="text-xs text-slate-500">Tersinkronisasi otomatis dengan hasil pengerjaan CBT, koreksi esai guru, dan nilai remedial.</p>
                </div>
                <span class="px-2.5 py-1 rounded-md bg-emerald-50 border border-emerald-200 text-emerald-800 text-[11px] font-semibold whitespace-nowrap">Tersinkron (${pxEsc(state.lastSyncedAt)})</span>
              </div>
              ${combinedHistory.length === 0 ? `
                <div class="px-6 py-12 text-center space-y-3">
                  <div class="mx-auto w-12 h-12 rounded-full bg-slate-100 border border-slate-300 flex items-center justify-center">
                    <i data-lucide="clipboard-list" class="w-5 h-5 text-slate-500"></i>

                  <div class="font-bold text-sm text-slate-900">Belum Ada Riwayat Hasil Asesmen</div>
                  <p class="text-xs text-slate-500 max-w-md mx-auto leading-relaxed">Anda belum menyelesaikan ujian apa pun. Riwayat dan nilai akan muncul di sini secara otomatis setelah Anda mengumpulkan jawaban asesmen.</p>
                  <button type="button" onclick="state.studentSession.portalTab='jadwal'; renderApp();" class="px-4 py-2 rounded-lg btn-sapphire text-xs font-semibold">Lihat Jadwal Ujian</button>

              <div class="table-scroll-wrap">

                        <td class="font-mono-code text-slate-600 whitespace-nowrap">${pxEsc(h.date)}</td>
                        <td>
                          <div class="font-semibold text-slate-900">${pxEsc(h.subject)}</div>
                          ${h.isSyncedCurrent ? `<span class="inline-block mt-0.5 px-2 py-0.5 rounded bg-blue-100 text-[#1E3A5F] text-[10px] font-semibold">Hasil Sesi Terkini</span>` : ''}
                        </td>
                        <td class="font-mono-code text-slate-600 whitespace-nowrap">${pxEsc(h.durationUsed)}</td>
                        <td class="text-center font-mono-code whitespace-nowrap">${h.kktp}</td>
                        <td class="text-center font-mono-code font-bold text-[#1E3A5F] whitespace-nowrap">
                          ${h.scorePublished
                            ? `${h.score}${h.remedialScore !== null && h.remedialScore !== undefined ? `<span class="block text-[10px] font-normal text-slate-500">(Awal: ${h.rawScore})</span>` : ''}`
                            : '<span class="text-slate-400 font-sans font-normal text-xs">Menunggu</span>'}
                        </td>
                        <td class="text-center whitespace-nowrap">
                          ${h.scorePublished
                            ? `<span class="px-2.5 py-0.5 rounded-md text-xs font-semibold ${h.score >= h.kktp ? 'bg-emerald-50 text-emerald-800 border border-emerald-300' : 'bg-amber-50 text-amber-800 border border-amber-300'}">${h.score >= h.kktp ? 'Tuntas' : 'Remedial'}</span>`
                            : `<span class="px-2.5 py-0.5 rounded-md text-xs font-medium bg-slate-100 text-slate-600 border border-slate-300">${h.hasUngradedEssay ? 'Koreksi Esai' : 'Belum Rilis'}</span>`}
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
              `}
            </div>
          `}
        </div>
      `;
    }

    function renderSiswaExamRoom() {
      const ss = state.studentSession;
      const st = getActiveStudent();
      const orderedQuestions = getOrderedQuestionsForStudent();
      const totalQ = orderedQuestions.length;
      const idx = Math.min(Math.max(0, ss.currentQuestionIndex), totalQ - 1);
      ss.currentQuestionIndex = idx;
      st.lastQuestionIndex = idx;
      const q = orderedQuestions[idx];
      const currentAns = ss.answers[q.id];
      const hasCurrentAns = pxHas(currentAns);
      const isFlagged = !!ss.flagged[q.id];
      const isCriticalTime = ss.remainingSeconds <= 300;

      const answeredCount = orderedQuestions.filter(item => pxHas(ss.answers[item.id])).length;
      const flaggedCount = Object.values(ss.flagged).filter(Boolean).length;
      const unansweredCount = Math.max(0, totalQ - answeredCount);
      const fontCls = ss.fontSize === 'sm' ? 'text-sm leading-relaxed' : (ss.fontSize === 'lg' ? 'text-lg leading-loose' : 'text-[15px] leading-[1.75]');
      const activeBanner = state.banners.find(b => b.room === st.room && b.id !== ss.dismissedBanner);
      const hasStimulus = Boolean(q.stimulusHtml || q.hasAudioStimulus);

      const filteredNavItems = orderedQuestions.map((item, i) => ({ item, i })).filter(({ item }) => {
        if (ss.navFilter === 'ANSWERED') return pxHas(ss.answers[item.id]);
        if (ss.navFilter === 'UNANSWERED') return !pxHas(ss.answers[item.id]);
        if (ss.navFilter === 'FLAGGED') return !!ss.flagged[item.id];
        return true;
      });

      const navigatorInnerHtml = `
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b border-slate-200 pb-2.5">
            <h2 class="font-bold text-xs uppercase tracking-wider text-slate-700">Navigasi Nomor Soal</h2>
            <span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-800 border border-slate-300 font-mono-code text-xs font-bold">${answeredCount}/${totalQ}</span>
          </div>

          <div class="grid grid-cols-4 gap-1 p-1 rounded-lg bg-slate-100 border border-slate-300 text-[11px] font-semibold">
            <button type="button" onclick="state.studentSession.navFilter='ALL'; renderApp();"
              class="py-1 rounded transition ${ss.navFilter === 'ALL' ? 'bg-[#1E3A5F] text-white' : 'text-slate-700'}">
              Semua
            </button>
            <button type="button" onclick="state.studentSession.navFilter='ANSWERED'; renderApp();"
              class="py-1 rounded transition ${ss.navFilter === 'ANSWERED' ? 'bg-[#1E3A5F] text-white' : 'text-slate-700'}">
              Isi (${answeredCount})
            </button>
            <button type="button" onclick="state.studentSession.navFilter='FLAGGED'; renderApp();"
              class="py-1 rounded transition ${ss.navFilter === 'FLAGGED' ? 'bg-amber-700 text-white' : 'text-slate-700'}">
              Ragu (${flaggedCount})
            </button>
            <button type="button" onclick="state.studentSession.navFilter='UNANSWERED'; renderApp();"
              class="py-1 rounded transition ${ss.navFilter === 'UNANSWERED' ? 'bg-slate-700 text-white' : 'text-slate-700'}">
              Kosong
            </button>
          </div>

          <div class="grid grid-cols-5 gap-2">
            ${filteredNavItems.length > 0 ? filteredNavItems.map(({ item, i }) => {
              const isAnswered = pxHas(ss.answers[item.id]);
              const isFl = !!ss.flagged[item.id];
              const isCurr = i === idx;
              const cls = ['matrix-btn', isAnswered ? 'answered' : '', isFl ? 'flagged' : '', isCurr ? 'active' : ''].join(' ');
              return `<button type="button" onclick="goToQuestion(${i}); toggleMobileQuestionDrawer(false);" class="${cls}">${i + 1}</button>`;
            }).join('') : `<div class="col-span-5 py-6 text-center text-xs text-slate-400">Tidak ada nomor soal.</div>`}
          </div>

          <div class="pt-3 border-t border-slate-200 flex items-center justify-between text-[11px] text-slate-600">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-xs bg-[#1E3A5F] inline-block"></span> Dijawab</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-xs bg-amber-700 inline-block"></span> Ragu</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-xs border border-slate-400 bg-white inline-block"></span> Kosong (${unansweredCount})</span>
          </div>

          <button type="button" onclick="confirmFinishExam()"
            class="w-full py-2.5 rounded-lg btn-sapphire font-semibold text-xs transition flex items-center justify-center gap-2">
            <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
            <span>Kumpulkan Ujian</span>
          </button>

          <div class="text-[11px] text-center text-slate-500 font-mono-code">
            Pintasan: A-E / 1-5 &bull; &larr; &rarr;
          </div>
        </div>
      `;

      const mobileDrawerBox = document.getElementById('mobile-nav-drawer-content');
      if (mobileDrawerBox) {
        mobileDrawerBox.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-4">
            <span class="font-bold text-sm text-slate-900">Nomor Soal</span>
            <button type="button" onclick="toggleMobileQuestionDrawer(false)" class="p-1.5 rounded-lg border border-slate-200 text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          ${navigatorInnerHtml}
        `;
      }

      return `
        <div class="select-none space-y-4 animate-fade-in">
          ${activeBanner ? `
            <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 flex items-center justify-between gap-3 text-xs">
              <div class="flex items-center gap-2 font-medium">
                <i data-lucide="bell" class="w-4 h-4 text-amber-600 shrink-0"></i>
                <span>Pesan Proktor (${pxEsc(activeBanner.room)}): ${pxEsc(activeBanner.text)}</span>
              </div>
              <button type="button" onclick="pxDismiss(${activeBanner.id})" class="px-2.5 py-1 rounded bg-amber-100 font-semibold shrink-0">Tutup</button>
            </div>
          ` : ''}

          <!-- Mobile Exam Toolbar -->
          <div class="flex md:hidden items-center justify-between gap-2 studio-card px-3.5 py-2.5 text-xs">
            <div class="flex items-center gap-1">
              <button type="button" onclick="state.studentSession.fontSize='sm'; renderApp();" class="w-7 h-7 rounded border font-semibold ${ss.fontSize === 'sm' ? 'bg-[#1E3A5F] text-white border-[#1E3A5F]' : 'border-slate-300'}">A-</button>
              <button type="button" onclick="state.studentSession.fontSize='base'; renderApp();" class="w-7 h-7 rounded border font-semibold ${ss.fontSize === 'base' ? 'bg-[#1E3A5F] text-white border-[#1E3A5F]' : 'border-slate-300'}">A</button>
              <button type="button" onclick="state.studentSession.fontSize='lg'; renderApp();" class="w-7 h-7 rounded border font-semibold ${ss.fontSize === 'lg' ? 'bg-[#1E3A5F] text-white border-[#1E3A5F]' : 'border-slate-300'}">A+</button>
            </div>
            <div id="exam-timer-badge-mobile" class="px-3 py-1 rounded-lg ${isCriticalTime ? 'bg-rose-700' : 'bg-[#1E3A5F]'} text-white font-mono-code font-bold text-xs flex items-center gap-1.5">
              <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-200"></i>
              <span>${pxFmt(ss.remainingSeconds)}</span>
            </div>
            <button type="button" onclick="toggleMobileQuestionDrawer(true)" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-slate-50 text-slate-800 font-semibold flex items-center gap-1.5">
              <i data-lucide="grid" class="w-3.5 h-3.5"></i>
              <span class="font-mono-code">${idx + 1}/${totalQ}</span>
            </button>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            <!-- Question Canvas -->
            <div class="lg:col-span-9 min-w-0 space-y-4">
              <div class="studio-card p-4 sm:p-7 space-y-5 min-h-[420px] sm:min-h-[460px]">
                <div class="flex flex-wrap items-center justify-between gap-2 pb-3.5 border-b border-slate-200 text-xs">
                  <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
                    <span class="px-2.5 py-1 rounded-md bg-[#1E3A5F] text-white font-mono-code font-bold text-xs whitespace-nowrap">Soal ${idx + 1} / ${totalQ}</span>
                    <span class="px-2.5 py-1 rounded-md font-semibold whitespace-nowrap ${getQuestionTypeBadgeClass()}">${pxEsc(q.typeLabel)}</span>
                    <span class="inline-flex px-2.5 py-1 rounded-md font-medium ${getElementBadgeClass()}">${pxEsc(q.element)}</span>
                    ${q.topic ? `<span class="inline-flex px-2.5 py-1 rounded-md bg-blue-50 text-[#1E3A5F] border border-slate-300 font-semibold">Topik: ${pxEsc(q.topic)}</span>` : ''}
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                    <span class="hidden sm:inline-flex items-center gap-1 text-[11px] text-emerald-700 font-medium whitespace-nowrap">
                      <i data-lucide="cloud-check" class="w-3.5 h-3.5"></i>
                      <span>${pxEsc(ss.lastSavedAt)}</span>
                    </span>
                    <span class="px-2.5 py-1 rounded-md bg-slate-100 border border-slate-300 text-slate-700 font-mono-code font-semibold whitespace-nowrap">Bobot: ${q.weight} poin</span>
                  </div>
                </div>

                ${hasStimulus ? `
                  <div class="grid grid-cols-1 xl:grid-cols-12 gap-5 items-start">
                    <div class="xl:col-span-6 min-w-0 space-y-3">
                      <div class="text-[11px] font-mono-code font-semibold uppercase tracking-wider text-[#1E3A5F]">Stimulus &amp; Referensi</div>
                      ${q.hasAudioStimulus ? renderAudioStimulusBox(q) : ''}
                      ${q.stimulusHtml || ''}
                    </div>

                    <div class="xl:col-span-6 min-w-0 space-y-4">
                      <div class="exam-prompt-body ${fontCls} text-slate-900">
                        ${q.formattedPrompt}
                      </div>
                      <div>
                        ${renderQuestionAnswerInput(q, currentAns)}
                      </div>
                    </div>
                  </div>
                ` : `
                  <div class="max-w-3xl min-w-0 space-y-5">
                    <div class="exam-prompt-body ${fontCls} text-slate-900">
                      ${q.formattedPrompt}
                    </div>
                    <div>
                      ${renderQuestionAnswerInput(q, currentAns)}
                    </div>
                  </div>
                `}
              </div>

              <!-- Bottom Navigation Controls -->
              <div class="studio-card p-3 sm:px-5 sm:py-3.5 flex flex-wrap items-center justify-between gap-2.5">
                <button type="button" onclick="goToQuestion(${idx - 1})" ${idx === 0 ? 'disabled' : ''}
                  class="px-3.5 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 disabled:opacity-40 disabled:pointer-events-none text-xs sm:text-sm font-semibold text-slate-700 flex items-center gap-1.5 transition whitespace-nowrap">
                  <i data-lucide="arrow-left" class="w-4 h-4 shrink-0"></i>
                  <span>Sebelumnya</span>
                </button>

                <div class="flex flex-wrap items-center justify-center gap-2">
                  <button type="button" onclick="toggleFlagQuestion('${q.id}')"
                    class="px-3.5 py-2 rounded-lg border text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition whitespace-nowrap ${isFlagged ? 'bg-amber-700 border-amber-800 text-white' : 'border-slate-300 bg-slate-50 hover:bg-slate-100 text-slate-800'}">
                    <i data-lucide="flag" class="w-3.5 h-3.5 shrink-0"></i>
                    <span>${isFlagged ? 'Ditandai Ragu' : 'Ragu-Ragu'}</span>
                  </button>

                  ${hasCurrentAns ? `
                    <button type="button" onclick="clearQuestionAnswer('${q.id}')"
                      class="px-3 py-2 rounded-lg border border-slate-300 bg-white hover:bg-rose-50 hover:border-rose-200 hover:text-rose-700 text-slate-600 text-xs font-semibold flex items-center gap-1.5 transition whitespace-nowrap" title="Kosongkan jawaban pada soal ini">
                      <i data-lucide="eraser" class="w-3.5 h-3.5 shrink-0"></i>
                      <span>Kosongkan</span>
                    </button>
                  ` : ''}

                  <button type="button" onclick="toggleMobileQuestionDrawer(true)"
                    class="lg:hidden px-3.5 py-2 rounded-lg border border-slate-300 bg-slate-50 hover:bg-slate-100 text-slate-800 text-xs font-semibold flex items-center gap-1.5 whitespace-nowrap">
                    <i data-lucide="grid" class="w-4 h-4 shrink-0"></i>
                    <span>Daftar Soal</span>
                  </button>
                </div>

                ${idx < totalQ - 1 ? `
                  <button type="button" onclick="goToQuestion(${idx + 1})"
                    class="px-3.5 py-2 rounded-lg btn-sapphire text-xs sm:text-sm font-semibold flex items-center gap-1.5 whitespace-nowrap">
                    <span>Berikutnya</span>
                    <i data-lucide="arrow-right" class="w-4 h-4 shrink-0"></i>
                  </button>
                ` : `
                  <button type="button" onclick="confirmFinishExam()"
                    class="px-3.5 py-2 rounded-lg btn-sapphire text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition whitespace-nowrap">
                    <i data-lucide="check" class="w-4 h-4 shrink-0"></i>
                    <span>Selesai Ujian</span>
                  </button>
                `}
              </div>
            </div>

            <!-- Desktop Matrix Sidebar -->
            <aside class="hidden lg:block lg:col-span-3 studio-card p-4 sticky top-[4.5rem]">
              ${navigatorInnerHtml}
            </aside>
          </div>

          ${ss.paused ? `
            <div class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-xs text-white flex flex-col items-center justify-center p-6 text-center">
              <i data-lucide="pause-circle" class="w-10 h-10 text-amber-400 mb-3"></i>
              <h2 class="text-lg font-bold text-white">Sesi Ujian Dijeda oleh Proktor</h2>
              <p class="text-xs sm:text-sm text-slate-300 max-w-md mt-1.5">Waktu pengerjaan dihentikan sementara. Mohon tunggu hingga proktor melanjutkan sesi.</p>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderAudioStimulusBox(q) {
      const ss = state.studentSession;
      const played = ss.audioPlayCountByQ[q.id] || 0;
      const maxPlays = q.audioMaxPlays || 2;
      const isPlaying = ss.audioPlayingQId === q.id;

      return `
        <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-300 space-y-2.5">
          <div class="flex items-center justify-between gap-2 text-xs">
            <span class="font-semibold text-[#1E3A5F] flex items-center gap-1.5">
              <i data-lucide="volume-2" class="w-4 h-4"></i> Stimulus Audio
            </span>
            <span class="font-mono-code font-semibold text-slate-700">${played}/${maxPlays}x</span>
          </div>
          <div class="flex items-center gap-3">
            <button type="button" onclick="playExamAudio('${q.id}')" ${isPlaying || played >= maxPlays ? 'disabled' : ''}
              class="px-3.5 py-1.5 rounded-lg btn-sapphire disabled:opacity-40 text-white text-xs font-semibold flex items-center gap-1.5 shrink-0">
              <i data-lucide="${isPlaying ? 'loader' : 'play'}" class="w-3.5 h-3.5"></i>
              <span>${isPlaying ? 'Memutar...' : (played >= maxPlays ? 'Batas Habis' : 'Putar')}</span>
            </button>
            <div class="flex-1 h-2 rounded-full bg-slate-200 overflow-hidden">
              <div class="h-full bg-[#1E3A5F] transition-all" style="width:${isPlaying ? ss.audioProgressPct : 0}%"></div>
            </div>
          </div>
          ${isPlaying ? `<div class="p-2.5 rounded-lg bg-white border border-slate-200 text-xs text-slate-600 italic leading-relaxed">"${pxEsc(q.audioTranscript)}"</div>` : ''}
        </div>
      `;
    }

    function renderQuestionAnswerInput(q, currentAns) {
      if (q.type === 'PG') {
        const opts = getOrderedOptionsForQuestion(q);
        return `
          <div class="space-y-2">
            ${opts.map((opt, idx) => {
              const displayLetter = ['A', 'B', 'C', 'D', 'E'][idx] || opt.key;
              const isSelected = currentAns === opt.key;
              return `
                <button type="button" onclick="selectSingleOption('${q.id}', '${opt.key}')"
                  class="studio-option ${isSelected ? 'selected' : ''}">
                  <span class="studio-option-key">${displayLetter}</span>
                  <div class="text-sm text-slate-800 pt-0.5 leading-relaxed">${opt.text}</div>
                </button>
              `;
            }).join('')}
          </div>
        `;
      }

      if (q.type === 'PG_KOMPLEKS') {
        const selectedArr = Array.isArray(currentAns) ? currentAns : [];
        return `
          <div class="space-y-2">
            <div class="text-xs font-medium text-slate-500">Pilih lebih dari satu pernyataan yang benar:</div>
            ${q.options.map(opt => {
              const checked = selectedArr.includes(opt.key);
              return `
                <button type="button" onclick="toggleMultiOption('${q.id}', '${opt.key}')"
                  class="studio-option ${checked ? 'selected' : ''}">
                  <input type="checkbox" ${checked ? 'checked' : ''} class="pointer-events-none mt-1 w-4 h-4 rounded accent-[#1E3A5F] shrink-0">
                  <div class="text-sm text-slate-800 leading-relaxed">${opt.text}</div>
                </button>
              `;
            }).join('')}
          </div>
        `;
      }

      if (q.type === 'BENAR_SALAH') {
        const ansObj = (currentAns && typeof currentAns === 'object') ? currentAns : {};
        return `
          <div class="table-scroll-wrap border border-slate-300 rounded-xl">
            <table class="cbt-table text-xs sm:text-sm">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-300 font-semibold text-slate-700">
                  <th class="min-w-[220px]">Pernyataan</th>
                  <th class="text-center w-20">Benar</th>
                  <th class="text-center w-20">Salah</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${q.statements.map(st => `
                  <tr class="hover:bg-slate-50/60">
                    <td class="text-slate-800 leading-relaxed">${st.text}</td>
                    <td class="text-center">
                      <input type="radio" name="bs_${q.id}_${st.id}" ${ansObj[st.id] === 'Benar' ? 'checked' : ''}
                        onchange="setStatementAnswer('${q.id}', '${st.id}', 'Benar')" class="w-4 h-4 cursor-pointer accent-[#1E3A5F]">
                    </td>
                    <td class="text-center">
                      <input type="radio" name="bs_${q.id}_${st.id}" ${ansObj[st.id] === 'Salah' ? 'checked' : ''}
                        onchange="setStatementAnswer('${q.id}', '${st.id}', 'Salah')" class="w-4 h-4 cursor-pointer accent-[#1E3A5F]">
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      if (q.type === 'MENJODOHKAN') {
        const ansObj = (currentAns && typeof currentAns === 'object') ? currentAns : {};
        const choices = q.distractorChoices || q.pairs.map(p => p.right);
        return `
          <div class="space-y-2.5">
            ${q.pairs.map(pr => `
              <div class="p-3.5 rounded-xl border border-slate-300 bg-slate-50/70 grid grid-cols-1 sm:grid-cols-12 gap-3 items-center">
                <div class="sm:col-span-7 text-xs sm:text-sm font-medium text-slate-800">${pr.left}</div>
                <div class="sm:col-span-5">
                  <select onchange="setMatchingAnswer('${q.id}', '${pr.id}', this.value)"
                    class="w-full p-2.5 rounded-lg border border-slate-300 bg-white text-xs sm:text-sm font-semibold text-slate-900">
                    <option value="">-- Pilih Pasangan --</option>
                    ${choices.map(ch => `<option value="${pxEsc(ch)}" ${ansObj[pr.id] === ch ? 'selected' : ''}>${pxEsc(ch)}</option>`).join('')}
                  </select>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      if (q.type === 'ISIAN') {
        return `
          <div class="max-w-sm space-y-1.5">
            <label class="block text-xs font-semibold text-slate-600">Jawaban Singkat:</label>
            <input type="text" value="${pxEsc(currentAns || '')}"
              oninput="saveTextAnswer('${q.id}', this.value)"
              placeholder="Ketik angka / jawaban..."
              class="w-full p-3 rounded-lg border border-slate-300 bg-white font-mono-code font-bold text-base focus:border-[#1E3A5F] outline-none">
          </div>
        `;
      }

      if (q.type === 'ESAI') {
        return `
          <div class="space-y-1.5">
            <label class="block text-xs font-semibold text-slate-600">Jawaban Uraian / Kode Python:</label>
            <textarea rows="6" oninput="saveTextAnswer('${q.id}', this.value)"
              placeholder="Tuliskan analisis bug dan perbaikan kode Python..."
              class="w-full p-3.5 rounded-xl border border-slate-300 bg-white font-mono-code text-xs sm:text-sm leading-relaxed focus:border-[#1E3A5F] outline-none">${pxEsc(currentAns || '')}</textarea>
          </div>
        `;
      }

      return '';
    }

    function renderSiswaFinished() {
      const st = getActiveStudent();
      const scoreInfo = computeStudentScores(st);
      const activeQuestions = getActiveExamQuestions();
      const answeredTotal = activeQuestions.filter(q => pxHas(st.answers && st.answers[q.id])).length;
      const feedbacks = Object.entries(st.essayFeedbacks || {}).filter(([, txt]) => txt && txt.trim());

      return `
        <div class="max-w-xl mx-auto py-4 animate-fade-in">
          <div class="studio-card overflow-hidden">
            <div class="p-6 bg-[#1E3A5F] text-white text-center space-y-2 border-b border-slate-300">
              <div class="w-11 h-11 rounded-xl bg-white/15 border border-white/25 text-white mx-auto flex items-center justify-center">
                <i data-lucide="check" class="w-6 h-6"></i>
              </div>
              <h1 class="text-lg font-bold text-white">Ujian Telah Diselesaikan</h1>
              <p class="text-xs text-slate-200">Lembar jawaban Anda telah tersimpan ke dalam sistem akademik.</p>
            </div>

            <div class="p-6 space-y-4 text-xs sm:text-sm">
              <div class="grid grid-cols-2 gap-3.5 p-4 rounded-xl bg-slate-50 border border-slate-300">
                <div>
                  <span class="text-slate-500 block text-xs">Nama Peserta</span>
                  <strong class="text-slate-900">${pxEsc(st.name)}</strong>
                </div>
                <div>
                  <span class="text-slate-500 block text-xs">NIS / Kelas</span>
                  <strong class="font-mono-code text-slate-900">${pxEsc(st.nis)} (${pxEsc(st.className)})</strong>
                </div>
                <div>
                  <span class="text-slate-500 block text-xs">Judul Ujian</span>
                  <strong class="text-[#1E3A5F]">${pxEsc(state.examConfig.title)}</strong>
                </div>
                <div>
                  <span class="text-slate-500 block text-xs">Waktu Selesai</span>
                  <strong class="font-mono-code text-slate-900">${pxEsc(st.finishTime)} (${pxEsc(st.duration || '-')})</strong>
                </div>
              </div>

              <div class="grid grid-cols-3 gap-2.5 p-3.5 rounded-xl bg-slate-50 border border-slate-300 text-center font-mono-code text-xs">
                <div>
                  <span class="text-slate-500 block font-sans text-[11px]">Butir Dijawab</span>
                  <strong class="text-slate-900 text-sm">${answeredTotal}/${activeQuestions.length}</strong>
                </div>
                <div>
                  <span class="text-slate-500 block font-sans text-[11px]">Poin Objektif</span>
                  <strong class="text-[#1E3A5F] text-sm">${scoreInfo.objectiveEarned}/${scoreInfo.objectiveMax}</strong>
                </div>
                <div>
                  <span class="text-slate-500 block font-sans text-[11px]">Poin Esai</span>
                  <strong class="text-slate-900 text-sm">${scoreInfo.hasUngradedEssay ? 'Menunggu' : `${scoreInfo.essayEarned}/${scoreInfo.essayMax}`}</strong>
                </div>
              </div>

              ${state.examConfig.showScoreToStudent ? `
                <div class="p-5 rounded-xl bg-slate-50 border border-slate-300 text-center space-y-1">
                  <div class="text-xs font-mono-code uppercase tracking-wider text-slate-500">${scoreInfo.hasUngradedEssay ? 'Skor Objektif Sementara' : 'Nilai Akhir Asesmen'}</div>
                  <div class="text-4xl font-mono-code font-bold text-[#1E3A5F]">${scoreInfo.finalScore}</div>
                  <div class="text-xs text-slate-600 pt-1">
                    ${scoreInfo.hasUngradedEssay ? 'Butir soal esai sedang menunggu penilaian guru mata pelajaran.' : `Predikat: ${scoreInfo.ppaDescriptor.levelLabel} (KKTP ${state.examConfig.kktp})`}
                  </div>
                </div>
                ${feedbacks.length > 0 ? `
                  <div class="p-4 rounded-xl bg-blue-50 border border-blue-200 text-xs space-y-1">
                    <div class="font-bold text-[#1E3A5F]">Catatan Umpan Balik Guru Mapel:</div>

          ${state.guruTab === 'paket' ? `<div class="space-y-4">${guruChips('guruPaketSub', [['config', 'Pengaturan Paket'], ['bank', 'Bank Soal'], ['ref', 'Referensi CP–ATP &amp; PPA']])}${state.guruPaketSub === 'bank' ? renderGuruBankSoal() : (state.guruPaketSub === 'ref' ? renderCpAtpRef('guru') : renderGuruConfig())}</div>` : ''}
          ${state.guruTab === 'koreksi' ? renderGuruKoreksi() : ''}
          ${state.guruTab === 'hasil' ? `<div class="space-y-4">${guruChips('guruHasilSub', [['hasil', 'Hasil Asesmen'], ['remedial', 'Perlu Remedial'], ['pengayaan', 'Pengayaan'], ['rekap', 'Rekap &amp; e-Rapor']])}${state.guruHasilSub === 'remedial' ? renderGuruRemedial('remedial') : (state.guruHasilSub === 'pengayaan' ? renderGuruRemedial('pengayaan') : state.guruHasilSub === 'rekap' ? renderGuruRekap() : renderGuruHasil())}</div>` : ''}

    // ===== GURU: RINGKASAN, REMEDIAL & PENGAYAAN, PRATINJAU =====
    function pxWeakTopics(st, pkg) {
      const out = [];
      const qsWeak = pkg ? getQuestionsForPackage(pkg).filter(q => q.included) : getActiveExamQuestions();
      qsWeak.forEach(q => {
        const earned = q.type === 'ESAI'
          ? (st.essayScores && st.essayScores[q.id] !== undefined ? Number(st.essayScores[q.id]) : 0)
          : evaluateQuestionItemScore(q, st.answers ? st.answers[q.id] : undefined);
        const t = (q.topic || ((q.tp || '').split('—')[1] || q.tp || 'Informatika')).trim();
        if (earned / Math.max(1, q.weight) < 0.70 && !out.includes(t)) out.push(t);
      });
      return out;
    }

    // ===== GRAFIK RINGAN (SVG/CSS, tanpa pustaka) =====
    const PX_COL = { ok: '#059669', warn: '#D97706', bad: '#E11D48', main: '#1E3A5F', mute: '#94A3B8', info: '#2563EB' };
    function pxChartCard(title, body, sub) {
      return `<div class="studio-card p-4 space-y-3 min-w-0"><div><h3 class="font-bold text-sm text-slate-900">${title}</h3>${sub ? `<p class="text-[11px] text-slate-500">${sub}</p>` : ''}</div>${body}</div>`;
    }
    function pxBars(items, opt = {}) {
      if (!items.length) return '<p class="text-xs text-slate-500">Belum ada data.</p>';
      const max = opt.max || Math.max(1, ...items.map(i => i.value));
      const ref = opt.ref !== undefined ? `<div class="absolute top-0 bottom-0 border-l-2 border-dashed border-slate-500" style="left:${Math.min(100, opt.ref / max * 100)}%" title="${pxEsc(opt.refLabel || '')}"></div>` : '';
      return `<div class="space-y-1.5">${items.map(i => `<div class="flex items-center gap-2 text-[11px]"><span class="w-28 sm:w-36 truncate text-slate-700" title="${pxEsc(i.label)}">${pxEsc(i.label)}</span><div class="relative flex-1 h-4 rounded bg-slate-100 overflow-hidden"><div class="h-full rounded" style="width:${Math.max(0, Math.min(100, i.value / max * 100))}%;background:${i.color || PX_COL.main}"></div>${ref}</div><span class="w-8 text-right font-mono-code font-bold text-slate-800">${i.value}</span></div>`).join('')}</div>${opt.ref !== undefined ? `<p class="text-[10px] text-slate-500">Garis putus-putus: ${pxEsc(opt.refLabel || '')}</p>` : ''}`;
    }
    function pxDonut(parts, center) {
      const total = parts.reduce((a, x) => a + x.value, 0);
      if (!total) return '<p class="text-xs text-slate-500">Belum ada data.</p>';
      let off = 0;
      const arcs = parts.filter(x => x.value > 0).map(x => { const pct = x.value / total * 100; const a = `<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${x.color}" stroke-width="6" stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="${-off}" transform="rotate(-90 21 21)"></circle>`; off += pct; return a; }).join('');
      return `<div class="flex items-center gap-4 flex-wrap"><svg viewBox="0 0 42 42" class="w-28 h-28 shrink-0" role="img"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="#E2E8F0" stroke-width="6"></circle>${arcs}<text x="21" y="22.5" text-anchor="middle" font-size="6" font-weight="700" fill="${PX_COL.main}">${center}</text></svg><ul class="space-y-1 text-[11px] text-slate-700">${parts.map(x => `<li class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-sm" style="background:${x.color}"></span>${pxEsc(x.label)} <strong class="font-mono-code">${x.value}</strong></li>`).join('')}</ul></div>`;
    }
    function pxGuruCharts(scs, pkg) {
      const done = scs.filter(x => !x.sc.hasUngradedEssay);
      const cnt = f => done.filter(x => f(x.sc.finalScore)).length;
      const kk = Number((pkg && pkg.kktp) || 61);
      const rem = cnt(v => v < kk), mid = cnt(v => v >= kk && v < PX_ENR_MIN), enr = cnt(v => v >= Math.max(kk, PX_ENR_MIN));
      const bins = [['0–20', 0, 20, PX_COL.bad], ['21–40', 21, 40, PX_COL.bad], ['41–60', 41, 60, PX_COL.warn], ['61–80', 61, 80, PX_COL.ok], ['81–100', 81, 100, PX_COL.info]]
        .map(([l, a, b, c]) => ({ label: l, value: done.filter(x => x.sc.finalScore >= a && x.sc.finalScore <= b).length, color: c }));
      return `<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        ${pxChartCard('Ketercapaian (PPA 2025)', pxDonut([{ label: `Perlu remedial (< ${kk})`, value: rem, color: PX_COL.warn }, { label: `Sudah mencapai (${kk}–${PX_ENR_MIN - 1})`, value: mid, color: PX_COL.ok }, { label: 'Pengayaan (81–100)', value: enr, color: PX_COL.info }, { label: 'Esai belum dikoreksi', value: scs.length - done.length, color: PX_COL.mute }], done.length ? Math.round((mid + enr) / done.length * 100) + '%' : '-'), `Persentase = sudah mencapai (KKTP ${kk})`)}
        ${pxChartCard('Sebaran Nilai Akhir', pxBars(bins), 'Jumlah peserta per interval menurut panduan asesmen')}
      </div>`;
    }
    function pxRemChart(list) {
      if (!list.length) return '';
      const kk = list[0].kktp;
      return `<div class="p-4 border-b border-slate-200">${pxBars(list.map(x => ({ label: x.name, value: x.score, color: PX_COL.warn })), { max: 100, ref: kk, refLabel: 'KKTP ' + kk })}</div>`;
    }
    function pxPreviewChart(qs) {
      const by = f => { const m = {}; qs.forEach(q => { const k = f(q) || '-'; m[k] = (m[k] || 0) + 1; }); return Object.entries(m).map(([label, value]) => ({ label, value })); };
      return `<div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><div class="space-y-1.5"><div class="text-[11px] font-semibold text-slate-700">Komposisi tipe soal</div>${pxBars(by(q => q.typeLabel || q.type))}</div><div class="space-y-1.5"><div class="text-[11px] font-semibold text-slate-700">Sebaran elemen / topik</div>${pxBars(by(q => q.element || q.topic).map(i => ({ ...i, color: PX_COL.info })))}</div></div>`;
    }
    function pxAdminBerandaCharts(sts) {
      const by = f => { const m = {}; sts.forEach(x => { const k = f(x); m[k] = (m[k] || 0) + 1; }); return m; };
      const st = by(x => x.status || '-');
      const colOf = { 'Selesai': PX_COL.ok, 'Sedang Mengerjakan': PX_COL.info, 'Terblokir': PX_COL.bad };
      const parts = Object.entries(st).map(([label, value]) => ({ label, value, color: colOf[label] || PX_COL.mute }));
      const rooms = Object.entries(by(x => x.room || 'Belum diatur')).map(([label, value]) => ({ label, value }));
      const done = st['Selesai'] || 0;
      return `<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        ${pxChartCard('Status Peserta', pxDonut(parts, sts.length ? Math.round(done / sts.length * 100) + '%' : '-'), 'Persentase = peserta selesai')}
        ${pxChartCard('Peserta per Ruang', pxBars(rooms), 'Sebaran penempatan ruang laboratorium')}
      </div>`;
    }
    function pxAuditCharts(rows) {
      const top = f => { const m = {}; rows.forEach(l => { const k = f(l) || '-'; m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([label, value]) => ({ label, value })); };
      if (!rows.length) return '';
      return `<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 p-4 border-b border-slate-200 no-print">
        <div class="space-y-1.5"><div class="text-[11px] font-semibold text-slate-700">Aksi terbanyak</div>${pxBars(top(l => l.action))}</div>
        <div class="space-y-1.5"><div class="text-[11px] font-semibold text-slate-700">Aktor teraktif</div>${pxBars(top(l => l.actor).map(i => ({ ...i, color: PX_COL.info })))}</div>
      </div>`;
    }

    function pxPreviewPackage() {
      const pkg = getActiveTeacherPackage(getCurrentTeacherAccount());
      const qs = getQuestionsForPackage(pkg).filter(q => q.included);
      openModal(`
        <div class="p-6 space-y-4 max-h-[85vh] overflow-y-auto">
          <div class="flex items-center justify-between border-b border-slate-200 pb-3">
            <div><h3 class="font-bold text-base text-slate-900">Pratinjau Soal: ${pxEsc(pkg.title)}</h3>
            <p class="text-xs text-slate-500">${qs.length} butir aktif &bull; kunci jawaban ditandai hijau (hanya terlihat guru)</p></div>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg border border-slate-300 text-slate-500"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          ${qs.length ? pxPreviewChart(qs) : ''}
          ${qs.length === 0 ? '<p class="text-xs text-amber-700">Belum ada butir soal aktif.</p>' : qs.map((q, i) => `
            <div class="p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs space-y-2">
              <div class="flex justify-between font-semibold text-slate-700"><span>No. ${i + 1} &bull; ${pxEsc(q.typeLabel || q.type)}</span><span class="font-mono-code">${q.weight} poin</span></div>
              <div class="leading-relaxed">${q.formattedPrompt || ''}</div>
              ${(q.options || []).map(o => `<div class="px-2 py-1 rounded ${String(q.correctKey || '').split(',').includes(o.key) ? 'bg-emerald-100 text-emerald-900 font-semibold' : 'bg-white border border-slate-200'}"><span class="font-mono-code">${pxEsc(o.key)}.</span> ${o.text}</div>`).join('')}
            </div>`).join('')}
        </div>`, 'max-w-3xl');
    }

    function renderGuruRingkasan() {
      const acc = getCurrentTeacherAccount();
      const pkg = getActiveTeacherPackage(acc);
      const rd = getPackageReadiness(pkg);
      const takers = pxGuruStudents();
      const scs = takers.map(st => ({ st, sc: computeStudentScores(st) }));
      const ungraded = scs.filter(x => x.sc.hasUngradedEssay).length;
      const passed = scs.filter(x => x.sc.passed).length;
      const avg = scs.length ? Math.round(scs.reduce((s, x) => s + x.sc.finalScore, 0) / scs.length) : 0;
      const remNeed = scs.filter(x => !x.sc.hasUngradedEssay && !x.sc.passed).length;
      const blocked = state.students.filter(s => s.status === 'Terblokir').length;
      const card = (lbl, val, sub, cls = 'text-slate-900') => `<div class="px-4 py-3 rounded-xl bg-slate-50 border border-slate-300"><div class="text-[11px] text-slate-500">${lbl}</div><div class="font-mono-code font-bold text-lg ${cls}">${val}</div><div class="text-[10px] text-slate-500">${sub}</div></div>`;
      const go = (t, l) => `<button type="button" onclick="state.guruTab='${t}'; renderApp();" class="px-3 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-xs font-semibold text-[#1E3A5F]">${l}</button>`;
      return `
        <div class="space-y-4">
          ${pxGuruCharts(scs, pkg)}
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            ${card('Kesiapan Soal', `${rd.activeCount}/${rd.targetCount}`, `${rd.totalWeight} poin`, rd.ready ? 'text-emerald-700' : 'text-amber-700')}
            ${card('Esai Belum Dikoreksi', ungraded, 'peserta', ungraded ? 'text-amber-700' : 'text-emerald-700')}
            ${card('Rata-rata Nilai', avg, `KKTP ${pkg.kktp}`)}
            ${card('Tuntas', `${passed}/${scs.length}`, `${remNeed} perlu remedial (di bawah KKTP)`, remNeed ? 'text-rose-700' : 'text-emerald-700')}
          </div>

    function renderGuruRemedial(part) {
      const pkg = getActiveTeacherPackage(getCurrentTeacherAccount());
      const rows = pxGuruStudents().map(st => ({ st, sc: computeStudentScores(st) })).filter(x => !x.sc.hasUngradedEssay);
      const rem = rows.filter(x => !x.sc.passed).sort((a, b) => a.sc.finalScore - b.sc.finalScore);
      const enr = rows.filter(x => x.sc.rawScore100 >= PX_ENR_MIN);
      const tbl = (list, withRem) => list.length === 0 ? '<p class="text-xs text-slate-500 p-4">Tidak ada peserta.</p>' : `
        <div class="overflow-x-auto"><table class="cbt-table w-full text-xs"><thead><tr><th>Peserta</th><th>Nilai</th>${withRem ? '<th>Topik Perlu Diperkuat</th><th>Remedial</th>' : '<th>Predikat</th>'}</tr></thead><tbody>
        ${list.map(({ st, sc }) => `<tr>
          <td><div class="font-semibold text-slate-900">${pxEsc(st.name)}</div><div class="text-[11px] font-mono-code text-slate-500">${pxEsc(st.className)}</div></td>
          <td class="font-mono-code font-bold">${sc.finalScore}</td>
          ${withRem ? `<td class="text-slate-600">${pxWeakTopics(st).map(pxEsc).join(', ') || '-'}</td>
            <td><button type="button" onclick="openRemedialModal('${st.id}')" class="px-2 py-0.5 rounded border border-slate-300 font-mono-code hover:bg-slate-50">${st.remedialScore !== null && st.remedialScore !== undefined ? st.remedialScore : '+ Input'}</button></td>`
          : `<td><span class="px-2 py-0.5 rounded-md font-semibold ${sc.ppaDescriptor.badgeCls}">${sc.ppaDescriptor.levelLabel}</span></td>`}
        </tr>`).join('')}</tbody></table></div>`;
      return `
        <div class="space-y-4">
          ${part !== 'pengayaan' ? `<div class="studio-card overflow-hidden">
            <div class="p-4 border-b border-slate-200"><h2 class="font-bold text-sm text-slate-900">Perlu Remedial (di bawah KKTP ${pkg.kktp})</h2>
            <p class="text-xs text-slate-500">Peserta dengan esai belum dikoreksi tidak ditampilkan agar tidak salah klasifikasi.</p></div>
            ${pxRemChart(rem.map(x => ({ name: x.st.name, score: x.sc.finalScore, kktp: pkg.kktp })))}${tbl(rem, true)}
          </div>` : ''}
          ${part !== 'remedial' ? `<div class="studio-card overflow-hidden">
            <div class="p-4 border-b border-slate-200"><h2 class="font-bold text-sm text-slate-900">Kandidat Pengayaan (nilai awal ${PX_ENR_MIN}–100)</h2></div>
            ${tbl(enr, false)}
          </div>` : ''}
        </div>`;
    }

                  <label class="block text-xs font-semibold text-slate-700">Durasi (Menit)</label>
                  <input type="number" min="15" max="240" value="${activePkg.durationMinutes}"
                    onchange="updateTeacherPackageField('durationMinutes', Math.max(15, Number(this.value)||90))" class="w-full p-2.5 rounded-lg border border-slate-300 font-mono-code font-bold">
                </div>
                <div class="space-y-1.5">
                  <label class="block text-xs font-semibold text-slate-700">Nilai KKTP</label>
                  <input type="number" min="41" max="100" value="${activePkg.kktp}"
                    onchange="updateTeacherPackageField('kktp', Math.min(100, Math.max(41, Number(this.value)||61)))" class="w-full p-2.5 rounded-lg border border-slate-300 font-mono-code font-bold">

                <div class="space-y-1.5">
                  <label class="block text-xs font-semibold text-slate-700">Maks. Pelanggaran Layar</label>
                  <input type="number" min="1" max="10" value="${activePkg.maxViolations}"
                    onchange="updateTeacherPackageField('maxViolations', Math.max(1, Number(this.value)||3))" class="w-full p-2.5 rounded-lg border border-slate-300 font-mono-code font-bold">

              <div class="space-y-1.5 pt-1">
                <label class="block text-xs font-semibold text-slate-700">Aturan Pengolahan Nilai Remedial (PPA 2025)</label>
                <select onchange="state.remedialRule=this.value; pxSaveImmediate(); showToast('Tersimpan', 'Aturan nilai remedial diperbarui.', 'info');"
                  class="w-full p-2.5 rounded-lg border border-slate-300 bg-white font-semibold text-xs">
                  <option value="highest" ${state.remedialRule === 'highest' ? 'selected' : ''}>Ambil Nilai Tertinggi (Antara Nilai Awal &amp; Nilai Remedial)</option>
                  <option value="average" ${state.remedialRule === 'average' ? 'selected' : ''}>Rata-rata Nilai Awal dan Nilai Remedial</option>
                  <option value="cap_kktp" ${state.remedialRule === 'cap_kktp' ? 'selected' : ''}>Maksimal Sebatas Nilai KKTP (${activePkg.kktp})</option>

            <div class="pt-3 border-t border-slate-200 flex flex-wrap justify-end gap-2">
              <button type="button" onclick="state.guruTab='bank'; renderApp();"

                Lanjut Susun Butir Soal (${readiness.activeCount}/${readiness.targetCount}) &rarr;
              </button>
              <button type="button" onclick="syncPackageAcrossSystem(getActiveTeacherPackage(), { activateForStudents: false }); pxSaveImmediate(); showToast('Paket Tersinkron', 'Judul soal, CP, ATP, dan jadwal Admin berhasil disinkronkan.', 'success');"
                class="px-5 py-2.5 rounded-lg btn-sapphire text-xs font-semibold inline-flex items-center gap-2">
                <i data-lucide="save" class="w-4 h-4"></i>
                <span>Simpan &amp; Sinkronkan</span>
              </button>
            </div>
          </div>
