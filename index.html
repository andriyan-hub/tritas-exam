    function renderGuruKoreksi() {
      const teacherAcc = getCurrentTeacherAccount();
      const pool = getTeacherQuestions(teacherAcc);
      const essayQuestions = pool.filter(q => q.type === 'ESAI');
      if (essayQuestions.length === 0) {
        return `<div class="studio-card p-8 text-center text-sm text-slate-500">Belum ada butir soal bertipe Uraian / Esai di bank soal Anda.</div>`;
      }

      const activeQ = essayQuestions.find(q => q.id === state.selectedEssayQuestionId) || essayQuestions[0];
      const filterStatus = state.essayFilterStatus || 'ALL';
      const isBlind = !!state.essayBlindGrading;

      const participantsWithExam = sortStudentsByName(pxGuruStudents());
      if (participantsWithExam.length === 0) {
        return `<div class="studio-card p-8 text-center text-xs sm:text-sm text-slate-500">Belum ada peserta didik yang menyelesaikan ujian. Lembar jawaban uraian/esai akan tampil otomatis setelah peserta mengumpulkan ujian.</div>`;
      }

      const filteredStudents = participantsWithExam.filter(st => {
        const sc = st.essayScores ? st.essayScores[activeQ.id] : undefined;
        const isGraded = sc !== undefined && sc !== '';
        if (filterStatus === 'UNGRADED') return !isGraded;
        if (filterStatus === 'GRADED') return isGraded;
        return true;
      });

      const activeStudent = filteredStudents.find(s => s.id === state.selectedEssayStudentId)
        || filteredStudents[0]
        || participantsWithExam[0]
        || state.students[0];

      const currentScore = activeStudent.essayScores && activeStudent.essayScores[activeQ.id] !== undefined ? activeStudent.essayScores[activeQ.id] : '';
      const currentFeedback = (activeStudent.essayFeedbacks && activeStudent.essayFeedbacks[activeQ.id]) || '';
      const gradedCount = participantsWithExam.filter(st => st.essayScores && st.essayScores[activeQ.id] !== undefined && st.essayScores[activeQ.id] !== '').length;
      const studentGradedEssays = essayQuestions.filter(eq => activeStudent.essayScores && activeStudent.essayScores[eq.id] !== undefined && activeStudent.essayScores[eq.id] !== '').length;

      const formatStudentLabel = (st, idx) => {
        if (!isBlind) return `${idx + 1}. ${pxEsc(st.name)}`;
        return `Peserta Anonim #${String(idx + 1).padStart(2, '0')} (${pxEsc(st.id)})`;
      };

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
          <div class="lg:col-span-4 studio-card p-4 sm:p-5 space-y-4">
            <div class="space-y-1.5">
              <div class="flex items-center justify-between gap-2">
                <label class="block text-xs font-semibold text-slate-700">Butir Esai</label>
                <span class="px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-800 border border-emerald-200 font-mono-code text-[11px] font-bold whitespace-nowrap">
                  Terkoreksi: ${gradedCount}/${participantsWithExam.length}
                </span>
              </div>
              <select onchange="state.selectedEssayQuestionId=this.value; renderApp();" class="w-full p-2.5 rounded-lg border border-slate-300 bg-white text-xs font-semibold">
                ${essayQuestions.map((eq, i) => `<option value="${eq.id}" ${eq.id === activeQ.id ? 'selected' : ''}>Esai #${i + 1} (${eq.id} &bull; Bobot ${eq.weight})</option>`).join('')}
              </select>
            </div>

            <label class="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-300 cursor-pointer text-xs gap-3">
              <div>
                <div class="font-bold text-slate-800 flex items-center gap-1.5">
                  <i data-lucide="eye-off" class="w-3.5 h-3.5 text-[#1E3A5F]"></i>
                  <span>Mode Blind-Grading (Anonim)</span>
                </div>
                <div class="text-[11px] text-slate-500">Sembunyikan nama &amp; NIS saat mengoreksi</div>
              </div>
              <input type="checkbox" ${isBlind ? 'checked' : ''} onchange="state.essayBlindGrading=this.checked; renderApp();" class="w-4 h-4 accent-[#1E3A5F] shrink-0">
            </label>

            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs space-y-1.5">
              <div class="font-semibold text-slate-900">Kunci &amp; Rubrik Penilaian:</div>
              <p class="text-slate-600 leading-relaxed">${pxEsc(activeQ.idealAnswer || '-')}</p>
              ${activeQ.rubric ? `<p class="text-[11px] text-slate-500 border-t border-slate-200 pt-1.5">${pxEsc(activeQ.rubric)}</p>` : ''}
            </div>

            <div class="grid grid-cols-3 gap-1 p-1 rounded-lg bg-slate-100 border border-slate-300 text-[11px] font-semibold">
              <button type="button" onclick="state.essayFilterStatus='ALL'; renderApp();"
                class="py-1 rounded transition ${filterStatus === 'ALL' ? 'bg-[#1E3A5F] text-white' : 'text-slate-700'}">Semua (${participantsWithExam.length})</button>
              <button type="button" onclick="state.essayFilterStatus='UNGRADED'; renderApp();"
                class="py-1 rounded transition ${filterStatus === 'UNGRADED' ? 'bg-amber-700 text-white' : 'text-slate-700'}">Belum</button>
              <button type="button" onclick="state.essayFilterStatus='GRADED'; renderApp();"
                class="py-1 rounded transition ${filterStatus === 'GRADED' ? 'bg-emerald-700 text-white' : 'text-slate-700'}">Selesai</button>
            </div>

            <div class="max-h-64 overflow-y-auto space-y-1.5">
              ${filteredStudents.length === 0 ? `<div class="p-4 text-center text-xs text-slate-400">Tidak ada peserta pada filter ini.</div>` : filteredStudents.map((st, idx) => {
                const sc = st.essayScores ? st.essayScores[activeQ.id] : undefined;
                const isGraded = sc !== undefined && sc !== '';
                const totalStudentGraded = essayQuestions.filter(eq => st.essayScores && st.essayScores[eq.id] !== undefined && st.essayScores[eq.id] !== '').length;
                return `
                  <button type="button" onclick="state.selectedEssayStudentId='${st.id}'; renderApp();"
                    class="w-full p-2.5 rounded-lg border text-left text-xs flex items-center justify-between gap-2 ${st.id === activeStudent.id ? 'border-[#1E3A5F] bg-[#EFF4F9] font-semibold' : 'border-slate-200 hover:bg-slate-50'}">
                    <div class="min-w-0">
                      <div class="truncate">${formatStudentLabel(st, idx)}</div>
                      <div class="text-[10px] font-mono-code text-slate-500">Total Esai: ${totalStudentGraded}/${essayQuestions.length} butir</div>
                    </div>
                    <span class="font-mono-code px-2 py-0.5 rounded text-[11px] shrink-0 whitespace-nowrap ${isGraded ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-500'}">
                      ${isGraded ? `${sc}/${activeQ.weight}` : 'Belum'}
                    </span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="lg:col-span-8 studio-card p-5 sm:p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-3.5">
              <div>
                <h3 class="font-bold text-base text-slate-900">
                  ${isBlind
                    ? `Peserta Anonim (${pxEsc(activeStudent.id)}) <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-900 text-[11px] font-semibold ml-1">Identitas Disembunyikan</span>`
                    : `${pxEsc(activeStudent.name)} <span class="font-mono-code text-xs text-slate-500">(${pxEsc(activeStudent.nis)})</span>`}
                </h3>
                <span class="text-xs text-slate-500">
                  ${isBlind ? 'Sesi Asesmen Terverifikasi' : `Kelas ${pxEsc(activeStudent.className)}`} &bull;
                  Progres Seluruh Esai Siswa: <strong class="font-mono-code ${studentGradedEssays === essayQuestions.length ? 'text-emerald-700' : 'text-amber-700'}">${studentGradedEssays}/${essayQuestions.length} Selesai</strong>
                </span>
              </div>
              <div class="flex gap-2 text-xs shrink-0">
                <button type="button" onclick="navigateEssayStudent(-1)" class="px-3 py-1.5 rounded-lg border border-slate-300 font-semibold whitespace-nowrap">&larr; Sebelumnya</button>
                <button type="button" onclick="navigateEssayStudent(1)" class="px-3 py-1.5 rounded-lg border border-slate-300 font-semibold whitespace-nowrap">Berikutnya &rarr;</button>
              </div>
            </div>

            <details class="rounded-xl border border-slate-300 bg-slate-50 p-3.5 text-xs">
              <summary class="font-bold text-[#1E3A5F] cursor-pointer select-none">Lihat Redaksi Pertanyaan &amp; Stimulus Soal (${pxEsc(activeQ.id)})</summary>
              <div class="mt-3 space-y-3 border-t border-slate-200 pt-3">
                ${activeQ.stimulusHtml || ''}
                <div class="exam-prompt-body text-slate-800">${activeQ.formattedPrompt}</div>
              </div>
            </details>

            <div class="space-y-1.5">
              <div class="text-xs font-semibold text-slate-700">Lembar Jawaban / Kode Peserta Didik:</div>
              <div class="p-4 rounded-xl bg-slate-950 text-emerald-300 font-mono-code text-xs sm:text-sm whitespace-pre-wrap leading-relaxed border border-slate-800">${activeStudent.answers && activeStudent.answers[activeQ.id] ? pxEsc(activeStudent.answers[activeQ.id]) : '// Peserta tidak mengisi jawaban esai.'}</div>
            </div>

            ${Object.values(pxRubricLevels(activeQ)).some(Boolean) ? `
            <div class="space-y-1.5">
              <div class="text-xs font-semibold text-slate-700">Penilaian Cepat per Level Rubrik:</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                ${[['mahir', 'Mahir', 1], ['cakap', 'Cakap', 0.75], ['layak', 'Layak', 0.5], ['baru', 'Baru Berkembang', 0.25]].map(([k, l, r]) => `
                  <button type="button" onclick="pxSaveEssayLevel('${activeStudent.id}', '${activeQ.id}', '${k}', ${r})" class="p-2 rounded-lg border text-left text-[11px] ${Number(currentScore) === Math.round(activeQ.weight * r) && currentScore !== '' ? 'border-[#1E3A5F] bg-[#EFF4F9]' : 'border-slate-300 bg-white hover:bg-slate-50'}">
                    <span class="font-bold text-slate-800">${l} &bull; ${Math.round(activeQ.weight * r)} poin</span>
                    <span class="block text-slate-500 leading-snug">${pxEsc(pxRubricLevels(activeQ)[k] || '-')}</span>
                  </button>`).join('')}
              </div>
            </div>` : ''}

            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-slate-700">Catatan Umpan Balik Guru (Langsung Tampil di Portal Siswa)</label>
              <input type="text" id="essay-feedback-input" value="${pxEsc(currentFeedback)}"
                placeholder="Contoh: Logika slicing benar, namun lupa menambahkan .lower() untuk case-insensitive."
                class="w-full p-2.5 rounded-lg border border-slate-300 text-xs">
            </div>

            <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-200">
              <div class="flex flex-wrap gap-1.5 text-xs">
                ${[0, 0.25, 0.5, 0.75, 1].map(ratio => {
                  const val = Math.round(activeQ.weight * ratio);
                  return `<button type="button" onclick="saveEssayScore('${activeStudent.id}', '${activeQ.id}', ${val}, false)" class="px-2.5 py-1.5 rounded-lg border font-mono-code font-semibold whitespace-nowrap ${Number(currentScore) === val && currentScore !== '' ? 'bg-[#1E3A5F] text-white border-[#1E3A5F]' : 'bg-white border-slate-300'}">${val} (${Math.round(ratio * 100)}%)</button>`;
                }).join('')}
              </div>

              <div class="flex items-center gap-2 shrink-0">
                <span class="text-xs text-slate-500 whitespace-nowrap">Maks ${activeQ.weight}:</span>
                <input type="number" id="manual-essay-score" min="0" max="${activeQ.weight}" value="${currentScore}" class="w-16 p-2 rounded-lg border border-slate-300 font-mono-code font-bold text-center text-sm">
                <button type="button" onclick="saveEssayScore('${activeStudent.id}', '${activeQ.id}', document.getElementById('manual-essay-score').value, true)"
                  class="px-4 py-2 rounded-lg btn-sapphire text-xs font-semibold whitespace-nowrap">
                  Simpan &amp; Lanjut &rarr;
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderGuruAnalisis() {
      const analysis = computePsychometricAnalysis();
      const filterMode = state.analysisFilter || 'ALL';
      const displayedItems = analysis.itemStats.filter(item => {
        if (filterMode === 'REVISION') return item.D < 0.20 || !item.isValid;
        if (filterMode === 'VALIDATED') return !!item.question.validated || item.D >= 0.30;
        return true;
      });
      const revisionCount = analysis.itemStats.filter(item => item.D < 0.20 || !item.isValid).length;

      return `
        <div class="space-y-5">
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
            <div class="studio-card p-4 space-y-1">
              <div class="text-xs text-slate-500">Reliabilitas Tes (KR-20)</div>
              <div class="text-xl sm:text-2xl font-mono-code font-bold text-slate-900">r₁₁ = ${analysis.reliability}</div>
              <div class="text-xs text-emerald-700 font-medium">${analysis.reliabilityLabel}</div>
            </div>
            <div class="studio-card p-4 space-y-1">
              <div class="text-xs text-slate-500">Indeks Kesukaran (P)</div>
              <div class="text-xl sm:text-2xl font-mono-code font-bold text-slate-900">${analysis.avgP}</div>
              <div class="text-xs text-slate-500">Ideal: 0.30 &ndash; 0.70</div>
            </div>
            <div class="studio-card p-4 space-y-1">
              <div class="text-xs text-slate-500">Daya Pembeda (D)</div>
              <div class="text-xl sm:text-2xl font-mono-code font-bold text-[#1E3A5F]">${analysis.avgD}</div>
              <div class="text-xs text-slate-500">Upper vs Lower 27%</div>
            </div>
            <div class="studio-card p-4 space-y-1">
              <div class="text-xs text-slate-500">Butir Soal Valid</div>
              <div class="text-xl sm:text-2xl font-mono-code font-bold text-slate-900">${analysis.validCount} / ${analysis.itemStats.length}</div>
              <div class="text-xs text-slate-500">Sampel N = ${analysis.N}</div>
            </div>
          </div>

          <div class="studio-card overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h3 class="font-bold text-sm sm:text-base text-slate-900">Analisis Psikometri &amp; Efektivitas Pengecoh Butir Soal</h3>
                <p class="text-xs text-slate-500">Menampilkan indeks kesukaran (P), daya pembeda (D), validitas butir, serta sebaran pilihan jawaban A–E.</p>
              </div>
              <div class="flex flex-wrap items-center gap-2 text-xs">
                <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg border border-slate-300 font-semibold">
                  <button type="button" onclick="state.analysisFilter='ALL'; renderApp();"
                    class="px-2.5 py-1 rounded-md transition whitespace-nowrap ${filterMode === 'ALL' ? 'bg-[#1E3A5F] text-white' : 'text-slate-700'}">
                    Semua (${analysis.itemStats.length})
                  </button>
                  <button type="button" onclick="state.analysisFilter='REVISION'; renderApp();"
                    class="px-2.5 py-1 rounded-md transition whitespace-nowrap ${filterMode === 'REVISION' ? 'bg-amber-700 text-white' : 'text-slate-700'}">
                    Revisi (${revisionCount})
                  </button>
                  <button type="button" onclick="state.analysisFilter='VALIDATED'; renderApp();"
                    class="px-2.5 py-1 rounded-md transition whitespace-nowrap ${filterMode === 'VALIDATED' ? 'bg-emerald-700 text-white' : 'text-slate-700'}">
                    Unggulan
                  </button>
                </div>
                <button type="button" onclick="exportItemAnalysisXLS()" class="px-3.5 py-2 rounded-lg btn-sapphire text-xs font-semibold inline-flex items-center gap-1.5 whitespace-nowrap">
                  <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i>
                  <span>Ekspor (.xls)</span>
                </button>
              </div>
            </div>
            <div class="table-scroll-wrap">
              <table class="cbt-table text-xs sm:text-sm">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
                    <th>No</th>
                    <th class="min-w-[200px]">Bentuk, Topik &amp; ATP</th>
                    <th class="text-center">Kesukaran (P)</th>
                    <th class="text-center">Daya Pembeda (D)</th>
                    <th class="text-center">Validitas (r_pbis)</th>
                    <th class="min-w-[175px]">Distribusi Pengecoh (PG)</th>
                    <th class="min-w-[200px]">Keputusan Sistem</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                  ${displayedItems.length === 0 ? `
                    <tr><td colspan="7" class="p-6 text-center text-xs text-slate-500">Tidak ada butir soal pada kategori filter ini.</td></tr>
                  ` : displayedItems.map(item => `
                    <tr>
                      <td class="font-mono-code font-bold whitespace-nowrap">#${item.displayNum}</td>
                      <td>
                        <div class="font-semibold text-slate-900">${pxEsc(item.question.typeLabel)}</div>
                        <div class="text-[11px] text-slate-600">${pxEsc(item.question.topic || '-')}</div>
                        <div class="text-[11px] text-slate-500 line-clamp-1">${pxEsc(item.question.atp || item.question.element)}</div>
                      </td>
                      <td class="text-center font-mono-code whitespace-nowrap">
                        <span class="font-bold">${item.P}</span>
                        <span class="block text-[11px] text-slate-500 font-sans">${item.pCategory}</span>
                      </td>
                      <td class="text-center font-mono-code font-bold whitespace-nowrap ${item.D >= 0.30 ? 'text-emerald-700' : (item.D >= 0.20 ? 'text-amber-700' : 'text-rose-700')}">
                        ${item.D}
                        <span class="block text-[11px] font-normal font-sans text-slate-500">${item.dCategory}</span>
                      </td>
                      <td class="text-center font-mono-code whitespace-nowrap">${item.rPbis}</td>
                      <td>
                        ${item.distractorStats ? `
                          <div class="flex flex-wrap gap-1 font-mono-code text-[11px]">
                            ${item.distractorStats.map(ds => `
                              <span class="px-1.5 py-0.5 rounded border whitespace-nowrap ${ds.isKey ? 'bg-emerald-50 border-emerald-400 text-emerald-800 font-bold' : (ds.isWeak ? 'bg-rose-50 border-rose-300 text-rose-700' : 'bg-slate-50 border-slate-300 text-slate-700')}"
                                title="${ds.isKey ? 'Kunci Jawaban' : (ds.isWeak ? 'Pengecoh Kurang Berfungsi (<5%)' : 'Pengecoh Aktif')}">
                                ${ds.key}:${ds.pct}%
                              </span>
                            `).join('')}
                          </div>
                        ` : `<span class="text-[11px] text-slate-400 italic">Non-PG (Skor Kontinu)</span>`}
                      </td>
                      <td>
                        <div class="flex flex-wrap items-center gap-1.5">
                          <span class="px-2.5 py-0.5 rounded-md text-xs font-semibold whitespace-nowrap ${item.D < 0.20 ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}">
                            ${item.recommendation}
                          </span>
                          ${item.D < 0.20 ? `
                            <button type="button" onclick="openEditQuestionModal('${item.question.id}')"
                              class="px-2 py-0.5 rounded bg-amber-100 hover:bg-amber-200 text-amber-900 text-[11px] font-semibold whitespace-nowrap">
                              Revisi
                            </button>
                          ` : `
                            <button type="button" onclick="toggleQuestionValidated('${item.question.id}')"
                              class="px-2 py-0.5 rounded border text-[11px] font-semibold whitespace-nowrap ${item.question.validated ? 'bg-[#1E3A5F] text-white border-[#1E3A5F]' : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'}">
                              ${item.question.validated ? 'Tervalidasi' : 'Validasi'}
                            </button>
                          `}
                        </div>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // GURU: HASIL ASESMEN PER KELAS PER ASESMEN / UJIAN
    // =========================================================================
    function pxHasilContext() {
      const acc = getCurrentTeacherAccount();
      const pkgs = getTeacherPackages(acc);
      const pkg = pkgs.find(p => p.id === state.hasilPackageId) || getActiveTeacherPackage(acc) || pkgs[0];
      const classes = pxPkgScopeClasses(pkg);
      return { pkgs, pkg, classes };
    }

    function pxClassStats(pkg, className) {
      const list = state.students.filter(s => s.className === className);
      const rows = list.map(st => ({ st, res: pxPackageResult(st, pkg) }));
      const started = rows.filter(r => r.res);
      const done = started.filter(r => r.res.status === 'Selesai');
      const scores = done.map(r => r.res.finalScore);
      const passed = done.filter(r => r.res.passed).length;
      return {
        total: list.length,
        started: started.length,
        done: done.length,
        ongoing: started.filter(r => r.res.status === 'Sedang Mengerjakan').length,
        blocked: started.filter(r => r.res.status === 'Terblokir').length,
        notStarted: list.length - started.length,
        avg: scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null,
        max: scores.length ? Math.max(...scores) : null,
        min: scores.length ? Math.min(...scores) : null,
        passed,
        remedial: done.length - passed,
        ungraded: done.filter(r => r.res.hasUngradedEssay).length,
        rows
      };
    }

    function pxHasilSelectedClass(classes, pkg) {
      if (state.hasilClass === 'ALL' || (state.hasilClass && classes.includes(state.hasilClass))) return state.hasilClass;
      const firstWithData = classes.find(c => pxClassStats(pkg, c).started > 0);
      return firstWithData || classes[0] || 'ALL';
    }

    function renderGuruHasil() {

        total: a.total + c.total, done: a.done + c.done, started: a.started + c.started,
        blocked: a.blocked + c.blocked, notStarted: a.notStarted + c.notStarted,
        passed: a.passed + c.passed, remedial: a.remedial + c.remedial, ungraded: a.ungraded + c.ungraded
      }), { total: 0, done: 0, started: 0, blocked: 0, notStarted: 0, passed: 0, remedial: 0, ungraded: 0 });
      const allScores = statsByClass.flatMap(c => c.rows.filter(r => r.res && r.res.status === 'Selesai').map(r => r.res.finalScore));
      const overallAvg = allScores.length ? (allScores.reduce((a, b) => a + b, 0) / allScores.length).toFixed(1) : null;
      const fmt = v => v === null || v === undefined ? '<span class="text-slate-400">-</span>' : (Number.isInteger(v) ? v : v.toFixed(1));

    function exportHasilAsesmenXLS() {
      const { pkg, classes } = pxHasilContext();
      if (!pkg) return;
      const selClass = pxHasilSelectedClass(classes, pkg);
      const list = sortStudentsByName(state.students.filter(s => selClass === 'ALL' || s.className === selClass));
      const rows = [['No', 'NIS', 'NISN', 'Nama_Peserta', 'Kelas', 'Status', 'Durasi', 'Nilai_Awal', 'Nilai_Remedial', 'Nilai_Akhir', 'KKTP', 'Ketuntasan', 'Catatan']];
      list.forEach((st, i) => {
        const res = pxPackageResult(st, pkg);
        const fin = res && res.status === 'Selesai';
        rows.push([
          i + 1, st.nis, st.nisn, st.name, st.className,
          res ? res.status : 'Belum Mengerjakan',
          fin ? res.duration : '-',
          fin ? res.rawScore100 : '-',
          fin && res.remedialScore !== null && res.remedialScore !== undefined ? res.remedialScore : '-',
          fin ? res.finalScore : '-',
          Number(pkg.kktp || 61),
          fin ? (res.passed ? 'Tuntas' : 'Remedial') : '-',
          fin && res.hasUngradedEssay ? 'Esai belum dikoreksi' : ''
        ]);
      });
      const safe = s => String(s).replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
      const fname = `hasil_asesmen_${safe(selClass === 'ALL' ? 'semua_kelas' : selClass)}_${safe(pkg.id)}.xls`;
      downloadExcelXLS(fname, selClass === 'ALL' ? 'Semua_Kelas' : selClass, rows, [6, 14, 14, 28, 12, 20, 12, 11, 14, 11, 8, 13, 22]);
      showToast('Ekspor Hasil Asesmen Berhasil', `File ${fname} siap digunakan.`, 'success');
    }

    // =========================================================================
    // 7. VIEW RENDERER: PROKTOR & ADMIN STUDIO
    // =========================================================================
    // ===== ADMIN: BERANDA & LOG AUDIT =====
    function renderAdminBeranda() {
      const sts = state.students.filter(s => pxAllowed(s.room));
      const cnt = k => sts.filter(s => s.status === k).length;
      const pk = state.examPackages.map(p => ({ p, rd: getPackageReadiness(p) }));
      const notReady = pk.filter(x => !x.rd.ready || x.rd.linkedSchedules.length === 0);
      const viol = sts.filter(s => Number(s.violations || 0) > 0).sort((a, b) => b.violations - a.violations).slice(0, 8);
      const rooms = pxLabs();
      const go = (t, l) => `<button type="button" onclick="state.adminTab='${t}'; renderApp();" class="px-3 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-xs font-semibold text-[#1E3A5F]">${l}</button>`;
      return `
        <div class="space-y-4">
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            ${[['Peserta', sts.length, 'terdaftar'], ['Paket Ujian', pk.length, `${notReady.length} perlu perhatian`], ['Jadwal', state.schedules.length, 'sesi'], ['Belum Mengerjakan', cnt('Belum Mengerjakan'), 'peserta']].map(([l, v, s]) => `<div class="px-4 py-3 rounded-xl bg-slate-50 border border-slate-300"><div class="text-[11px] text-slate-500">${l}</div><div class="font-mono-code font-bold text-lg text-slate-900">${v}</div><div class="text-[10px] text-slate-500">${s}</div></div>`).join('')}
          </div>
          ${pxAdminBerandaCharts(sts)}
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="studio-card p-5 space-y-2 text-xs">
              <h2 class="font-bold text-sm text-slate-900">Peringatan Kesiapan</h2>
              ${notReady.length === 0 ? '<p class="text-emerald-700 font-semibold">Semua paket siap dan terjadwal.</p>' : notReady.map(({ p, rd }) => `<div class="p-2.5 rounded-lg bg-amber-50 border border-amber-200"><div class="font-semibold text-amber-900">${pxEsc(p.title)}</div><div class="text-amber-800">${rd.issues.concat(rd.linkedSchedules.length ? [] : ['Belum ada jadwal sesi']).map(pxEsc).join('; ')}</div></div>`).join('')}
              <div class="flex flex-wrap gap-2 pt-2">${go('banksoal', 'Paket &amp; Soal')}${go('jadwal', 'Jadwal &amp; Sesi')}${go('token', 'Token &amp; Ruang')}</div>
            </div>
            <div class="studio-card p-5 space-y-2 text-xs">
              <h2 class="font-bold text-sm text-slate-900">Ruang Laboratorium</h2>
              ${rooms.length === 0 ? '<p class="text-slate-500">Belum ada ruang.</p>' : rooms.map(r => { const rs = sts.filter(s => s.room === r); return `<div class="flex justify-between p-2 rounded-lg bg-slate-50 border border-slate-200"><span class="font-semibold">${pxEsc(r)}</span><span class="font-mono-code text-slate-600">${rs.filter(s => s.status === 'Sedang Mengerjakan').length} aktif &bull; ${rs.filter(s => s.status === 'Selesai').length} selesai &bull; ${rs.filter(s => s.status === 'Terblokir').length} blokir</span></div>`; }).join('')}
              ${go('monitoring', 'Buka Monitoring')}
            </div>
            <div class="studio-card p-5 space-y-2 text-xs">
              <h2 class="font-bold text-sm text-slate-900">Pelanggaran Terbanyak</h2>
              ${viol.length === 0 ? '<p class="text-slate-500">Belum ada pelanggaran tercatat.</p>' : viol.map(s => `<div class="flex justify-between p-2 rounded-lg bg-rose-50 border border-rose-100"><span>${pxEsc(s.name)} <span class="font-mono-code text-slate-500">${pxEsc(s.className)}</span></span><strong class="font-mono-code text-rose-700">${s.violations}x</strong></div>`).join('')}
            </div>
            <div class="studio-card p-5 space-y-2 text-xs">
              <h2 class="font-bold text-sm text-slate-900">Aktivitas Terakhir</h2>
              ${pxAuditScoped().slice(0, 5).map(l => `<div class="p-2 rounded-lg bg-slate-50 border border-slate-200"><div class="font-semibold">${pxEsc(l.action)}</div><div class="text-slate-600">${pxEsc(l.target)} &bull; ${pxEsc(l.actor)}</div></div>`).join('') || '<p class="text-slate-500">Belum ada aktivitas.</p>'}
              ${go('audit', 'Lihat Semua Log')}
            </div>
          </div>
        </div>`;
    }

    function pxAuditFiltered() {
      const f = state.auditFilter || (state.auditFilter = { q: '', actor: '' });
      const q = f.q.toLowerCase();
      return pxAuditScoped().filter(l => (!f.actor || l.actor === f.actor) && (!q || `${l.action} ${l.target} ${l.reason}`.toLowerCase().includes(q)));
    }

    function pxExportAuditCSV() {
      const esc = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
      const csv = ['Waktu,Aktor,Aksi,Target,Alasan'].concat(pxAuditFiltered().map(l => [new Date(l.ts).toLocaleString('id-ID'), l.actor, l.action, l.target, l.reason].map(esc).join(','))).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
      a.download = 'log_audit_cbt.csv'; a.click();
    }

    function renderAdminAudit() {
      const f = state.auditFilter || (state.auditFilter = { q: '', actor: '' });
      const rows = pxAuditFiltered();
      const actors = [...new Set(pxAuditScoped().map(l => l.actor))];
      return `
        <div class="studio-card overflow-hidden">
          <div class="p-4 border-b border-slate-200 flex flex-wrap items-center gap-2 text-xs">
            <input type="text" value="${pxEsc(f.q)}" placeholder="Cari aksi / target / alasan..." onchange="state.auditFilter.q=this.value; renderApp();" class="p-2 rounded-lg border border-slate-300 flex-1 min-w-[180px]">
            <select onchange="state.auditFilter.actor=this.value; renderApp();" class="p-2 rounded-lg border border-slate-300 bg-white font-semibold">
              <option value="">Semua Aktor</option>${actors.map(a => `<option value="${pxEsc(a)}" ${f.actor === a ? 'selected' : ''}>${pxEsc(a)}</option>`).join('')}
            </select>
            <button type="button" onclick="pxExportAuditCSV()" class="px-3 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 font-semibold">Ekspor CSV (${rows.length})</button>
          </div>
          ${pxAuditCharts(rows)}
          <div class="overflow-x-auto"><table class="cbt-table w-full text-xs"><thead><tr><th>Waktu</th><th>Aktor</th><th>Aksi</th><th>Target</th><th>Alasan</th></tr></thead><tbody>
            ${rows.length === 0 ? '<tr><td colspan="5" class="text-center text-slate-500 p-4">Tidak ada catatan.</td></tr>' : rows.map(l => `<tr><td class="font-mono-code whitespace-nowrap">${pxEsc(new Date(l.ts).toLocaleString('id-ID'))}</td><td>${pxEsc(l.actor)}</td><td class="font-semibold">${pxEsc(l.action)}</td><td>${pxEsc(l.target)}</td><td class="text-slate-600">${pxEsc(l.reason)}</td></tr>`).join('')}
          </tbody></table></div>
        </div>`;
    }

    function renderAdminSoalGabungan() {
      const sub = state.adminBankSub || 'paket';
      const chip = (k, l) => `<button type="button" onclick="state.adminBankSub='${k}'; renderApp();" class="${sub === k ? 'is-active' : ''}"><span>${l}</span></button>`;
      return `<div class="space-y-4"><div class="adm-subnav no-print">${chip('paket', 'Paket Ujian')}${chip('butir', 'Telaah Butir &amp; Topik')}${chip('ref', 'Referensi CP–ATP &amp; PPA')}</div>${sub === 'butir' ? renderAdminDataSoal() : (sub === 'ref' ? renderCpAtpRef('admin') : renderAdminBankSoalView())}</div>`;
    }

    // ===== ADMIN: REKAP HASIL + SUB-MENU REMEDIAL & PENGAYAAN =====
    function renderAdminHasilGabungan() {
      const sub = ['remedial', 'pengayaan'].includes(state.adminHasilSub) ? state.adminHasilSub : 'rekap';
      const chip = (k, l) => `<button type="button" onclick="state.adminHasilSub='${k}'; renderApp();" class="${sub === k ? 'is-active' : ''}"><span>${l}</span></button>`;
      return `<div class="space-y-4"><div class="adm-subnav no-print">${chip('rekap', 'Rekap Hasil')}${chip('remedial', 'Perlu Remedial')}${chip('pengayaan', 'Pengayaan')}</div>${sub === 'rekap' ? renderAdminHasil() : renderAdminRemedial(sub)}</div>`;
    }

    function renderAdminRemedial(part) {
      const { pkgs, pkg, students } = pxAdminHasilContext();
      if (!pkg) return '<div class="studio-card p-6 text-xs text-slate-500">Belum ada paket asesmen.</div>';
      const isLive = state.examConfig.activePackageId === pkg.id;
      const kktp = Number(pkg.kktp || 61);
      const rows = sortStudentsByName(students)
        .map(st => ({ st, res: pxPackageResult(st, pkg) }))
        .filter(x => x.res && x.res.status === 'Selesai' && !x.res.hasUngradedEssay);
      const rem = rows.filter(x => !x.res.passed).sort((a, b) => a.res.finalScore - b.res.finalScore);
      const enr = rows.filter(x => x.res.rawScore100 >= PX_ENR_MIN);
      const tbl = (list, withRem) => list.length === 0 ? '<p class="text-xs text-slate-500 p-4">Tidak ada peserta.</p>' : `
        <div class="overflow-x-auto"><table class="cbt-table w-full text-xs"><thead><tr><th>Peserta</th><th>Nilai</th>${withRem ? '<th>Topik Perlu Diperkuat</th><th>Remedial</th>' : '<th>Predikat</th>'}</tr></thead><tbody>
        ${list.map(({ st, res }) => {
          const remVal = res.remedialScore !== null && res.remedialScore !== undefined ? res.remedialScore : null;
          const ppa = getPPA2025CompetencyDescriptor(st, res.finalScore);
          return `<tr>
          <td><div class="font-semibold text-slate-900">${pxEsc(st.name)}</div><div class="text-[11px] font-mono-code text-slate-500">${pxEsc(st.className)}</div></td>
          <td class="font-mono-code font-bold">${res.finalScore}</td>
          ${withRem ? `<td class="text-slate-600">${pxWeakTopics(res.live ? st : { ...res }, pkg).map(pxEsc).join(', ') || '-'}</td>
            <td>${isLive
              ? `<button type="button" onclick="openRemedialModal('${st.id}')" class="px-2 py-0.5 rounded border border-slate-300 font-mono-code hover:bg-slate-50">${remVal !== null ? remVal : '+ Input'}</button>`
              : `<span class="font-mono-code">${remVal !== null ? remVal : '-'}</span>`}</td>`
          : `<td><span class="px-2 py-0.5 rounded-md font-semibold ${ppa.badgeCls}">${ppa.levelLabel}</span></td>`}
        </tr>`;
        }).join('')}</tbody></table></div>`;
      return `
        <div class="space-y-4">
          <div class="studio-card p-4 sm:p-5 no-print">
            <div class="flex flex-col gap-1 w-full sm:max-w-[420px]">
              <label class="text-[11px] font-semibold text-slate-700">Asesmen / Ujian</label>
              <select onchange="state.adminHasilPackageId=this.value; state.adminHasilClass=null; renderApp();" class="p-2 rounded-lg border border-slate-300 bg-white text-xs font-semibold text-[#1E3A5F]">
                ${pkgs.map(p => `<option value="${pxEsc(p.id)}" ${p.id === pkg.id ? 'selected' : ''}>${pxEsc(p.title)} — ${pxEsc(pxAdminOwnerName(p))}${state.examConfig.activePackageId === p.id ? ' (Aktif)' : ''}</option>`).join('')}
              </select>
            </div>
          </div>
          ${part !== 'pengayaan' ? `<div class="studio-card overflow-hidden">
            <div class="p-4 border-b border-slate-200"><h2 class="font-bold text-sm text-slate-900">Perlu Remedial (di bawah KKTP ${kktp})</h2>
            <p class="text-xs text-slate-500">Peserta dengan esai belum dikoreksi tidak ditampilkan agar tidak salah klasifikasi.</p></div>
            ${pxRemChart(rem.map(x => ({ name: x.st.name, score: x.res.finalScore, kktp })))}${tbl(rem, true)}
          </div>` : ''}
          ${part !== 'remedial' ? `<div class="studio-card overflow-hidden">
            <div class="p-4 border-b border-slate-200"><h2 class="font-bold text-sm text-slate-900">Kandidat Pengayaan (nilai awal ${PX_ENR_MIN}–100)</h2></div>
            ${tbl(enr, false)}
          </div>` : ''}
        </div>`;
    }

      const tabs = [
        { id: 'monitoring', label: 'Monitoring Lab / Ujian', icon: 'activity', group: 'Hari Pelaksanaan', priority: true, desc: 'Pantau peserta yang sedang ujian, kendalikan sesi, dan tangani pelanggaran secara langsung.' },
        { id: 'token', label: 'Token & Ruang', icon: 'key', group: 'Hari Pelaksanaan', priority: true, desc: 'Kelola token ujian dan penempatan ruang laboratorium.' },
        { id: 'beranda', label: 'Beranda', icon: 'layout-dashboard', group: 'Ringkasan', desc: 'Ringkasan kesiapan, ruang, pelanggaran, dan aktivitas terakhir.' },
        { id: 'users', label: 'Peserta & Guru', icon: 'users', group: 'Persiapan', desc: 'Data peserta didik dan akun guru mata pelajaran.' },

        { id: 'audit', label: 'Log Audit', icon: 'history', group: 'Sistem', desc: 'Riwayat tindakan proktor, admin, dan guru; dapat difilter dan diekspor.' },
        { id: 'settings', label: 'Pengaturan', icon: 'settings', group: 'Sistem', desc: 'Identitas sekolah, akun admin, kebijakan ujian, dan cadangan data.' }
      ];
      if (state.adminTab === 'datasoal') { state.adminTab = 'banksoal'; state.adminBankSub = 'butir'; }
      if (pxScope()) { const si = tabs.findIndex(t => t.id === 'settings'); if (si >= 0) tabs.splice(si, 1); if (state.adminTab === 'settings') state.adminTab = 'beranda'; }
      const groups = [...new Set(tabs.map(t => t.group))];
      const cur = tabs.find(t => t.id === state.adminTab) || tabs[0];

      const scopedStudents = state.students.filter(s => pxAllowed(s.room));
      const activeCount = scopedStudents.filter(s => s.status === 'Sedang Mengerjakan').length;
      const doneCount = scopedStudents.filter(s => s.status === 'Selesai').length;
      const blockedCount = scopedStudents.filter(s => s.status === 'Terblokir').length;
      const activeQuestions = getActiveExamQuestions();
      const go = id => `state.adminTab='${id}'; renderApp(); window.scrollTo({ top: 0, behavior: 'smooth' });`;
      const badge = t => (t.id === 'monitoring' && blockedCount > 0) ? `<span class="adm-nav-badge">${blockedCount}</span>` : '';

      const sidebar = `
        <aside class="hidden lg:block no-print">
          <nav class="adm-side" aria-label="Menu Admin">

              <div class="adm-group-label ${g === 'Hari Pelaksanaan' ? 'is-priority' : ''}">${g === 'Hari Pelaksanaan' ? '<i data-lucide="zap" class="w-3 h-3"></i>' : ''}${g}</div>
              ${tabs.filter(t => t.group === g).map(t => `
                <button type="button" onclick="${go(t.id)}" class="adm-nav-item ${t.priority ? 'is-priority' : ''} ${state.adminTab === t.id ? 'is-active' : ''}">
                  <span class="adm-ico"><i data-lucide="${t.icon}" class="w-4 h-4"></i></span>
                  <span class="truncate">${t.label}</span>
                  ${badge(t)}
                </button>
              `).join('')}
            `).join('')}
            <div class="adm-side-foot">
              <button type="button" onclick="syncAllSystemEntities(true)" class="adm-nav-item">
                <span class="adm-ico"><i data-lucide="refresh-cw" class="w-4 h-4"></i></span>
                <span class="min-w-0">
                  <span class="block truncate">Sinkronkan Data</span>
                  <span class="block text-[10px] font-normal opacity-70 font-mono-code">Terakhir ${pxEsc(state.lastSyncedAt)}</span>
                </span>
              </button>
            </div>
          </nav>
        </aside>
      `;

      const mobileNav = `
        <div class="lg:hidden adm-chip-nav no-print" role="tablist">
          ${tabs.map(t => `
            <button type="button" onclick="${go(t.id)}" class="${t.priority ? 'is-priority' : ''} ${state.adminTab === t.id ? 'is-active' : ''}">
              <i data-lucide="${t.icon}" class="w-3.5 h-3.5"></i><span>${t.label}</span>${badge(t)}
            </button>
          `).join('')}
        </div>
      `;

      return `
        <div class="space-y-4 animate-fade-in">
          <section class="adm-hero p-4 sm:p-5 no-print">
            <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-4 pl-2">
              <div class="space-y-1.5 min-w-0">
                <div class="flex flex-wrap items-center gap-2 text-[11px]">
                  <span class="px-2 py-0.5 rounded-md bg-[#1E3A5F] text-white font-mono-code font-bold tracking-wide whitespace-nowrap">ADMIN &amp; PROKTOR</span>
                  ${pxScope() ? `<span class="px-2 py-0.5 rounded-md bg-amber-50 text-amber-800 border border-amber-300 font-semibold">Akses terbatas: ${pxScope().map(pxEsc).join(', ')}</span>` : ''}
                  <span class="text-slate-500">TA ${pxEsc(state.schoolInfo.academicYear)} &bull; Semester ${pxEsc(state.schoolInfo.semester)}</span>
                  <button type="button" onclick="syncAllSystemEntities(true)" class="lg:hidden px-2 py-0.5 rounded-md bg-white border border-slate-300 text-slate-700 font-semibold inline-flex items-center gap-1">
                    <i data-lucide="refresh-cw" class="w-3 h-3 text-[#1E3A5F]"></i><span>Sinkron</span>
                  </button>
                </div>
                <h1 class="text-lg sm:text-xl font-bold tracking-tight text-slate-900 leading-snug">Pusat Kendali Ujian</h1>
                <p class="text-xs text-slate-600 leading-relaxed">
                  <span class="font-semibold text-slate-800">${pxEsc(state.examConfig.title)}</span><br class="sm:hidden">
                  <span class="hidden sm:inline"> &bull; </span>Pengampu: ${pxEsc(state.examConfig.teacher)}
                  &bull; ${activeQuestions.length}/${state.examConfig.targetQuestionCount || activeQuestions.length} soal &bull; ${state.examConfig.durationMinutes} menit
                </p>
              </div>
              <div class="grid grid-cols-3 gap-2.5 xl:w-[430px] shrink-0">

              ${state.adminTab === 'beranda' ? renderAdminBeranda() : ''}
              ${state.adminTab === 'audit' ? renderAdminAudit() : ''}
              ${state.adminTab === 'monitoring' ? renderAdminMonitoring() : ''}
              ${state.adminTab === 'token' ? renderAdminTokenRuang() : ''}
              ${state.adminTab === 'users' ? renderAdminUsers() : ''}
              ${state.adminTab === 'banksoal' ? renderAdminSoalGabungan() : ''}
              ${state.adminTab === 'jadwal' ? renderAdminJadwal() : ''}
              ${state.adminTab === 'hasil' ? renderAdminHasilGabungan() : ''}
              ${state.adminTab === 'dokumen' ? renderAdminCetakDokumen() : ''}
              ${state.adminTab === 'settings' ? renderAdminSettings() : ''}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // ADMIN: REKAP HASIL ASESMEN (semua paket, semua guru, semua kelas)
    // =========================================================================
    function pxAdminHasilContext() {
      const pkgs = state.examPackages.slice();
      const pkg = pkgs.find(p => p.id === state.adminHasilPackageId)
        || pkgs.find(p => p.id === state.examConfig.activePackageId)
        || pkgs[0];
      const students = state.students.filter(s => pxAllowed(s.room) && pxPkgAppliesToStudent(pkg, s));
      const classes = sortClassNames([...new Set(students.map(s => s.className))]);
      return { pkgs, pkg, students, classes };
    }

    function pxAdminOwnerName(p) {
      if (!p) return '-';
      if (p.ownerName) return p.ownerName;
      const a = state.staffAccounts.find(x => x.id === p.ownerId);
      return a ? a.name : '-';
    }

    function pxAdminClassStats(pkg, students, className) {
      const list = students.filter(s => s.className === className);
      const rows = list.map(st => ({ st, res: pxPackageResult(st, pkg) }));
      const started = rows.filter(r => r.res);
      const done = started.filter(r => r.res.status === 'Selesai');
      const scores = done.map(r => r.res.finalScore);
      const passed = done.filter(r => r.res.passed).length;
      return {
        total: list.length,
        started: started.length,
        done: done.length,
        ongoing: started.filter(r => r.res.status === 'Sedang Mengerjakan').length,
        blocked: started.filter(r => r.res.status === 'Terblokir').length,
        notStarted: list.length - started.length,
        avg: scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null,
        max: scores.length ? Math.max(...scores) : null,
        min: scores.length ? Math.min(...scores) : null,
        passed,
        remedial: done.length - passed,
        ungraded: done.filter(r => r.res.hasUngradedEssay).length,
        rows
      };
    }

    function pxAdminHasilSelectedClass(classes, pkg, students) {
      if (state.adminHasilClass === 'ALL' || (state.adminHasilClass && classes.includes(state.adminHasilClass))) return state.adminHasilClass;
      return 'ALL';
    }

    function pxAdminHasilDetailRows(pkg, students, selClass) {
      const q = String(state.adminHasilSearch || '').trim().toLowerCase();
      const f = state.adminHasilStatus || 'ALL';
      return sortStudentsByName(students.filter(s => selClass === 'ALL' || s.className === selClass))
        .map(st => ({ st, res: pxPackageResult(st, pkg) }))
        .filter(({ st, res }) => {
          if (q && !(String(st.name).toLowerCase().includes(q) || String(st.nis || '').toLowerCase().includes(q) || String(st.nisn || '').toLowerCase().includes(q))) return false;
          if (f === 'ALL') return true;
          if (f === 'BELUM') return !res;
          if (f === 'SELESAI') return !!res && res.status === 'Selesai';
          if (f === 'PROSES') return !!res && res.status === 'Sedang Mengerjakan';
          if (f === 'BLOKIR') return !!res && res.status === 'Terblokir';
          if (f === 'TUNTAS') return !!res && res.status === 'Selesai' && res.passed;
          if (f === 'REMEDIAL') return !!res && res.status === 'Selesai' && !res.passed;
          return true;
        });
    }

    function renderAdminHasil() {

      const sum = statsByClass.reduce((a, c) => ({
        total: a.total + c.total, done: a.done + c.done, started: a.started + c.started,
        ongoing: a.ongoing + c.ongoing, blocked: a.blocked + c.blocked, notStarted: a.notStarted + c.notStarted,
        passed: a.passed + c.passed, remedial: a.remedial + c.remedial, ungraded: a.ungraded + c.ungraded
      }), { total: 0, done: 0, started: 0, ongoing: 0, blocked: 0, notStarted: 0, passed: 0, remedial: 0, ungraded: 0 });
      const allScores = statsByClass.flatMap(c => c.rows.filter(r => r.res && r.res.status === 'Selesai').map(r => r.res.finalScore));
      const overallAvg = allScores.length ? (allScores.reduce((a, b) => a + b, 0) / allScores.length).toFixed(1) : null;
      const overallMax = allScores.length ? Math.max(...allScores) : null;
      const overallMin = allScores.length ? Math.min(...allScores) : null;
      const fmt = v => v === null || v === undefined ? '<span class="text-slate-400">-</span>' : (Number.isInteger(v) ? v : v.toFixed(1));

            </div>

          <div class="studio-card overflow-hidden">
            <div class="px-4 sm:px-5 py-3.5 bg-slate-50 border-b border-slate-300">

                    <th class="min-w-[120px]">Ketuntasan</th>

                <tbody class="divide-y divide-slate-200">
                  ${statsByClass.length === 0 ? `<tr><td colspan="10" class="p-6 text-center text-xs text-slate-500">Belum ada data peserta.</td></tr>` : statsByClass.map((c, ci) => {
                    const pct = c.done > 0 ? Math.round((c.passed / c.done) * 100) : 0;

                </select>
                <input type="search" value="${pxEsc(state.adminHasilSearch || '')}" placeholder="Cari nama / NIS…"

                <span class="text-slate-500">${detailRows.length} peserta</span>

                  <span>Ekspor Excel (.xls)</span>
                </button>

            <div class="px-4 sm:px-5 py-3 border-b border-slate-200 text-xs text-slate-700 hidden print:block">
              <strong>${pxEsc(pkg.title)}</strong> &bull; ${pxEsc(pxAdminOwnerName(pkg))} &bull; ${selClass === 'ALL' ? 'Semua Kelas' : pxEsc(selClass)} &bull; KKTP ${kktp}

    function exportAdminHasilXLS() {
      const { pkg, students, classes } = pxAdminHasilContext();
      if (!pkg) return;
      const selClass = pxAdminHasilSelectedClass(classes, pkg, students);
      const list = pxAdminHasilDetailRows(pkg, students, selClass);
      const kktp = Number(pkg.kktp || 61);
      const rows = [['No', 'NIS', 'NISN', 'Nama_Peserta', 'Kelas', 'Ruang', 'Status', 'Durasi', 'Nilai_Awal', 'Nilai_Remedial', 'Nilai_Akhir', 'KKTP', 'Ketuntasan', 'Catatan']];
      list.forEach(({ st, res }, i) => {
        const fin = res && res.status === 'Selesai';
        rows.push([
          i + 1, st.nis, st.nisn, st.name, st.className, st.room || '-',
          res ? res.status : 'Belum Mengerjakan',
          fin ? res.duration : '-',
          fin ? res.rawScore100 : '-',
          fin && res.remedialScore !== null && res.remedialScore !== undefined ? res.remedialScore : '-',
          fin ? res.finalScore : '-',
          kktp,
          fin ? (res.passed ? 'Tuntas' : 'Remedial') : '-',
          fin && res.hasUngradedEssay ? 'Esai belum dikoreksi' : ''
        ]);
      });
      const clsRows = [['Kelas', 'Siswa', 'Selesai', 'Belum', 'Rata_rata', 'Tertinggi', 'Terendah', 'Tuntas', 'Remedial']];
      classes.forEach(c => {
        const x = pxAdminClassStats(pkg, students, c);
        clsRows.push([c, x.total, x.done, x.notStarted, x.avg === null ? '-' : Number(x.avg.toFixed(1)), x.max ?? '-', x.min ?? '-', x.done ? x.passed : '-', x.done ? x.remedial : '-']);
      });
      const safe = s => String(s).replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
      const fname = `rekap_hasil_${safe(selClass === 'ALL' ? 'semua_kelas' : selClass)}_${safe(pkg.id)}.xls`;

      showToast('Ekspor Rekap Hasil Berhasil', `File ${fname} siap digunakan.`, 'success');
    }

      const filteredStudents = [...baseFilteredStudents].sort((a, b) => {
        if (sortMode === 'name_desc') {
          return String(b.name || '').localeCompare(String(a.name || ''), 'id', { sensitivity: 'base' });

        if (sortMode === 'class_name') {
          return String(a.className || '').localeCompare(String(b.className || ''), 'id', { numeric: true, sensitivity: 'base' }) ||
            String(a.name || '').localeCompare(String(b.name || ''), 'id', { sensitivity: 'base' });

              <div>
                <h3 class="font-bold text-sm sm:text-base text-slate-900">Daftar Butir Soal Tersimpan (${displayedQuestions.length} Butir)</h3>

              <select onchange="state.adminBankTeacherFilter=this.value; renderApp();" class="p-2 rounded-lg border border-slate-300 bg-white text-xs font-semibold">
                <option value="ALL">Semua Guru Mapel</option>
                ${teachers.map(t => `<option value="${t.id}" ${filterOwner === t.id ? 'selected' : ''}>${pxEsc(t.name)} (${pxEsc(t.subject)})</option>`).join('')}

                      <td class="font-mono-code font-bold whitespace-nowrap">${pxEsc(q.id)}</td>
                      <td>
                        <div class="font-semibold text-slate-900">${pxEsc(q.ownerName || state.examConfig.teacher)}</div>
                        <div class="text-[11px] text-slate-500">${pxEsc(q.subject || state.examConfig.subject)}</div>

                      <td>

    // =========================================================================
    // ADMIN: DATA SOAL GURU (lihat, edit, nonaktifkan/aktifkan, hapus)
    // =========================================================================
    function adminSoalCanManage() { return !pxScope(); }

    function adminSoalFiltered() {
      const f = state.adminSoalFilter;
      const q = String(f.search || '').trim().toLowerCase();
      return state.questions.filter(item => {
        if (f.teacher !== 'ALL' && item.ownerId !== f.teacher) return false;
        if (f.pkg !== 'ALL' && item.packageId !== f.pkg) return false;
        if (f.topic !== 'ALL' && (item.topic || '') !== f.topic) return false;
        if (f.type !== 'ALL' && item.type !== f.type) return false;
        if (f.status === 'AKTIF' && !item.included) return false;
        if (f.status === 'NONAKTIF' && item.included) return false;
        if (q) {
          const hay = [item.id, item.topic, item.cp, item.atp, item.typeLabel, item.ownerName, stripHtmlTags(item.formattedPrompt)].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function adminSoalSetFilter(key, val) {
      state.adminSoalFilter[key] = val;
      if (key === 'teacher') state.adminSoalFilter.pkg = 'ALL';
      renderApp();
    }

    function adminSoalReset() {
      state.adminSoalFilter = { teacher: 'ALL', pkg: 'ALL', topic: 'ALL', type: 'ALL', status: 'ALL', search: '' };
      state.adminSoalSel = [];
      renderApp();
    }

    function adminSoalToggleSel(id) {
      const i = state.adminSoalSel.indexOf(id);
      if (i >= 0) state.adminSoalSel.splice(i, 1); else state.adminSoalSel.push(id);
      renderApp();
    }

    function adminSoalSelAll(checked) {
      state.adminSoalSel = checked ? adminSoalFiltered().map(q => q.id) : [];
      renderApp();
    }

    function adminSoalSetActive(ids, active) {
      if (!adminSoalCanManage()) return;
      const touchedPkgs = new Set();
      let n = 0;
      ids.forEach(id => {
        const q = state.questions.find(item => item.id === id);
        if (!q) return;
        q.included = active;
        q.adminDisabled = !active;
        if (q.packageId) touchedPkgs.add(q.packageId);
        n++;
      });
      touchedPkgs.forEach(pid => {
        const pkg = state.examPackages.find(pk => pk.id === pid);
        if (pkg) syncPackageAcrossSystem(pkg, { activateForStudents: false, silent: true });
      });
      pxLog(active ? 'Aktifkan Butir Soal (Admin)' : 'Nonaktifkan Butir Soal (Admin)', `${n} butir soal`, ids.slice(0, 5).join(', ') + (ids.length > 5 ? ', ...' : ''), null);
      pxSaveImmediate();
      renderApp();
      const liveTouched = touchedPkgs.has(state.examConfig.activePackageId) && state.students.some(hasExamData);
      showToast(active ? 'Soal Diaktifkan' : 'Soal Dinonaktifkan',
        `${n} butir soal ${active ? 'diaktifkan kembali dan' : 'dinonaktifkan:'} ${active ? 'masuk' : 'tidak lagi masuk'} paket ujian siswa.${liveTouched ? ' Paket sedang berjalan, skor peserta dapat berubah.' : ''}`,
        liveTouched ? 'warning' : 'success');
    }

    function adminSoalToggleOne(qId) {
      const q = state.questions.find(item => item.id === qId);
      if (q) adminSoalSetActive([qId], !q.included);
    }

    function adminSoalBulkDeleteConfirm(label) {
      if (!adminSoalCanManage()) return;
      const ids = state.adminSoalSel.filter(id => state.questions.some(q => q.id === id));
      if (ids.length === 0) return;
      const liveWarn = ids.some(id => { const q = state.questions.find(x => x.id === id); return q && q.packageId === state.examConfig.activePackageId; }) && state.students.some(hasExamData);
      openModal(`
        <div class="p-6 space-y-4">
          <h3 class="font-bold text-base text-slate-900">Hapus ${ids.length} Butir Soal ${label ? '(' + pxEsc(label) + ')' : 'Terpilih'}?</h3>
          <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">Butir soal yang dipilih akan dihapus dari bank soal guru dan paket ujian. Tindakan ini tidak dapat dibatalkan.</p>
          ${liveWarn ? `<p class="text-xs p-2.5 rounded-lg bg-amber-50 border border-amber-300 text-amber-900 leading-relaxed"><strong>Perhatian:</strong> sebagian soal berada di paket yang sedang berjalan dan sudah ada peserta yang mengerjakan. Skor peserta dapat berubah.</p>` : ''}
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-semibold">Batal</button>
            <button type="button" onclick="adminSoalBulkDeleteExec()" class="px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold">Ya, Hapus ${ids.length} Soal</button>
          </div>
        </div>
      `);
    }

    function adminSoalBulkDeleteExec() {
      if (!adminSoalCanManage()) return;
      const ids = new Set(state.adminSoalSel);
      const pkgIds = new Set(state.questions.filter(q => ids.has(q.id) && q.packageId).map(q => q.packageId));
      const before = state.questions.length;
      state.questions = state.questions.filter(q => !ids.has(q.id));
      const n = before - state.questions.length;
      pkgIds.forEach(pid => {
        const pkg = state.examPackages.find(pk => pk.id === pid);
        if (pkg) syncPackageAcrossSystem(pkg, { activateForStudents: false, silent: true });
      });
      state.adminSoalSel = [];
      pxLog('Hapus Butir Soal (Admin)', `${n} butir soal`, 'Dihapus massal dari menu Data Soal Guru', null);
      closeModal();
      pxSaveImmediate();
      renderApp();
      showToast('Soal Dihapus', `${n} butir soal telah dihapus dari bank soal.`, 'info');
    }

    // ---- Tampilan Per Topik & Per Paket (Data Soal Guru) ----
    function adminSoalSetView(v) {
      state.adminSoalView = v;
      state.adminSoalSel = [];
      renderApp();
    }

    function adminPkgVisible(pk) {
      const t = state.adminSoalFilter.teacher;
      return t === 'ALL' || pk.ownerId === t || (Array.isArray(pk.sharedWith) && pk.sharedWith.includes(t));
    }

    function adminTopikGroups() {
      const f = state.adminSoalFilter;
      const s = String(f.search || '').trim().toLowerCase();
      const map = new Map();
      state.questions.forEach(q => {
        if (f.teacher !== 'ALL' && q.ownerId !== f.teacher) return;
        if (f.pkg !== 'ALL' && q.packageId !== f.pkg) return;
        const topic = q.topic || '(Tanpa Topik)';
        if (s && !(topic + ' ' + (q.ownerName || '')).toLowerCase().includes(s)) return;
        const key = (q.packageId || '-') + '||' + topic;
        if (!map.has(key)) map.set(key, { packageId: q.packageId, topic, rawTopic: q.topic || '', ownerName: q.ownerName || '-', ownerId: q.ownerId, items: [] });
        map.get(key).items.push(q);
      });
      return [...map.values()].sort((a, b) => (a.ownerName + a.topic).localeCompare(b.ownerName + b.topic, 'id', { sensitivity: 'base' }));
    }

    function adminTopikAct(act, i, arg) {
      if (!adminSoalCanManage() && act !== 'view') return;
      const g = adminTopikGroups()[i];
      if (!g) return;
      const ids = g.items.map(q => q.id);
      if (act === 'view') {
        state.adminSoalFilter.pkg = g.packageId || 'ALL';
        state.adminSoalFilter.topic = g.rawTopic || 'ALL';
        state.adminSoalView = 'soal';
        renderApp();
      } else if (act === 'on') {
        adminSoalSetActive(ids, true);
      } else if (act === 'off') {
        adminSoalSetActive(ids, false);
      } else if (act === 'del') {
        state.adminSoalSel = ids;
        adminSoalBulkDeleteConfirm('Topik: ' + g.topic);
      } else if (act === 'edit') {
        openModal(`
          <form onsubmit="adminTopikSave(event, ${i})" class="p-6 space-y-4 text-xs sm:text-sm">
            <h3 class="font-bold text-base text-slate-900">Edit Topik</h3>
            <p class="text-slate-600 leading-relaxed">Nama topik akan diubah pada <strong>${ids.length} butir soal</strong> milik ${pxEsc(g.ownerName)}.</p>
            <input type="text" id="topik-edit-name" required value="${pxEsc(g.rawTopic)}" class="w-full p-2.5 rounded-lg border border-slate-300 font-semibold">
            <div class="flex justify-end gap-2 pt-1">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-semibold">Batal</button>
              <button type="submit" class="px-4 py-2 rounded-lg btn-sapphire text-xs font-semibold">Simpan Topik</button>
            </div>
          </form>`);
      }
    }

    function adminTopikSave(e, i) {
      e.preventDefault();
      if (!adminSoalCanManage()) return;
      const g = adminTopikGroups()[i];
      const name = document.getElementById('topik-edit-name').value.trim();
      if (!g || !name) return;
      g.items.forEach(q => { q.topic = name; q.tp = q.atp || name; });
      const pkg = state.examPackages.find(p => p.id === g.packageId);
      if (pkg) syncPackageAcrossSystem(pkg, { activateForStudents: false, silent: true });
      pxLog('Edit Topik Soal (Admin)', `${g.items.length} butir soal`, `${g.rawTopic || '-'} -> ${name}`, null);
      closeModal();
      pxSaveImmediate();
      renderApp();
      showToast('Topik Diperbarui', `${g.items.length} butir soal kini bertopik "${name}".`, 'success');
    }

    function adminPaketAct(act, pkgId) {
      const pkg = state.examPackages.find(p => p.id === pkgId);
      if (!pkg) return;
      if (act === 'view') {
        state.adminSoalFilter.pkg = pkg.id;
        state.adminSoalFilter.topic = 'ALL';
        state.adminSoalView = 'soal';
        renderApp();
        return;
      }
      if (!adminSoalCanManage()) return;
      const ids = state.questions.filter(q => q.packageId === pkg.id).map(q => q.id);
      if (act === 'on') adminSoalSetActive(ids, true);
      else if (act === 'off') adminSoalSetActive(ids, false);
      else if (act === 'edit') {
        openModal(`
          <form onsubmit="adminPaketSave(event, '${pxEsc(pkg.id)}')" class="p-6 space-y-3 text-xs sm:text-sm">
            <h3 class="font-bold text-base text-slate-900">Edit Paket Ujian</h3>
            <label class="block space-y-1"><span class="font-semibold text-slate-700">Judul Paket</span>
              <input type="text" id="pk-title" required value="${pxEsc(pkg.title)}" class="w-full p-2.5 rounded-lg border border-slate-300"></label>
            <label class="block space-y-1"><span class="font-semibold text-slate-700">Topik Paket</span>
              <input type="text" id="pk-topic" value="${pxEsc(pkg.topic || '')}" class="w-full p-2.5 rounded-lg border border-slate-300"></label>
            <div class="grid grid-cols-3 gap-2">
              <label class="block space-y-1"><span class="font-semibold text-slate-700">Durasi (menit)</span>
                <input type="number" id="pk-dur" min="5" required value="${Number(pkg.durationMinutes || 60)}" class="w-full p-2.5 rounded-lg border border-slate-300 font-mono-code"></label>
              <label class="block space-y-1"><span class="font-semibold text-slate-700">KKTP</span>
                <input type="number" id="pk-kktp" min="0" max="100" required value="${Number(pkg.kktp || 61)}" class="w-full p-2.5 rounded-lg border border-slate-300 font-mono-code"></label>
              <label class="block space-y-1"><span class="font-semibold text-slate-700">Target Soal</span>
                <input type="number" id="pk-target" min="1" required value="${Number(pkg.targetQuestionCount || 10)}" class="w-full p-2.5 rounded-lg border border-slate-300 font-mono-code"></label>
            </div>
            <div class="flex justify-end gap-2 pt-1">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-semibold">Batal</button>
              <button type="submit" class="px-4 py-2 rounded-lg btn-sapphire text-xs font-semibold">Simpan Paket</button>
            </div>
          </form>`);
      } else if (act === 'del') {
        const linked = state.schedules.filter(s => s.packageId === pkg.id).length;
        const siblings = state.examPackages.filter(p => p.ownerId === pkg.ownerId).length;
        let block = '';
        if (state.examConfig.activePackageId === pkg.id) block = 'Paket ini sedang aktif di sesi siswa. Aktifkan paket lain dulu.';
        else if (linked > 0) block = `Paket ini terhubung ke ${linked} jadwal sesi. Hapus atau ganti paket pada jadwal tersebut terlebih dahulu.`;
        else if (siblings <= 1) block = 'Ini satu-satunya paket milik guru tersebut, sehingga tidak dapat dihapus.';
        openModal(`
          <div class="p-6 space-y-4">
            <h3 class="font-bold text-base text-slate-900">${block ? 'Paket Tidak Dapat Dihapus' : 'Hapus Paket Ujian?'}</h3>
            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed"><strong>${pxEsc(pkg.title)}</strong><br>${block ? pxEsc(block) : `Paket beserta ${ids.length} butir soalnya akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.`}</p>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-semibold">${block ? 'Tutup' : 'Batal'}</button>
              ${block ? '' : `<button type="button" onclick="adminPaketDeleteExec('${pxEsc(pkg.id)}')" class="px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold">Ya, Hapus Paket</button>`}
            </div>
          </div>`);
      }
    }

    function adminPaketSave(e, pkgId) {
      e.preventDefault();
      if (!adminSoalCanManage()) return;
      const pkg = state.examPackages.find(p => p.id === pkgId);
      if (!pkg) return;
      pkg.title = document.getElementById('pk-title').value.trim() || pkg.title;
      pkg.topic = document.getElementById('pk-topic').value.trim();
      pkg.durationMinutes = Math.max(5, Number(document.getElementById('pk-dur').value) || pkg.durationMinutes);
      pkg.kktp = Math.min(100, Math.max(0, Number(document.getElementById('pk-kktp').value) || 0));
      pkg.targetQuestionCount = Math.max(1, Number(document.getElementById('pk-target').value) || 1);
      syncPackageAcrossSystem(pkg, { activateForStudents: false, silent: true });
      pxLog('Edit Paket Ujian (Admin)', pkg.title, `Durasi ${pkg.durationMinutes}m, KKTP ${pkg.kktp}, target ${pkg.targetQuestionCount}`, null);
      closeModal();
      pxSaveImmediate();
      renderApp();
      showToast('Paket Diperbarui', 'Perubahan paket tersinkron ke jadwal dan sesi siswa.', 'success');
    }

    function adminPaketDeleteExec(pkgId) {
      if (!adminSoalCanManage()) return;
      const pkg = state.examPackages.find(p => p.id === pkgId);
      if (!pkg || state.examConfig.activePackageId === pkgId || state.schedules.some(s => s.packageId === pkgId)) return;
      const n = state.questions.filter(q => q.packageId === pkgId).length;
      state.questions = state.questions.filter(q => q.packageId !== pkgId);
      state.examPackages = state.examPackages.filter(p => p.id !== pkgId);
      if (state.selectedTeacherPackageId === pkgId) state.selectedTeacherPackageId = null;
      if (state.hasilPackageId === pkgId) state.hasilPackageId = null;
      if (state.adminHasilPackageId === pkgId) state.adminHasilPackageId = null;
      if (state.adminSoalFilter.pkg === pkgId) state.adminSoalFilter.pkg = 'ALL';
      state.adminSoalSel = [];
      pxLog('Hapus Paket Ujian (Admin)', pkg.title, `${n} butir soal ikut dihapus`, null);
      closeModal();
      pxSaveImmediate();
      renderApp();
      showToast('Paket Dihapus', `Paket dan ${n} butir soalnya telah dihapus.`, 'info');
    }
