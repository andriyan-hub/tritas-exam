                  <label class="text-xs font-semibold text-slate-700">Batas Maksimal Pelanggaran Layar</label>
                  <div class="w-full p-2.5 rounded-lg border border-slate-300 bg-slate-50 font-mono-code font-bold text-rose-700">${state.examConfig.maxViolations || 3}x</div>
                  <p class="text-[11px] text-slate-500">Jika tercapai, akun siswa otomatis dikunci dan butuh Reset Login Proktor. Nilai ini diatur guru pada pengaturan paket.</p>
                </div>
                <div class="p-4 rounded-xl bg-slate-50 border border-slate-300 space-y-2 text-xs text-slate-700">
                  <div class="font-bold text-slate-900">Proteksi Aktif pada Client Peserta Didik:</div>
                  <div>&bull; Deteksi perpindahan tab / kehilangan fokus jendela (<code>visibilitychange</code>) otomatis tercatat.</div>
                  <div>&bull; Pemblokiran klik kanan (<code>contextmenu</code>) dan penyalinan soal selama sesi ujian berlangsung.</div>
                  <div>&bull; Penyimpanan otomatis (<em>auto-checkpoint</em>) posisi soal terakhir dan jawaban setiap perubahan.</div>
                </div>
              </div>
            ` : ''}

            ${sec === 'ruang' ? `
              <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 pb-3">
                <div>
                  <h2 class="font-bold text-base text-slate-900">Daftar Ruang Laboratorium &amp; Workstation</h2>
                  <p class="text-xs text-slate-500">Kelola lokasi pelaksanaan ujian, kapasitas komputer, dan proktor penanggung jawab.</p>
                </div>
                <button type="button" onclick="openRoomModal()" class="px-3.5 py-2 rounded-lg btn-sapphire text-xs font-semibold whitespace-nowrap">+ Tambah Ruang</button>
              </div>
              <div class="space-y-2.5">
                ${state.rooms.map(rm => {
                  const assignedCount = state.students.filter(s => s.room === rm.name).length;
                  return `
                    <div class="p-4 rounded-xl border border-slate-300 bg-slate-50/70 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div class="space-y-1">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="font-bold text-slate-900">${pxEsc(rm.name)}</span>
                          <span class="px-2 py-0.5 rounded bg-white border border-slate-300 font-mono-code text-[11px]">Terisi: ${assignedCount}/${rm.capacity} PC</span>
                        </div>
                        <div class="text-xs text-slate-600">Proktor: <strong>${pxEsc(rm.proctor)}</strong> &bull; ${pxEsc(rm.type)}</div>
                      </div>
                      <div class="flex items-center gap-1.5 text-xs shrink-0">
                        <button type="button" onclick="openRoomModal('${rm.id}')" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 font-semibold whitespace-nowrap">Edit</button>
                        ${state.rooms.length > 1 ? `<button type="button" onclick="deleteRoomItem('${rm.id}')" class="px-2.5 py-1.5 rounded-lg bg-rose-50 text-rose-700 border border-rose-200 font-semibold hover:bg-rose-100 whitespace-nowrap">Hapus</button>` : ''}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}

            ${sec === 'database' ? `
              <div class="border-b border-slate-200 pb-3">
                <h2 class="font-bold text-base text-slate-900">Cadangan (Backup), Pemulihan (Restore) &amp; Pemeliharaan Sistem</h2>
                <p class="text-xs text-slate-500">Unduh seluruh data ujian (peserta, paket soal guru, jadwal, nilai, dan konfigurasi) dalam format JSON.</p>
              </div>
              <div class="space-y-4">
                <div class="p-4 rounded-xl bg-slate-50 border border-slate-300 flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <div class="font-bold text-slate-900 text-xs sm:text-sm">Unduh Cadangan Lengkap Database (.json)</div>
                    <div class="text-xs text-slate-500">Cadangan terakhir: <strong class="font-mono-code">${state.lastBackupAt ? pxEsc(state.lastBackupAt) : 'Belum pernah dicadangkan sesi ini'}</strong></div>
                  </div>
                  <button type="button" onclick="exportFullBackupJSON()" class="px-4 py-2 rounded-lg btn-sapphire text-xs font-semibold inline-flex items-center gap-1.5 whitespace-nowrap">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                    <span>Unduh Backup JSON</span>
                  </button>
                </div>

                <div class="p-4 rounded-xl bg-slate-50 border border-slate-300 flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <div class="font-bold text-slate-900 text-xs sm:text-sm">Pulihkan Database dari File Cadangan (.json)</div>
                    <div class="text-xs text-slate-500">Mengganti seluruh data saat ini dengan isi berkas cadangan yang dipilih.</div>
                  </div>
                  <label class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 text-slate-800 text-xs font-semibold inline-flex items-center gap-1.5 cursor-pointer whitespace-nowrap">
                    <i data-lucide="upload" class="w-3.5 h-3.5 text-[#1E3A5F]"></i>
                    <span>Pilih File JSON</span>
                    <input type="file" accept=".json,application/json" onchange="importFullBackupJSON(event)" class="hidden">
                  </label>
                </div>

                ${pxAutoBackupPanel()}

                <div class="p-4 rounded-xl bg-rose-50/70 border border-rose-200 flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <div class="font-bold text-rose-900 text-xs sm:text-sm">Reset Pabrik ke Data Awal (SMAN 3 Tasikmalaya)</div>
                    <div class="text-xs text-rose-700">Menghapus perubahan lokal di browser dan mengembalikan data bawaan sistem.</div>
                  </div>
                  <button type="button" onclick="confirmFactoryReset()" class="px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold whitespace-nowrap">
                    Reset Data Awal
                  </button>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 8. CONTROLLERS, TIMERS, ANTI-CHEAT & KEYBOARD SHORTCUTS
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('app-root');
      const authControls = document.getElementById('auth-user-controls');
      const examTelemetry = document.getElementById('header-exam-telemetry');
      const progressTrack = document.getElementById('header-progress-track');
      const progressFill = document.getElementById('header-progress-fill');
      const isExamActive = state.authSession.isAuthenticated && state.currentRole === 'siswa' && state.studentSession.step === 'exam';

      document.body.classList.toggle('exam-mode', isExamActive);
      if (progressTrack) progressTrack.classList.toggle('hidden', !isExamActive);

      if (examTelemetry) {
        if (isExamActive) {
          const ss = state.studentSession;
          const orderedQ = getOrderedQuestionsForStudent();
          const answered = orderedQ.filter(q => pxHas(ss.answers[q.id])).length;
          const pct = Math.round((answered / Math.max(1, orderedQ.length)) * 100);
          if (progressFill) progressFill.style.width = `${pct}%`;

          const isCritical = ss.remainingSeconds <= 300;
          examTelemetry.className = 'hidden md:flex items-center gap-2 shrink-0';
          examTelemetry.innerHTML = `
            <div class="flex items-center gap-0.5 rounded-lg border border-slate-300 bg-slate-50 p-0.5 text-[11px] font-semibold">
              <button type="button" onclick="state.studentSession.fontSize='sm'; renderApp();" class="px-2 py-1 rounded ${ss.fontSize === 'sm' ? 'bg-[#1E3A5F] text-white' : 'text-slate-600'}">A-</button>
              <button type="button" onclick="state.studentSession.fontSize='base'; renderApp();" class="px-2 py-1 rounded ${ss.fontSize === 'base' ? 'bg-[#1E3A5F] text-white' : 'text-slate-600'}">A</button>
              <button type="button" onclick="state.studentSession.fontSize='lg'; renderApp();" class="px-2 py-1 rounded ${ss.fontSize === 'lg' ? 'bg-[#1E3A5F] text-white' : 'text-slate-600'}">A+</button>
            </div>
            <div class="px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-300 text-xs font-mono-code font-semibold text-slate-700 whitespace-nowrap">
              ${answered}/${orderedQ.length} (${pct}%)
            </div>
            <div id="exam-timer-badge" class="px-3 py-1.5 rounded-lg ${isCritical ? 'bg-rose-700' : 'bg-[#1E3A5F]'} text-white font-mono-code font-bold text-xs flex items-center gap-1.5 whitespace-nowrap">
              <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-200"></i>
              <span>${pxFmt(ss.remainingSeconds)}</span>
            </div>
          `;
        } else {
          examTelemetry.className = 'hidden';
          examTelemetry.innerHTML = '';
        }
      }

      if (authControls) {
        if (!state.authSession.isAuthenticated) {
          authControls.innerHTML = '';
        } else {
          const u = state.authSession.user;
          const roleTag = state.currentRole === 'siswa' ? 'SISWA' : (state.currentRole === 'guru' ? 'GURU MAPEL' : 'PROKTOR / ADMIN');
          authControls.innerHTML = `
            <div class="hidden sm:flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-300 text-xs max-w-[230px]">
              <span class="px-1.5 py-0.5 rounded bg-[#1E3A5F] text-white font-mono-code font-bold text-[10px] shrink-0">${roleTag}</span>
              <span class="font-semibold text-slate-800 truncate">${pxEsc(u.name)}</span>
            </div>
            <button type="button" onclick="logoutSession()" class="hide-exam inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-rose-50 hover:text-rose-700 hover:border-rose-300 text-slate-700 text-xs font-semibold transition whitespace-nowrap" title="Keluar dari Sesi">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
              <span class="hidden sm:inline">Keluar</span>
            </button>
          `;
        }
      }

      if (!state.authSession.isAuthenticated) root.innerHTML = renderLoginScreen();
      else if (state.currentRole === 'siswa') root.innerHTML = renderSiswaView();
      else if (state.currentRole === 'guru') root.innerHTML = renderGuruView();
      else root.innerHTML = renderAdminView();

      if (window.lucide) lucide.createIcons();
      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([root]).catch(() => {});
      }
      pxSave();
    }

    function selectLoginTab(tab) {
      state.authSession.loginTab = tab;
      renderApp();
    }

    function handleAuthLogin(e) {
      e.preventDefault();
      const tab = state.authSession.loginTab;
      const username = (document.getElementById('login-username')?.value || '').trim();
      const password = (document.getElementById('login-password')?.value || '').trim();

      if (tab === 'siswa') {
        const student = state.students.find(s => String(s.nis).trim() === username);
        if (!student || String(student.password).trim() !== password) {
          showToast('Autentikasi Gagal', 'NIS atau password peserta didik tidak sesuai.', 'danger');
          return;
        }
        state.authSession.isAuthenticated = true;
        state.currentRole = 'siswa';
        state.authSession.user = { id: student.id, name: student.name, username: student.nis };
        state.studentSession.studentId = student.id;
        state.studentSession.answers = { ...(student.answers || {}) };
        state.studentSession.flagged = { ...(student.savedFlagged || {}) };
        state.studentSession.currentQuestionIndex = student.lastQuestionIndex || 0;
        state.studentSession.violations = student.violations || 0;
        state.studentSession.remainingSeconds = (student.savedRemainingSeconds !== null && student.savedRemainingSeconds !== undefined)
          ? student.savedRemainingSeconds
          : (state.examConfig.durationMinutes * 60);
        state.studentSession.step = 'portal';
        state.studentSession.portalTab = 'jadwal';
        renderApp();
        showToast('Login Berhasil', `Selamat datang, ${student.name}.`, 'success');
        return;
      }

      const cleanUser = username.replace(/\s+/g, '');
      const staff = state.staffAccounts.find(acc => acc.role === tab && (
        acc.username === username ||
        acc.altUsername === username ||
        (acc.nip && acc.nip.replace(/\s+/g, '') === cleanUser)
      ));
      if (!staff || staff.password !== password) {
        showToast('Autentikasi Gagal', 'NIP/Username atau kata sandi tidak valid.', 'danger');
        return;
      }

      state.authSession.isAuthenticated = true;
      state.currentRole = tab;
      state.authSession.user = { id: staff.id, name: staff.name, username: staff.username };
      if (tab === 'guru') {
        const pkgs = getTeacherPackages(staff);
        if (pkgs.length > 0) state.selectedTeacherPackageId = pkgs[0].id;
      }
      renderApp();
      showToast('Login Berhasil', `Selamat datang, ${staff.name}.`, 'success');
    }

    function logoutSession() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      state.authSession.isAuthenticated = false;
      state.authSession.user = null;
      state.studentSession.schedId = null;
      state.studentSession.tokenDraft = '';
      state.studentSession.step = 'portal';
      renderApp();
    }

    function startStudentExam() {
      const tokenVal = (document.getElementById('exam-token-input')?.value || '').trim().toUpperCase();
      if (tokenVal !== curToken()) {
        showToast('Token Tidak Sesuai', 'Periksa kembali token dari pengawas ruang. Token dapat berganti secara berkala.', 'danger');
        return;
      }
      if (!state.studentSession.agreedRules) {
        showToast('Persetujuan Diperlukan', 'Centang pernyataan tata tertib ujian terlebih dahulu.', 'warning');
        return;
      }

      const st = getActiveStudent();
      const pickedId = state.studentSession.schedId;
      const picked = pickedId ? state.schedules.find(x => x.id === pickedId) : null;
      if (picked && pxIsSus(picked) && !pxSusSched(st)) {
        showToast('Sesi Susulan Tidak Tersedia', 'Jadwal susulan ini belum dibuka atau tidak berlaku untuk akun Anda.', 'danger');
        return;
      }
      if (st.status === 'Terblokir') {
        showToast('Sesi Terblokir', 'Hubungi Proktor ruang untuk membuka blokir akun Anda.', 'danger');
        return;
      }
      if (!(picked && pxIsSus(picked))) {
        const livePkg = state.examPackages.find(p => p.id === state.examConfig.activePackageId);
        if (!pxPkgAppliesToStudent(livePkg, st)) {
          showToast('Ujian Bukan untuk Kelas Anda', `Paket ini hanya untuk kelas: ${pxPkgClassLabel(livePkg)}.`, 'danger');
          return;
        }
      }

      const ss = state.studentSession;
      ss.tokenDraft = '';
      st.status = 'Sedang Mengerjakan';
      st.loginTime = st.loginTime && st.loginTime !== '-' ? st.loginTime : new Date().toLocaleTimeString('id-ID');
      ss.step = 'exam';
      ss.answers = { ...(st.answers || {}) };
      ss.flagged = { ...(st.savedFlagged || {}) };
      const totalQ = getActiveExamQuestions().length;
      ss.currentQuestionIndex = Math.min(Math.max(0, st.lastQuestionIndex || 0), Math.max(0, totalQ - 1));
      ss.remainingSeconds = (st.savedRemainingSeconds !== null && st.savedRemainingSeconds !== undefined)
        ? st.savedRemainingSeconds
        : (state.examConfig.durationMinutes * 60);
      ss.serverDeadlineMs = Date.now() + ss.remainingSeconds * 1000;
      ss.lastSavedAt = 'Tersimpan otomatis';

      startExamTimer();
      renderApp();
    }

    function startExamTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const ss = state.studentSession;
        const st = getActiveStudent();
        if (ss.step !== 'exam' || ss.paused) return;
        ss.remainingSeconds = Math.max(0, ss.remainingSeconds - 1);
        st.savedRemainingSeconds = ss.remainingSeconds;
        const badge = document.getElementById('exam-timer-badge');
        if (badge) badge.querySelector('span').textContent = pxFmt(ss.remainingSeconds);
        const mobileBadge = document.getElementById('exam-timer-badge-mobile');
        if (mobileBadge) mobileBadge.querySelector('span').textContent = pxFmt(ss.remainingSeconds);
        if (ss.remainingSeconds === 0) finishStudentExam(true);
      }, 1000);
    }

    // Background Token Auto-Rotation Ticker (runs every 1s)
    setInterval(() => {
      let rotated = false;
      const now = Date.now();
      Object.keys(state.sessionTokens).forEach(room => {
        const tk = state.sessionTokens[room];
        if (tk && !tk.locked && now >= tk.next && !(window.__sbOn && state.currentRole === 'siswa')) {
          tk.token = pxGen();
          tk.next = now + pxMs();
          rotated = true;
        }
      });
      if (rotated) {
        pxSave();
        if (state.authSession.isAuthenticated && state.currentRole === 'admin' && state.adminTab === 'token') {
          renderApp();
        }
      }
      // Jaga kolom token di layar siswa tetap terisi otomatis & selalu sinkron dengan token aktif
      if (state.studentSession.step === 'confirm') {
        const tokInput = document.getElementById('exam-token-input');
        if (tokInput) {
          const active = curToken();
          if (tokInput.value !== active) {
            tokInput.value = active;
            state.studentSession.tokenDraft = active;
          }
        }
      }
    }, 1000);

    function markAnswerSaved() {
      const ss = state.studentSession;
      const st = getActiveStudent();
      st.answers = { ...ss.answers };
      st.savedFlagged = { ...ss.flagged };
      st.lastQuestionIndex = ss.currentQuestionIndex;
      st.savedRemainingSeconds = ss.remainingSeconds;
      ss.lastSavedAt = `Tersimpan ${new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    }

    function selectSingleOption(qId, key) {
      state.studentSession.answers[qId] = key;
      markAnswerSaved();
      renderApp();
    }

    function toggleMultiOption(qId, key) {
      const prev = Array.isArray(state.studentSession.answers[qId]) ? [...state.studentSession.answers[qId]] : [];
      const i = prev.indexOf(key);
      if (i >= 0) prev.splice(i, 1); else prev.push(key);
      state.studentSession.answers[qId] = prev;
      markAnswerSaved();
      renderApp();
    }

    function setStatementAnswer(qId, stId, val) {
      const prev = { ...(state.studentSession.answers[qId] || {}) };
      prev[stId] = val;
      state.studentSession.answers[qId] = prev;
      markAnswerSaved();
      renderApp();
    }

    function setMatchingAnswer(qId, pairId, val) {
      const prev = { ...(state.studentSession.answers[qId] || {}) };
      if (val) prev[pairId] = val; else delete prev[pairId];
      state.studentSession.answers[qId] = prev;
      markAnswerSaved();
      renderApp();
    }

    function saveTextAnswer(qId, val) {
      state.studentSession.answers[qId] = val;
      markAnswerSaved();
    }

    function clearQuestionAnswer(qId) {
      delete state.studentSession.answers[qId];
      markAnswerSaved();
      renderApp();
      showToast('Jawaban Dikosongkan', 'Pilihan pada butir soal ini telah dihapus.', 'info');
    }

    function toggleFlagQuestion(qId) {
      state.studentSession.flagged[qId] = !state.studentSession.flagged[qId];
      markAnswerSaved();
      renderApp();
    }

    function goToQuestion(idx) {
      const total = getOrderedQuestionsForStudent().length;
      if (idx >= 0 && idx < total) {
        state.studentSession.currentQuestionIndex = idx;
        getActiveStudent().lastQuestionIndex = idx;
        renderApp();
      }
    }

    function toggleMobileQuestionDrawer(open) {
      const drawer = document.getElementById('mobile-nav-drawer');
      if (!drawer) return;
      drawer.classList.toggle('hidden', !open);
      if (open && window.lucide) lucide.createIcons();
    }

    function playExamAudio(qId) {
      const ss = state.studentSession;
      const q = state.questions.find(item => item.id === qId);
      if (!q) return;
      const played = ss.audioPlayCountByQ[qId] || 0;
      if (played >= (q.audioMaxPlays || 2)) return;

      ss.audioPlayCountByQ[qId] = played + 1;
      ss.audioPlayingQId = qId;
      ss.audioProgressPct = 0;
      renderApp();

      if (audioProgressInterval) clearInterval(audioProgressInterval);
      audioProgressInterval = setInterval(() => {
        ss.audioProgressPct += 10;
        if (ss.audioProgressPct >= 100) {
          clearInterval(audioProgressInterval);
          ss.audioPlayingQId = null;
          ss.audioProgressPct = 0;
        }
        renderApp();
      }, 600);
    }

    function confirmFinishExam() {
      const orderedQ = getOrderedQuestionsForStudent();
      const answered = orderedQ.filter(q => pxHas(state.studentSession.answers[q.id])).length;
      const flagged = Object.values(state.studentSession.flagged).filter(Boolean).length;
      const unanswered = Math.max(0, orderedQ.length - answered);

      openModal(`
        <div class="p-6 space-y-4">
          <h3 class="font-bold text-base text-slate-900">Konfirmasi Pengumpulan Ujian</h3>
          <div class="grid grid-cols-3 gap-2.5 p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-center font-mono-code text-xs">
            <div><span class="text-slate-500 block font-sans text-[11px]">Dijawab</span><strong class="text-emerald-700 text-sm">${answered}</strong></div>
            <div><span class="text-slate-500 block font-sans text-[11px]">Ragu-Ragu</span><strong class="text-amber-700 text-sm">${flagged}</strong></div>
            <div><span class="text-slate-500 block font-sans text-[11px]">Kosong</span><strong class="text-rose-700 text-sm">${unanswered}</strong></div>
          </div>
          <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">
            Pastikan seluruh jawaban telah diperiksa. Setelah dikumpulkan, Anda tidak dapat mengubah lembar jawaban kembali.
          </p>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-xs font-semibold">Periksa Kembali</button>
            <button type="button" onclick="closeModal(); finishStudentExam(false);" class="px-4 py-2 rounded-lg btn-sapphire text-xs font-semibold">Ya, Kumpulkan Sekarang</button>
          </div>
        </div>
      `);
    }

    function finishStudentExam(autoSubmitted = false) {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      const st = getActiveStudent();
      const ss = state.studentSession;
      st.answers = { ...ss.answers };
      st.status = 'Selesai';
      st.finishTime = new Date().toLocaleTimeString('id-ID');
      st.finishedAt = Date.now();
      const usedMin = Math.max(1, Math.round((state.examConfig.durationMinutes * 60 - ss.remainingSeconds) / 60));
      st.duration = `${usedMin} menit`;
      st.lastQuestionIndex = 0;
      st.savedRemainingSeconds = null;
      st.savedFlagged = {};
      ss.step = 'finished';
      pxLog(autoSubmitted ? 'Ujian Selesai Otomatis (Waktu Habis)' : 'Ujian Dikumpulkan Peserta', `${st.name} (${st.nis})`, `Durasi ${st.duration}`, st.name);
      syncAllSystemEntities(false);
      renderApp();
      showToast(autoSubmitted ? 'Waktu Habis' : 'Ujian Selesai', 'Jawaban Anda telah tersimpan & tersinkronisasi dengan panel Guru & Admin.', 'success');
    }

    // Anti-Cheat Tab Switch Detection
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && state.authSession.isAuthenticated && state.currentRole === 'siswa' && state.studentSession.step === 'exam' && !state.studentSession.paused) {
        const st = getActiveStudent();
        state.studentSession.violations += 1;
        st.violations = state.studentSession.violations;
        if (st.violations >= pxMax()) {
          st.status = 'Terblokir';
          st.lastQuestionIndex = state.studentSession.currentQuestionIndex;
          st.savedRemainingSeconds = state.studentSession.remainingSeconds;
          st.savedFlagged = { ...state.studentSession.flagged };
          state.studentSession.step = 'portal';
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
          pxLog('Sesi Terblokir Otomatis', `${st.name} (${st.nis})`, `Pelanggaran layar ${st.violations}/${pxMax()}`, 'Sistem Anti-Cheat');
          renderApp();
          showToast('Sesi Terblokir', 'Anda melampaui batas perpindahan layar. Hubungi Proktor untuk membuka blokir.', 'danger');
        } else {
          pxLog('Peringatan Pelanggaran Layar', `${st.name} (${st.nis})`, `Pelanggaran ke-${st.violations}/${pxMax()}`, 'Sistem Anti-Cheat');
          renderApp();
          showToast(`Peringatan Pelanggaran (${st.violations}/${pxMax()})`, 'Dilarang meninggalkan jendela ujian!', 'warning');
        }
      }
    });

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeModal(); toggleMobileQuestionDrawer(false); return; }
      if (!state.authSession.isAuthenticated || state.currentRole !== 'siswa' || state.studentSession.step !== 'exam') return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

      const idx = state.studentSession.currentQuestionIndex;
      const orderedQ = getOrderedQuestionsForStudent();
      const q = orderedQ[idx];
      if (!q) return;

      if (e.key === 'ArrowRight') { e.preventDefault(); goToQuestion(idx + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); goToQuestion(idx - 1); }
      else if (q.type === 'PG') {
        const map = { a: 0, '1': 0, b: 1, '2': 1, c: 2, '3': 2, d: 3, '4': 3, e: 4, '5': 4 };
        const pos = map[e.key.toLowerCase()];
        const opts = getOrderedOptionsForQuestion(q);
        if (pos !== undefined && opts[pos]) {
          e.preventDefault();
          selectSingleOption(q.id, opts[pos].key);
        }
      }
    });

      const newPkgId = 'PKG-' + (teacherAcc ? teacherAcc.id : 'GUR') + '-' + Date.now().toString().slice(-4);
      const clonedPkg = {
        ...JSON.parse(JSON.stringify(src)),
        id: newPkgId,
        title: `${src.title} (Salinan)`,
        publishState: 'DRAFT'
      };
      state.examPackages.push(clonedPkg);

      const srcQuestions = getQuestionsForPackage(src);
      srcQuestions.forEach((q, idx) => {
        const clonedQ = JSON.parse(JSON.stringify(q));
        clonedQ.id = 'Q' + (state.questions.length + 1) + '_' + Date.now().toString().slice(-3);

      if (!activePkg) return;
      const readiness = getPackageReadiness(activePkg);
      if (readiness.activeCount === 0) {
        showToast('Paket Kosong', 'Tambahkan minimal 1 butir soal aktif pada paket ini sebelum mengaktifkan ujian.', 'warning');

        return;

      syncPackageAcrossSystem(activePkg, { activateForStudents: true });

      renderApp();
      showToast('Paket Diaktifkan & Tersinkron', `"${activePkg.title}" (${readiness.activeCount} soal) aktif di portal siswa & jadwal Admin.`, 'success');

      const pkg = state.examPackages.find(p => p.id === pkgId);

      const readiness = getPackageReadiness(pkg);
      if (readiness.activeCount === 0) {
        showToast('Paket Belum Berisi Soal', 'Guru belum menambahkan butir soal aktif pada paket ini.', 'warning');

    function assignSchedulePackage(schId, pkgId) {
      const sch = state.schedules.find(s => s.id === schId);
      const pkg = state.examPackages.find(p => p.id === pkgId);
      if (!sch || !pkg) return;
      sch.packageId = pkg.id;
      sch.ownerId = pkg.ownerId;
      sch.subject = pkg.subject;
      sch.topic = pkg.topic;
      sch.duration = Number(pkg.durationMinutes || sch.duration || 90);
      sch.grade = pkg.grade || sch.grade;
      if (sch.status === 'Berlangsung' && pxIsSus(sch)) {
        if (pkg.id !== state.examConfig.activePackageId) sch.status = 'Terjadwal';
        pxLog('Tautkan Paket ke Jadwal', sch.id, pkg.title, null);
      } else if (sch.status === 'Berlangsung') {
        syncPackageAcrossSystem(pkg, { activateForStudents: true });
      } else {
        pxLog('Tautkan Paket ke Jadwal', sch.id, pkg.title, null);
      }
      pxSaveImmediate();
      renderApp();
      showToast('Jadwal Tersinkron', `Sesi ${sch.session} ditautkan ke "${pkg.title}".`, 'success');
    }

    function pxApplyCopyQuestions(srcId) {
      const target = getActiveTeacherPackage(getCurrentTeacherAccount());
      const src = state.examPackages.find(p => p.id === srcId);
      const ids = [...document.querySelectorAll('.cpq-chk:checked')].map(el => el.value);
      if (!src || ids.length === 0) { showToast('Belum Ada yang Dipilih', 'Centang minimal satu butir soal.', 'info'); return; }
      const pool = getQuestionsForPackage(src);
      let n = getQuestionsForPackage(target).length, copied = 0;
      ids.forEach((id, k) => {
        const q = pool.find(x => x.id === id);
        if (!q) return;
        const c = JSON.parse(JSON.stringify(q));
        c.id = 'Q' + Date.now().toString(36).toUpperCase() + k;
        c.number = ++n;
        c.packageId = target.id;
        c.ownerId = target.ownerId;
        if (target.ownerName) c.ownerName = target.ownerName;
        c.included = true;
        delete c.adminDisabled;
        delete c.validated;
        state.questions.push(c);
        copied++;
      });
      syncPackageAcrossSystem(target, { activateForStudents: false, silent: true });
      pxLog('Salin Soal Antar Paket', `${src.title} -> ${target.title}`, `${copied} butir`, null);
      pxSaveImmediate();
      closeModal();
      renderApp();
      showToast('Soal Disalin', `${copied} butir soal ditambahkan ke ${target.title}.`, 'success');
    }

            ${[0, 1, 2].map(i => `

                <input type="text" id="qe-pair-l-${i}" value="${pxEsc((pairRows[i] || {}).left || '')}" placeholder="Premis kiri #${i + 1}..." class="p-2 rounded-lg border border-slate-300 bg-white text-xs">
                <input type="text" id="qe-pair-r-${i}" value="${pxEsc((pairRows[i] || {}).right || '')}" placeholder="Pasangan kanan #${i + 1}..." class="p-2 rounded-lg border border-slate-300 bg-white text-xs font-semibold">

            <div class="pt-1">

              <input type="text" id="qe-isian-variants" value="${pxEsc(shortVariantsVal)}" placeholder="Variasi diterima dipisah koma (47, 47.0)" class="p-2 rounded-lg border border-slate-300 bg-white font-mono-code text-xs">
            </div>

          <div id="qe-sec-esai" class="space-y-2 p-3.5 rounded-xl bg-slate-50 border border-slate-300 ${qType === 'ESAI' ? '' : 'hidden'}">

    function switchQuestionEditorType(type) {
      document.getElementById('qe-sec-pg')?.classList.toggle('hidden', !(type === 'PG' || type === 'PG_KOMPLEKS'));
      document.getElementById('qe-sec-bs')?.classList.toggle('hidden', type !== 'BENAR_SALAH');
      document.getElementById('qe-sec-jodoh')?.classList.toggle('hidden', type !== 'MENJODOHKAN');
      document.getElementById('qe-sec-isian')?.classList.toggle('hidden', type !== 'ISIAN');
      document.getElementById('qe-sec-esai')?.classList.toggle('hidden', type !== 'ESAI');

      document.querySelectorAll('.qe-single-key').forEach(el => el.classList.toggle('hidden', type !== 'PG'));
      document.querySelectorAll('.qe-multi-key').forEach(el => el.classList.toggle('hidden', type !== 'PG_KOMPLEKS'));
      const hint = document.getElementById('qe-pg-hint');
      if (hint) hint.textContent = type === 'PG' ? 'Pilih 1 kunci jawaban benar' : 'Centang 2 atau lebih kunci jawaban benar';
    }

    function refreshQuestionLatexPreview() {
      const promptEl = document.getElementById('qe-prompt');
      const prevEl = document.getElementById('qe-latex-preview');
      if (!promptEl || !prevEl) return;
      const raw = promptEl.value.trim();
      prevEl.innerHTML = raw ? `<p>${pxEsc(raw)}</p>` : '<span class="text-slate-400 italic">Pratinjau teks &amp; rumus matematika muncul di sini...</span>';
      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([prevEl]).catch(() => {});
      }
    }

    function saveQuestionForm(e, editId) {
      e.preventDefault();
      const teacherAcc = getCurrentTeacherAccount();
      const activePkg = getActiveTeacherPackage(teacherAcc);
      const type = document.getElementById('qe-type').value;
      const element = document.getElementById('qe-element').value;
      const weight = Math.max(1, Number(document.getElementById('qe-weight').value) || 10);
      const included = document.getElementById('qe-included').value === 'true';
      const topic = document.getElementById('qe-topic').value.trim();
      const cp = document.getElementById('qe-cp').value.trim();
      const atp = document.getElementById('qe-atp').value.trim();
      const promptRaw = document.getElementById('qe-prompt').value.trim();
      const codeStimulus = document.getElementById('qe-stimulus-code').value.trim();

      const typeLabels = {
        PG: 'Pilihan Ganda',
        PG_KOMPLEKS: 'Pilihan Ganda Kompleks',
        BENAR_SALAH: 'Benar / Salah Majemuk',
        MENJODOHKAN: 'Menjodohkan',
        ISIAN: 'Isian Singkat',
        ESAI: 'Uraian / Esai'
      };

      const existing = editId ? state.questions.find(item => item.id === editId) : null;
      const qObj = existing || {
        id: 'Q' + (state.questions.length + 1) + '_' + Date.now().toString().slice(-3),
        number: state.questions.length + 1,
        packageId: activePkg ? activePkg.id : 'PKG-GUR-01',
        ownerId: teacherAcc ? teacherAcc.id : 'GUR-01',
        ownerName: teacherAcc ? teacherAcc.name : state.examConfig.teacher,
        subject: activePkg ? activePkg.subject : state.examConfig.subject,
        grade: activePkg ? activePkg.grade : state.examConfig.grade
      };

      qObj.type = type;
      qObj.typeLabel = typeLabels[type] || 'Pilihan Ganda';
      qObj.element = element;
      qObj.weight = weight;
      const prevIncluded = existing ? !!existing.included : null;
      qObj.included = included;
      if (state.currentRole === 'admin') {
        if (prevIncluded === null || prevIncluded !== included) qObj.adminDisabled = !included;
      } else if (qObj.adminDisabled) {
        qObj.included = false;
      }
      qObj.topic = topic;
      qObj.cp = cp;
      qObj.atp = atp;
      qObj.tp = atp || topic;
      qObj.formattedPrompt = `<p>${pxEsc(promptRaw)}</p>`;

      if (codeStimulus) {
        qObj.stimulusHtml = `
          <div class="rounded-xl overflow-hidden border border-slate-700/90 bg-slate-950 shadow-sm">
            <div class="px-3.5 py-2 bg-slate-900 border-b border-slate-800 flex items-center justify-between text-xs font-mono-code text-slate-300">
              <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> stimulus_kode</span>
              <span class="text-sky-400">${pxEsc(qObj.id)}</span>
            </div>
            <pre class="p-3.5 text-emerald-300 font-mono-code text-xs overflow-x-auto leading-relaxed"><code>${pxEsc(codeStimulus)}</code></pre>
          </div>
        `;
      } else {
        delete qObj.stimulusHtml;
      }

      if (type === 'PG' || type === 'PG_KOMPLEKS') {
        const opts = [];
        ['A', 'B', 'C', 'D', 'E'].forEach(k => {
          const val = (document.getElementById(`qe-opt-${k}`)?.value || '').trim();
          if (val) opts.push({ key: k, text: pxEsc(val) });
        });
        qObj.options = opts.length >= 2 ? opts : [{ key: 'A', text: 'Opsi A' }, { key: 'B', text: 'Opsi B' }];
        if (type === 'PG') {
          const checkedRadio = document.querySelector('input[name="qe-pg-key"]:checked');
          qObj.correctKey = checkedRadio ? checkedRadio.value : qObj.options[0].key;
        } else {
          const checkedBoxes = [...document.querySelectorAll('.qe-pgk-key:checked')].map(el => el.value);
          qObj.correctKeys = checkedBoxes.length > 0 ? checkedBoxes : [qObj.options[0].key];
        }
      } else if (type === 'BENAR_SALAH') {
        const stmts = [];
        [0, 1, 2].forEach(i => {
          const txt = (document.getElementById(`qe-bs-text-${i}`)?.value || '').trim();
          const ans = document.getElementById(`qe-bs-ans-${i}`)?.value || 'Benar';
          if (txt) stmts.push({ id: `S${i + 1}`, text: pxEsc(txt), answer: ans });
        });
        qObj.statements = stmts.length > 0 ? stmts : [{ id: 'S1', text: 'Pernyataan 1', answer: 'Benar' }];
      } else if (type === 'MENJODOHKAN') {
        const pairs = [];
        [0, 1, 2].forEach(i => {
          const l = (document.getElementById(`qe-pair-l-${i}`)?.value || '').trim();
          const r = (document.getElementById(`qe-pair-r-${i}`)?.value || '').trim();
          if (l && r) pairs.push({ id: `P${i + 1}`, left: pxEsc(l), right: r });
        });
        qObj.pairs = pairs.length > 0 ? pairs : [{ id: 'P1', left: 'Premis 1', right: 'Pasangan 1' }];
        const extra = (document.getElementById('qe-pair-distractor')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
        qObj.distractorChoices = [...new Set([...qObj.pairs.map(p => p.right), ...extra])];
      } else if (type === 'ISIAN') {
        const mainKey = (document.getElementById('qe-isian-key')?.value || '').trim() || '-';
        const vars = (document.getElementById('qe-isian-variants')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
        qObj.correctText = mainKey;
        qObj.acceptedVariants = vars.length > 0 ? vars : [mainKey];
      } else if (type === 'ESAI') {
        qObj.idealAnswer = (document.getElementById('qe-esai-ideal')?.value || '').trim();
        qObj.rubric = (document.getElementById('qe-esai-rubric')?.value || '').trim();
        qObj.rubricLevels = Object.fromEntries(['mahir', 'cakap', 'layak', 'baru'].map(k => [k, (document.getElementById('qe-rl-' + k)?.value || '').trim()]));
      }

      if (!existing) {
        state.questions.push(qObj);
        pxLog('Tambah Butir Soal', `${qObj.id} (${qObj.typeLabel})`, qObj.topic, null);
      } else {
        pxLog('Edit Butir Soal', `${qObj.id} (${qObj.typeLabel})`, qObj.topic, null);
      }

      const syncPkg = state.examPackages.find(pk => pk.id === qObj.packageId) || activePkg;
      if (syncPkg) syncPackageAcrossSystem(syncPkg, { activateForStudents: false, silent: true });
      closeModal();
      pxSaveImmediate();
      renderApp();
      showToast(existing ? 'Perubahan Disimpan' : 'Soal Ditambahkan', `Butir soal ${qObj.id} berhasil disimpan ke paket ujian.`, 'success');
    }

    function pxRubricLevels(q) {
      if (q.rubricLevels && Object.values(q.rubricLevels).some(Boolean)) return q.rubricLevels;
      const out = {}, map = { 'mahir': 'mahir', 'cakap': 'cakap', 'layak': 'layak', 'baru berkembang': 'baru' };
      String(q.rubric || '').replace(/(Mahir|Cakap|Layak|Baru Berkembang)\s*\(\d+\)\s*:\s*([^;]+)/gi, (m, l, d) => { out[map[l.toLowerCase()]] = d.trim(); return m; });
      return out;
    }

      const fb = document.getElementById('essay-feedback-input');
      if (fb && !fb.value.trim() && pxRubricLevels(q)[key]) fb.value = pxRubricLevels(q)[key];
      saveEssayScore(studentId, qId, Math.round(q.weight * ratio), false);
    }

    function saveEssayScore(studentId, qId, scoreVal, autoNext = false) {
      const st = pxGuruStudentById(studentId);
      const q = state.questions.find(item => item.id === qId);

      if (!st.essayScores) st.essayScores = {};
      if (!st.essayFeedbacks) st.essayFeedbacks = {};
      st.essayScores[qId] = Math.min(q.weight, Math.max(0, Number(scoreVal) || 0));
      const fbInput = document.getElementById('essay-feedback-input');
      if (fbInput) st.essayFeedbacks[qId] = fbInput.value.trim();
      pxLog('Koreksi Esai Manual', `${st.name} (${qId})`, `Skor ${st.essayScores[qId]}/${q.weight}`, null);
      pxSaveImmediate();
      showToast('Nilai Esai Tersimpan', `Skor ${st.essayScores[qId]}/${q.weight} tersinkron ke e-Rapor & Portal Siswa.`, 'success');

        showToast('Peserta Sedang Ujian', 'Peserta yang sedang mengerjakan tidak dapat dihapus. Tunggu sampai selesai atau reset sesinya lebih dulu.', 'warning');
        return;

      const hasData = st.status === 'Selesai' || Object.keys(st.answers || {}).length > 0 || Object.keys(st.results || {}).length > 0;
      const inSus = state.schedules.filter(sc => pxIsSus(sc) && (sc.targetStudentIds || []).includes(st.id)).length;
      pxAskDelete('Hapus peserta ini?',
        `<strong>${pxEsc(st.name)}</strong> (${pxEsc(st.className)}, NIS ${pxEsc(st.nis)}) akan dihapus dari daftar.`
        + (hasData ? ' <strong class="text-rose-700">Jawaban dan hasil ujiannya ikut terhapus.</strong>' : '')
        + (inSus ? ` Ia juga dikeluarkan dari ${inSus} jadwal susulan.` : '')
        + ' Tindakan ini tidak dapat dibatalkan.',
        `pxDoDelUser('${st.id}')`);
    }

      state.students = state.students.filter(s => s.id !== id);

    let pxSusSel = new Set();
    function pxSusCount() {
      const el = document.getElementById('sch-sus-count');
      if (el) el.textContent = `Terpilih: ${pxSusSel.size} peserta`;
    }
    function pxSusVisible() {
      const cls = (document.getElementById('sch-cls') || {}).value || 'ALL';
      const q = ((document.getElementById('sch-q') || {}).value || '').trim().toLowerCase();
      return sortStudentsByName(state.students.filter(x => pxAllowed(x.room) && (cls === 'ALL' || x.className === cls) &&
        (!q || String(x.name).toLowerCase().includes(q) || String(x.nis).includes(q))));
    }
    function pxSusRenderList() {
      const box = document.getElementById('sch-sus-list');
      if (!box) return;
      const all = pxSusVisible();
      const list = all.slice(0, 150);
      box.innerHTML = list.map(x => {
        const sel = pxSusSel.has(x.id);
        const ok = x.status === 'Belum Login';
        const dis = !ok && !sel;
        return `<label class="flex items-center gap-2.5 px-3 py-2 text-xs ${dis ? 'opacity-50' : 'cursor-pointer hover:bg-slate-50'}">
          <input type="checkbox" ${sel ? 'checked' : ''} ${dis ? 'disabled' : ''} onchange="pxSusToggle('${x.id}', this.checked)" class="w-4 h-4 accent-[#1E3A5F]">
          <span class="flex-1 min-w-0 truncate font-semibold text-slate-800">${pxEsc(x.name)}</span>
          <span class="font-mono-code text-slate-500">${pxEsc(x.className)}</span>
          <span class="px-1.5 py-0.5 rounded border border-slate-300 text-[10px] ${ok ? 'bg-emerald-50 text-emerald-800' : 'bg-slate-100 text-slate-600'}">${pxEsc(x.status)}</span>
        </label>`;
      }).join('') || '<div class="p-4 text-xs text-center text-slate-500">Tidak ada peserta yang cocok.</div>';
      if (all.length > list.length) box.innerHTML += `<div class="p-2 text-[11px] text-center text-slate-500">Menampilkan 150 dari ${all.length}. Persempit dengan kelas atau pencarian.</div>`;
      pxSusCount();
    }
    function pxSusToggle(id, on) {
      if (on) pxSusSel.add(id); else pxSusSel.delete(id);
      pxSusCount();
    }
    function pxSusAll(on) {
      if (on) pxSusVisible().slice(0, 150).forEach(x => { if (x.status === 'Belum Login') pxSusSel.add(x.id); });
      else pxSusSel.clear();
      pxSusRenderList();
    }
    function pxSchedTypeChange() {
      const isSus = document.getElementById('sch-type').value === 'Ujian Susulan';
      document.getElementById('sch-sus-box').classList.toggle('hidden', !isSus);
      if (isSus) pxSusRenderList();
    }

    function pxSaveSchedule(e, id) {
      e.preventDefault();
      const pkgId = document.getElementById('sch-pkg').value;
      const pkg = state.examPackages.find(p => p.id === pkgId) || state.examPackages[0];
      const startDate = document.getElementById('sch-date').value;
      const time = document.getElementById('sch-time').value.trim();
      const room = document.getElementById('sch-room').value.trim();
      const session = document.getElementById('sch-session').value.trim();
      const isSus = document.getElementById('sch-type').value === 'Ujian Susulan';
      const targets = isSus ? [...pxSusSel] : [];
      let susToken = (document.getElementById('sch-token').value || '').trim().toUpperCase();
      if (isSus && targets.length === 0) {
        showToast('Peserta Susulan Belum Dipilih', 'Pilih minimal satu peserta untuk ujian susulan.', 'warning');
        return;
      }
      if (isSus && !susToken) susToken = pxGen();

      if (id) {
        const sch = state.schedules.find(s => s.id === id);
        if (sch) {
          Object.assign(sch, {
            packageId: pkg.id,
            ownerId: pkg.ownerId,
            subject: pkg.subject,
            topic: pkg.topic,
            grade: pkg.grade,
            duration: pkg.durationMinutes,
            startDate,
            endDate: startDate,
            time,
            room,
            session,
            type: isSus ? 'Ujian Susulan' : 'Ujian Utama',
            targetStudentIds: targets,
            token: isSus ? susToken : ''
          });
          if (sch.status === 'Berlangsung') {
            if (isSus) { if (pkg.id !== state.examConfig.activePackageId) sch.status = 'Terjadwal'; }
            else syncPackageAcrossSystem(pkg, { activateForStudents: true });
          }
        }
      } else {
        state.schedules.push({
          id: 'SCH-' + Date.now().toString().slice(-4),
          packageId: pkg.id,
          ownerId: pkg.ownerId,
          startDate,
          endDate: startDate,
          time,
          duration: pkg.durationMinutes || 90,
          subject: pkg.subject,
          topic: pkg.topic,
          grade: pkg.grade || 'Fase F (XI)',
          room,
          session,
          type: isSus ? 'Ujian Susulan' : 'Ujian Utama',
          targetStudentIds: targets,
          token: isSus ? susToken : '',
          status: 'Terjadwal'
        });
      }
      closeModal();
      pxSaveImmediate();
      renderApp();
      showToast('Jadwal Tersimpan', `Sesi ujian ditautkan ke paket "${pkg.title}".`, 'success');
    }

    function pxSchedStatus(id, status) {
      const sch = state.schedules.find(s => s.id === id);
      if (sch && pxIsSus(sch) && status === 'Berlangsung') {
        if (sch.packageId !== state.examConfig.activePackageId) {
          showToast('Paket Belum Aktif', 'Susulan memakai paket yang sedang aktif. Aktifkan paket ujian tersebut lebih dulu (hasil paket lain akan diarsipkan).', 'warning');
          renderApp();
          return;
        }
        if (!(sch.targetStudentIds || []).length) {
          showToast('Peserta Susulan Kosong', 'Pilih peserta susulan lewat tombol Edit sebelum membuka sesi.', 'warning');
          renderApp();
          return;
        }
        sch.status = status;
        pxLog('Buka Ujian Susulan', sch.id, `${sch.targetStudentIds.length} peserta`, null);
        pxSaveImmediate();
        renderApp();
        showToast('Ujian Susulan Dibuka', `${sch.targetStudentIds.length} peserta dapat masuk dengan token susulan ${sch.token || '-'}. Ujian utama tidak terpengaruh.`, 'success');
        return;
      }
      if (sch) {
        sch.status = status;
        if (status === 'Berlangsung' && sch.packageId) {
          const pkg = state.examPackages.find(p => p.id === sch.packageId);
          if (pkg) syncPackageAcrossSystem(pkg, { activateForStudents: true });
        }
        pxSaveImmediate();
        renderApp();
        showToast('Status Diperbarui', `Status jadwal diubah ke ${status}.`, 'info');
      }
    }

    function pxDelSched(id) {
      const sch = state.schedules.find(s => s.id === id);
      if (!sch) return;
      if (sch.status === 'Berlangsung') {
        showToast('Jadwal Sedang Berlangsung', 'Ubah status ke Terjadwal atau Selesai lebih dulu sebelum menghapus jadwal.', 'warning');
        return;
      }
      const n = pxIsSus(sch) ? (sch.targetStudentIds || []).length : 0;
      pxAskDelete('Hapus jadwal ini?',
        `Sesi <strong>${pxEsc(sch.session)}</strong> (${pxEsc(sch.type)}) pada ${pxEsc(sch.startDate)}, ${pxEsc(sch.time)} akan dihapus.`
        + (n ? ` Daftar ${n} peserta susulan dan token susulan ikut hilang.` : '')
        + ' Hasil ujian siswa tidak terpengaruh.',
        `pxDoDelSched('${sch.id}')`);
    }

    function pxDoDelSched(id) {
      const sch = state.schedules.find(s => s.id === id);
      if (!sch) return;
      state.schedules = state.schedules.filter(s => s.id !== id);
      pxLog('Hapus Jadwal', `${sch.id} (${sch.type}, ${sch.startDate} ${sch.session})`, 'Jadwal dihapus', null);
      pxSaveImmediate();
      renderApp();
      showToast('Jadwal Dihapus', 'Sesi ujian dihapus dari daftar jadwal.', 'info');
    }

    function saveTeacherAccount(e, id) {
      e.preventDefault();
      const name = document.getElementById('tch-name').value.trim();
      const nip = document.getElementById('tch-nip').value.trim();
      const password = document.getElementById('tch-pass').value.trim();
      const subject = document.getElementById('tch-subj').value.trim();
      if (id) {
        const g = state.staffAccounts.find(a => a.id === id);
        if (g) Object.assign(g, { name, username: nip, altUsername: nip, nip, password, subject, subtitle: `Guru ${subject}` });
      } else {
        let seq = state.staffAccounts.filter(a => a.role === 'guru').length + 1;
        const usedIds = new Set([...(state.deletedTeacherIds || []), ...state.staffAccounts.map(a => a.id)]);
        while (usedIds.has('GUR-' + String(seq).padStart(2, '0'))) seq++;
        const newId = 'GUR-' + String(seq).padStart(2, '0');
        state.staffAccounts.push({
          id: newId, role: 'guru', username: nip, altUsername: nip, password, name, nip, subject, subtitle: `Guru ${subject}`
        });
      }
      pxLog(id ? 'Edit Akun Guru Mapel' : 'Tambah Akun Guru Mapel', `${name} (${nip})`, subject, null);
      closeModal();
      pxSaveImmediate();
      renderApp();
      showToast('Akun Guru Tersimpan', `Akun ${name} siap digunakan untuk menyusun bank soal.`, 'success');
    }

    // ===== CADANGAN OTOMATIS (IndexedDB, 10 snapshot terakhir) =====
    const PX_AUTOBACKUP_MAX = 10;
    const pxAutoOn = () => { try { return localStorage.getItem('tritas_cbt_autobackup_off') !== '1'; } catch (e) { return true; } };
    const pxIdb = () => new Promise((res, rej) => {
      const r = indexedDB.open('tritas_cbt_backup', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('snap', { keyPath: 'ts' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    const pxIdbReq = rq => new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });

    async function pxSnapList() {
      const db = await pxIdb();
      const all = await pxIdbReq(db.transaction('snap').objectStore('snap').getAll());
      return all.sort((a, b) => b.ts - a.ts);
    }

    async function pxAutoBackup(reason, onlyIfChanged) {
      try {
        const json = pxSnap();
        if (onlyIfChanged && json === window.__pxLastSnap) return false;
        window.__pxLastSnap = json;
        const db = await pxIdb();
        await pxIdbReq(db.transaction('snap', 'readwrite').objectStore('snap').put({ ts: Date.now(), reason, size: json.length, json }));
        const list = await pxSnapList();
        const st = db.transaction('snap', 'readwrite').objectStore('snap');
        list.slice(PX_AUTOBACKUP_MAX).forEach(x => st.delete(x.ts));
        window.__pxSnaps = list.slice(0, PX_AUTOBACKUP_MAX);
        return true;
      } catch (e) { return false; }
    }

    function pxEnsureSnaps() {
      if (window.__pxSnapsLoaded) return '';
      window.__pxSnapsLoaded = true;
      pxSnapList().then(l => { window.__pxSnaps = l; renderApp(); }).catch(() => { window.__pxSnaps = []; });
      return '';
    }

    async function pxBackupNow() {
      const ok = await pxAutoBackup('Manual', false);
      if (ok) { window.__pxSnapsLoaded = false; renderApp(); }
      showToast(ok ? 'Cadangan Dibuat' : 'Cadangan Gagal', ok ? 'Snapshot disimpan di browser ini.' : 'Penyimpanan browser tidak tersedia.', ok ? 'success' : 'danger');
    }

    function pxToggleAutoBackup(on) {
      try { if (on) localStorage.removeItem('tritas_cbt_autobackup_off'); else localStorage.setItem('tritas_cbt_autobackup_off', '1'); } catch (e) {}
      renderApp();
    }

    async function pxRestoreSnap(ts) {
      const rec = (window.__pxSnaps || []).find(x => x.ts === ts);
      if (!rec) return;
      if (!confirm(`Pulihkan data ke snapshot ${new Date(ts).toLocaleString('id-ID')}?\nData saat ini akan diganti (snapshot pengaman dibuat lebih dulu).`)) return;
      await pxAutoBackup('Sebelum pemulihan snapshot', false);
      const d = JSON.parse(rec.json);
      PX_KEYS.forEach(k => { if (d[k] !== undefined) state[k] = d[k]; });
      pxLog('Pulihkan Snapshot', new Date(ts).toLocaleString('id-ID'), rec.reason, null);
      pxSaveImmediate();
      syncAllSystemEntities(false);
      window.__pxSnapsLoaded = false;
      renderApp();
      showToast('Data Dipulihkan', 'Database dikembalikan ke snapshot terpilih.', 'success');
    }

    function pxDownloadSnap(ts) {
      const rec = (window.__pxSnaps || []).find(x => x.ts === ts);
      if (!rec) return;
      const d = JSON.parse(rec.json);
      const payload = { app: 'Tritas CBT Studio — SMAN 3 Tasikmalaya', exportedAt: new Date(ts).toISOString(), data: Object.fromEntries(PX_KEYS.map(k => [k, d[k]])) };
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
      a.download = `snapshot_tritas_cbt_${new Date(ts).toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json`;
      a.click();
    }

    function importFullBackupJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          const data = parsed.data || parsed;
          if (!data || !Array.isArray(data.students)) throw new Error('Format tidak valid');
          PX_KEYS.forEach(k => { if (data[k] !== undefined) state[k] = data[k]; });
          pxLog('Pemulihan Database JSON', file.name, 'Restore berhasil', null);
          pxSaveImmediate();
          renderApp();
          showToast('Pemulihan Berhasil', 'Database sistem telah dipulihkan dari file cadangan.', 'success');
        } catch (err) {
          showToast('Gagal Memulihkan JSON', 'Pastikan berkas berasal dari fitur Unduh Backup JSON.', 'danger');

        e.target.value = '';
      };
      reader.readAsText(file);

      examPackages:  { t: 'exam_packages', cols: o => ({ owner_id: str(o.ownerId), title: str(o.title), subject: str(o.subject), publish_state: str(o.publishState) }) },
      questions:     { t: 'questions', batch: 20, cols: o => ({ package_id: str(o.packageId), owner_id: str(o.ownerId), number: num(o.number), qtype: str(o.type) }) },
      schedules:     { t: 'schedules', cols: o => ({ package_id: str(o.packageId), owner_id: str(o.ownerId), start_date: str(o.startDate), end_date: str(o.endDate) }) },
      rooms:         { t: 'rooms', cols: o => ({ name: str(o.name) }) }
    };
    const SETTINGS = ['schoolInfo', 'examConfig', 'deletedTeacherIds', 'sessionTokens'];

    const last = {};                       // key -> Map(id -> json terakhir yang sinkron)
    Object.keys(TABLES).forEach(k => { last[k] = new Map(); });
    const lastSet = new Map();             // key pengaturan -> json terakhir yang sinkron

    let sb = null, scope = 'none';         // scope: none | student | full
    let pushing = false, dirty = false, pushTimer = 0, renderTimer = 0;
    let channel = null, wasDown = false, serverEmpty = false, lastVer = null;
    let auditMark = Date.now();
    let status = { kind: enabled ? 'idle' : 'off', msg: '' };

    const role = () => (state.authSession.isAuthenticated ? state.currentRole : null);
    const ownStudentId = () => (role() === 'siswa' ? (state.authSession.user || {}).id : null);
    const cache = () => { try { localStorage.setItem('tritas_cbt_studio_v2', pxSnap()); } catch (e) {} };
    const toast = (a, b, c) => { try { showToast(a, b, c || 'info'); } catch (e) {} };

    // ---------------------------------------------------------------- UI chip
    const chip = document.createElement('button');
    chip.id = 'sb-chip'; chip.type = 'button'; chip.className = 'no-print';
    chip.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:40;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font:600 11px/1.2 Inter,system-ui,sans-serif;background:var(--bg-surface,#fff);color:var(--ink-secondary,#334155);border:1px solid var(--border-hairline,#CBD5E1);box-shadow:0 2px 8px rgba(15,23,42,.12);cursor:pointer;opacity:.92';
    const panel = document.createElement('div');
    panel.id = 'sb-panel'; panel.className = 'no-print';
    panel.style.cssText = 'position:fixed;left:12px;bottom:46px;z-index:40;width:260px;display:none;padding:12px;border-radius:12px;font:12px/1.5 Inter,system-ui,sans-serif;background:var(--bg-surface,#fff);color:var(--ink-primary,#0F172A);border:1px solid var(--border-hairline,#CBD5E1);box-shadow:0 8px 24px rgba(15,23,42,.18)';
    document.body.appendChild(chip);
    document.body.appendChild(panel);

    const COLORS = { off: '#94A3B8', idle: '#64748B', sync: '#F59E0B', ok: '#10B981', warn: '#F59E0B', err: '#EF4444' };
    const LABELS = { off: 'Mode lokal', idle: 'Supabase siap', sync: 'Menyinkronkan…', ok: 'Tersinkron', warn: 'Perlu tindakan', err: 'Sinkron gagal' };

    function setStatus(kind, msg) {
      status = { kind, msg: msg || '', at: kind === 'ok' ? new Date() : (status.at || null) };
      chip.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:' + COLORS[kind] + '"></span>' + LABELS[kind];
      refreshChipVisibility();
      if (panel.style.display === 'block') renderPanel();
    }
    function refreshChipVisibility() {
      const inExam = role() === 'siswa' && state.studentSession.step === 'exam';
      chip.style.display = inExam ? 'none' : 'flex';
      if (inExam) panel.style.display = 'none';
    }
    function renderPanel() {
      const r = role();
      const staff = r === 'admin' || r === 'guru';
      const at = status.at ? status.at.toLocaleTimeString('id-ID') : '-';
      let h = '<div style="font-weight:700;margin-bottom:4px">Sinkronisasi Supabase</div>';
      if (!enabled) {
        h += '<div style="color:#64748B">Belum dikonfigurasi. Isi <b>SUPABASE_URL</b> dan <b>SUPABASE_ANON_KEY</b> di bagian bawah file HTML. Data saat ini hanya tersimpan di peramban ini.</div>';
      } else {
        h += '<div>Status: <b>' + LABELS[status.kind] + '</b></div>';
        h += '<div style="color:#64748B">Terakhir berhasil: ' + at + '</div>';
        if (status.msg) h += '<div style="margin-top:4px;color:' + (status.kind === 'err' ? '#DC2626' : '#B45309') + '">' + pxEsc(status.msg) + '</div>';
        h += '<div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">';
        h += '<button data-a="sync" style="padding:6px 8px;border-radius:8px;border:1px solid #CBD5E1;background:#1E3A5F;color:#fff;font-weight:600">Sinkronkan sekarang</button>';
        if (r === 'admin' && scope === 'full') {
          h += '<button data-a="up" style="padding:6px 8px;border-radius:8px;border:1px solid #CBD5E1;background:transparent;color:inherit;font-weight:600">Unggah semua data lokal → server</button>';
          h += '<button data-a="down" style="padding:6px 8px;border-radius:8px;border:1px solid #CBD5E1;background:transparent;color:inherit;font-weight:600">Tarik ulang dari server</button>';
        } else if (!staff) {
          h += '<div style="color:#64748B">Menu unggah/tarik hanya tersedia untuk Admin.</div>';
        }
        h += '</div>';
      }
      panel.innerHTML = h;
    }
    chip.addEventListener('click', () => {
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
      if (panel.style.display === 'block') renderPanel();
    });
    panel.addEventListener('click', async ev => {
      const a = ev.target && ev.target.getAttribute && ev.target.getAttribute('data-a');
      if (!a) return;
      try {
        if (a === 'sync') {
          if (scope === 'none' && role() && role() !== 'siswa') afterLogin(); else await pushNow();
        } else if (a === 'up') {
          if (!confirm('Unggah SEMUA data lokal ke Supabase? Data di server dengan ID yang sama akan ditimpa.')) return;
          setStatus('sync'); await pushNow(true); toast('Sinkronisasi', 'Semua data lokal terunggah ke Supabase.', 'success');
        } else if (a === 'down') {
          if (!confirm('Ganti data di perangkat ini dengan data dari Supabase?')) return;
          setStatus('sync'); await pullFull(); setStatus('ok'); renderApp(); toast('Sinkronisasi', 'Data terbaru ditarik dari Supabase.', 'success');
        }
      } catch (e) { setStatus('err', e.message || String(e)); }
    });

    // ------------------------------------------------------------- util baca
    async function fetchAll(table, select, order, modify) {
      const out = [], size = 1000;
      for (let from = 0; ; from += size) {
        let q = sb.from(table).select(select);
        if (modify) q = modify(q);
        const { data, error } = await q.order(order).range(from, from + size - 1);
        if (error) throw error;
        out.push(...data);
        if (data.length < size) break;
      }
      return out;
    }
    function applyRows(key, rows) {
      state[key] = rows.map(r => r.data).filter(Boolean);
      const m = last[key]; m.clear();
      state[key].forEach(o => m.set(String(o.id), JSON.stringify(o, REPL)));
    }
    function applySettings(rows) {
      rows.forEach(r => {
        if (!SETTINGS.includes(r.key)) return;
        state[r.key] = r.value;
        lastSet.set(r.key, JSON.stringify(r.value, REPL));
      });
    }

    // Data ringan (semua perangkat, termasuk layar login)
    async function pullLite(withStaff) {
      const [set, pk, sc, rm, st, ver] = await Promise.all([
        fetchAll('app_settings', 'key,value', 'key'),
        fetchAll('exam_packages', 'id,data', 'id'),
        fetchAll('schedules', 'id,data', 'id'),
        fetchAll('rooms', 'id,data', 'id'),
        withStaff ? fetchAll('staff_accounts', 'id,data', 'id') : Promise.resolve(null),
        sb.from('sync_state').select('ver').eq('id', 1).maybeSingle()
      ]);
      if (ver && ver.data) lastVer = ver.data.ver;
      serverEmpty = set.length === 0 && pk.length === 0 && (st ? st.length === 0 : false);
      if (serverEmpty) return false;
      applySettings(set);
      applyRows('examPackages', pk);
      applyRows('schedules', sc);
      applyRows('rooms', rm);
      if (st && st.length) applyRows('staffAccounts', st);
      return true;
    }

    // Data lengkap (setelah login Admin/Guru)
    async function pullFull() {
      const has = await pullLite(true);
      if (!has) return 'empty';
      const [stu, qs, aud] = await Promise.all([
        fetchAll('students', 'id,data', 'id'),
        fetchAll('questions', 'id,data', 'id'),
        sb.from('audit_logs').select('ts,actor,action,target,reason').order('ts', { ascending: false }).limit(500)
      ]);
      applyRows('students', stu);
      state.students = sortStudentsByName(state.students);
      applyRows('questions', qs);
      if (aud && aud.data) state.auditLog = aud.data.map(a => ({ ts: Number(a.ts), actor: a.actor, action: a.action, target: a.target, reason: a.reason }));
      cache();
      return 'ok';
    }

    // Data siswa: hanya baris miliknya + soal paket yang aktif untuknya
    async function pullStudent(nis) {
      const { data, error } = await sb.from('students').select('id,data').eq('nis', String(nis)).limit(1);
      if (error) throw error;
      if (!data || !data.length) return null;
      const o = data[0].data;
      const i = state.students.findIndex(x => x.id === o.id);
      if (i >= 0) state.students[i] = o; else state.students.push(o);
      last.students.set(String(o.id), JSON.stringify(o, REPL));
      return o;
    }
    async function pullStudentQuestions(stu) {
      const ids = new Set();
      if (state.examConfig && state.examConfig.activePackageId) ids.add(state.examConfig.activePackageId);
      (state.schedules || []).forEach(sc => {
        if (sc.packageId && Array.isArray(sc.targetStudentIds) && stu && sc.targetStudentIds.includes(stu.id)) ids.add(sc.packageId);
      });
      if (!ids.size) return;
      const list = [...ids];
      const rows = await fetchAll('questions', 'id,data', 'id', q => q.in('package_id', list));
      const fresh = rows.map(r => r.data).filter(Boolean);
      state.questions = state.questions.filter(q => !ids.has(q.packageId)).concat(fresh);
    }

    // ------------------------------------------------------------- util tulis
    async function pushTable(key, opt) {
      const cfg = TABLES[key], m = last[key], size = cfg.batch || 100;
      const cur = new Map(), up = [];
      for (const o of (state[key] || [])) {
        if (!o || o.id == null) continue;
        const id = String(o.id);
        if (opt.onlyId && id !== String(opt.onlyId)) continue;
        const js = JSON.stringify(o, REPL);
        cur.set(id, js);
        if (opt.force || m.get(id) !== js) up.push({ o, id, js });
      }
      const del = (opt.force || opt.onlyId) ? [] : [...m.keys()].filter(id => !cur.has(id));
      for (let i = 0; i < up.length; i += size) {
        const part = up.slice(i, i + size);
        const rows = part.map(x => Object.assign({ id: x.id }, cfg.cols(x.o), { data: JSON.parse(x.js), updated_by: CLIENT_ID }));
        const { error } = await sb.from(cfg.t).upsert(rows, { onConflict: 'id' });
        if (error) throw error;
        part.forEach(x => m.set(x.id, x.js));
      }
      for (let i = 0; i < del.length; i += 100) {
        const part = del.slice(i, i + 100);
        const { error } = await sb.from(cfg.t).delete().in('id', part);
        if (error) throw error;
        part.forEach(id => m.delete(id));
      }
    }
    async function pushSettings(force) {
      const rows = [];
      SETTINGS.forEach(k => {
        if (state[k] === undefined) return;
        const js = JSON.stringify(state[k], REPL);
        if (force || lastSet.get(k) !== js) rows.push({ key: k, value: JSON.parse(js), updated_by: CLIENT_ID, _js: js });
      });
      if (!rows.length) return;
      const { error } = await sb.from('app_settings').upsert(rows.map(r => ({ key: r.key, value: r.value, updated_by: r.updated_by })), { onConflict: 'key' });
      if (error) throw error;
      rows.forEach(r => lastSet.set(r.key, r._js));
    }
    async function pushAudit(force) {
      const items = (state.auditLog || []).filter(l => l && (force || l.ts > auditMark));
      if (!items.length) return;
      const rows = items.map(l => ({ ts: l.ts, actor: str(l.actor), action: str(l.action), target: str(l.target), reason: str(l.reason) }));
      const { error } = await sb.from('audit_logs').upsert(rows, { onConflict: 'ts,actor,action', ignoreDuplicates: true });
      if (error) throw error;
      auditMark = Math.max(auditMark, ...items.map(l => l.ts));
    }

    async function pushNow(force) {
      const r = role();
      if (!sb || !r) return;
      if (r === 'siswa' ? scope === 'none' : scope !== 'full') return;
      if (pushing) { dirty = true; return; }
      pushing = true; dirty = false;
      const sid = ownStudentId();
      try {
        if (r === 'siswa') {
          if (sid) await pushTable('students', { onlyId: sid });
        } else {
          for (const key of Object.keys(TABLES)) await pushTable(key, { force });
          await pushSettings(force);
        }
        await pushAudit(force && r !== 'siswa');
        setStatus('ok');
      } catch (e) {
        console.warn('[Supabase] push gagal:', e);
        dirty = true;
        setStatus('err', e.message || String(e));
      } finally {
        pushing = false;
        if (dirty) schedulePush(4000);
      }
    }
    function schedulePush(ms) {
      clearTimeout(pushTimer);
      pushTimer = setTimeout(() => pushNow(), ms == null ? 1500 : ms);
    }

    // --------------------------------------------------------- render lembut
    function softRender() {
      clearTimeout(renderTimer);
      const tryRender = () => {
        const ae = document.activeElement;
        const typing = ae && (/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) || ae.isContentEditable);
        const mb = document.getElementById('modal-backdrop');
        const modal = mb && !mb.classList.contains('hidden');
        const inExam = role() === 'siswa' && state.studentSession.step === 'exam';
        if (!role()) return;
        if (typing || modal || inExam) { renderTimer = setTimeout(tryRender, 3000); return; }
        try { renderApp(); } catch (e) {}
      };
      renderTimer = setTimeout(tryRender, 1200);
    }

    // --------------------------------------------------------------- realtime
    async function onChange(key, p) {
      const m = last[key], arr = state[key];
      if (p.eventType === 'DELETE') {
        const id = String((p.old || {}).id);
        const i = arr.findIndex(x => String(x.id) === id);
        if (i >= 0) arr.splice(i, 1);
        m.delete(id); softRender(); return;
      }
      const rec = p.new || {};
      if (rec.updated_by === CLIENT_ID) return;
      let obj = rec.data;
      if (!obj) {
        const { data } = await sb.from(TABLES[key].t).select('data').eq('id', rec.id).maybeSingle();
        obj = data && data.data;
      }
      if (!obj) return;
      const i = arr.findIndex(x => String(x.id) === String(obj.id));
      if (key === 'students' && i >= 0 && arr[i].rt) obj.rt = arr[i].rt;
      if (i >= 0) arr[i] = obj; else { arr.push(obj); if (key === 'students') state.students = sortStudentsByName(state.students); }
      m.set(String(obj.id), JSON.stringify(obj, REPL));
      softRender();
    }
    function onSettings(p) {
      if (p.eventType === 'DELETE') return;
      const r = p.new || {};
      if (r.updated_by === CLIENT_ID || !SETTINGS.includes(r.key)) return;
      state[r.key] = r.value;
      lastSet.set(r.key, JSON.stringify(r.value, REPL));
      softRender();
    }
    function onAudit(p) {
      const a = p.new; if (!a) return;
      const ts = Number(a.ts);
      if ((state.auditLog || []).some(l => l.ts === ts && l.actor === a.actor && l.action === a.action)) return;
      state.auditLog.unshift({ ts, actor: a.actor, action: a.action, target: a.target, reason: a.reason });
      if (state.auditLog.length > 500) state.auditLog.length = 500;
    }
    function subscribe() {
      if (channel || !sb) return;
      channel = sb.channel('tritas-sync');
      Object.keys(TABLES).forEach(key => {
        channel.on('postgres_changes', { event: '*', schema: 'public', table: TABLES[key].t }, p => onChange(key, p));
      });
      channel.on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, onSettings);
      channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'audit_logs' }, onAudit);
      channel.subscribe(async st => {
        if (st === 'SUBSCRIBED') {
          if (wasDown && scope === 'full') { try { await pullFull(); softRender(); setStatus('ok'); } catch (e) {} }
          wasDown = false;
        } else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') {
          wasDown = true;
        }
      });
    }
    function unsubscribe() {
      if (channel && sb) { try { sb.removeChannel(channel); } catch (e) {} }
      channel = null;
    }

    // ------------------------------------------------- polling (perangkat siswa)
    async function pollTick() {
      if (!sb || role() !== 'siswa' || state.studentSession.step === 'exam') return;
      try {
        const { data, error } = await sb.from('sync_state').select('ver').eq('id', 1).maybeSingle();
        if (error || !data || data.ver === lastVer) return;
        await pullLite(false);
        const me = state.students.find(s => s.id === ownStudentId());
        await pullStudentQuestions(me);
        cache(); softRender();
      } catch (e) { /* diam: coba lagi pada putaran berikutnya */ }
    }

    // ------------------------------------------------------------- alur login
    function afterLogin() {
      const r = role();
      if (!r || !sb) return;
      if (r === 'siswa') { scope = 'student'; setStatus('ok'); schedulePush(2500); return; }
      scope = 'none'; setStatus('sync');
      pullFull().then(async res => {
        if (res === 'empty') {
          if (r === 'admin') {
            scope = 'full';
            await pushNow(true);
            subscribe();
            toast('Supabase', 'Server masih kosong — data awal berhasil diunggah.', 'success');
          } else {
            setStatus('warn', 'Server masih kosong. Login sebagai Admin dulu untuk mengunggah data awal.');
          }
          return;
        }
        scope = 'full'; subscribe(); setStatus('ok');
        try { renderApp(); } catch (e) {}
      }).catch(e => { scope = 'none'; setStatus('err', e.message || String(e)); });
    }

    function hook() {
      const _save = window.pxSave;
      window.pxSave = function () {
        const r = _save.apply(this, arguments);
        if (sb) schedulePush(1500);
        return r;
      };

      const _login = window.handleAuthLogin;
      window.handleAuthLogin = function (e) {
        if (!sb) return _login.call(this, e);
        if (e && e.preventDefault) e.preventDefault();
        const tab = state.authSession.loginTab;
        const uEl = document.getElementById('login-username');
        const username = (uEl ? uEl.value : '').trim();
        const go = () => { _login.call(null, { preventDefault() {} }); afterLogin(); };
        if (tab === 'siswa' && username) {
          setStatus('sync');
          pullStudent(username)
            .then(o => (o ? pullStudentQuestions(o) : null))
            .catch(err => { console.warn('[Supabase] tarik data siswa gagal:', err); setStatus('err', err.message || String(err)); })
            .then(go);
        } else {
          go();
        }
      };

      const _logout = window.logoutSession;
      window.logoutSession = function () {
        if (sb) { pushNow(); unsubscribe(); scope = 'none'; setStatus('idle'); }
        return _logout.apply(this, arguments);
      };

      const _render = window.renderApp;
      window.renderApp = function () {
        const r = _render.apply(this, arguments);
        refreshChipVisibility();
        return r;
      };
    }

    // ----------------------------------------------------------------- mulai
    async function boot() {
      if (!enabled) { window.__sbOn = false; setStatus('off'); return; }
      window.__sbOn = true;
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false, autoRefreshToken: false },
        realtime: { params: { eventsPerSecond: 10 } }
      });
      hook();
      setStatus('sync');
      const attempt = async () => {
        try {
          const has = await pullLite(true);
          cache();
          setStatus(has ? 'idle' : 'warn', has ? '' : 'Server masih kosong. Login sebagai Admin untuk mengunggah data awal.');
          if (!role()) { try { renderApp(); } catch (e) {} }
        } catch (e) {
          console.warn('[Supabase] pull awal gagal:', e);
          setStatus('err', (e.message || String(e)) + ' — mencoba lagi…');
          setTimeout(attempt, 10000);
        }
      };
      await attempt();
      setInterval(pollTick, 30000);
      setInterval(() => { if (scope !== 'none') schedulePush(0); }, 6000);
      window.addEventListener('online', () => schedulePush(0));
      document.addEventListener('visibilitychange', () => { if (document.hidden) pushNow(); });
    }

    if (!enabled) {
      setStatus('off');
      console.info('[Supabase] Belum dikonfigurasi — aplikasi berjalan dalam mode lokal (localStorage).');
    } else {
      boot();
    }
  })();
  </script>

</body>
